frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! ============================================================
! r3 — ASBR (Autonomous System Boundary Router) in Area 0
!
! Topology: [r1] --Area1-- [r2(ABR)] --Area0-- [r3(ASBR)] --Area2-- [r4]
!                                                     |
!                                                   [ext] (192.168.100.0/30)
!
! r3 connects to an "external" node (ext) on a subnet that is NOT
! in any OSPF area. r3 will redistribute a static route to this
! external prefix into OSPF as a Type-5 External LSA.
!
! r3 also connects to area 2 (toward r4), making it both an ABR
! for area 2 and an ASBR for the external prefix.
! ============================================================

interface lo
 ip address 10.0.0.3/32

! Link to r2 — segment 10.1.23.0/30 — in OSPF area 0
! r2 is .1, r3 is .2
interface eth1
 description Link to r2 (10.1.23.0/30, r2=.1 r3=.2) — OSPF area 0
 ip address 10.1.23.2/30

! Link to r4 — segment 10.1.34.0/30 — in OSPF area 2
! r3 is .1, r4 is .2
interface eth2
 description Link to r4 (10.1.34.0/30, r3=.1 r4=.2) — OSPF area 2
 ip address 10.1.34.1/30

! Link to ext — segment 192.168.100.0/30 — NOT in OSPF
! r3 is .1, ext is .2
! This segment is external; r3 will redistribute it into OSPF
interface eth3
 description Link to ext (192.168.100.0/30, r3=.1 ext=.2) — external, not in OSPF
 ip address 192.168.100.1/30

! ============================================================
! TODO: Configure OSPF
!
! Step 1 — Basic OSPF with correct areas:
!   router ospf
!    ospf router-id 10.0.0.3
!    network 10.0.0.3/32 area 0
!    network 10.1.23.0/30 area 0
!    network 10.1.34.0/30 area 2
!    passive-interface lo
!    ! Do NOT include 192.168.100.0/30 here — it is external
!
! Step 2 — Redistribute the external prefix (adds a static route first):
!   ip route 192.168.100.0/24 192.168.100.2
!
!   router ospf
!    redistribute static
!    ! This generates Type-5 External LSAs for the static route.
!    ! r1, r2, and r4 will see O E2 routes for 192.168.100.0/24.
!
! Step 3 — External summarization (ASBR summary):
!   Without summarization: each redistributed prefix becomes its own
!   Type-5 LSA. With summary-address, they are collapsed:
!
!   router ospf
!    summary-address 192.168.100.0/24
!
!   This collapses all redistributed routes within 192.168.100.0/24
!   into a single Type-5 LSA. Very useful when redistributing many
!   prefixes from BGP or another protocol.
!
! Step 4 — Verify Type-5 LSAs:
!   show ip ospf database external   ! Type-5 LSAs
!   show ip route ospf               ! O E2 routes on other routers
!
! Note on metric types:
!   E2 (default): metric does NOT increase as the route crosses routers.
!     All routers see the same cost to the ASBR-assigned metric.
!   E1: metric DOES accumulate intra-domain cost on top of external cost.
!   Change with: redistribute static metric-type 1
! ============================================================
