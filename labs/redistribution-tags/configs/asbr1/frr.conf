frr version 8.5
frr defaults traditional
hostname asbr1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ! Loopback - advertise into both protocols
 ip address 10.0.0.2/32
!
interface eth1
 ! Link to r1: 10.1.10.0/30, asbr1=.2
 ! OSPF area 0 (left domain)
 ip address 10.1.10.2/30
!
interface eth2
 ! Link to r2: 10.2.10.0/30, asbr1=.1
 ! EIGRP AS 100
 ip address 10.2.10.1/30
!
