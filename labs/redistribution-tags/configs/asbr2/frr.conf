frr version 8.5
frr defaults traditional
hostname asbr2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ! Loopback - advertise into both protocols
 ip address 10.0.0.4/32
!
interface eth1
 ! Link to r2: 10.2.20.0/30, asbr2=.2
 ! EIGRP AS 100
 ip address 10.2.20.2/30
!
interface eth2
 ! Link to r3: 10.1.30.0/30, asbr2=.1
 ! OSPF area 0 (right domain)
 ip address 10.1.30.1/30
!
