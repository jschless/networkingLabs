name: redistribution-tags

# Route Tag Loop Prevention Lab
#
# Topology:
#
#  [r1]--OSPF--[asbr1]--EIGRP--[r2]--EIGRP--[asbr2]--OSPF--[r3]
#
# Two separate OSPF domains and one EIGRP domain in the middle.
# asbr1 and asbr2 mutually redistribute OSPF <-> EIGRP.
# Without tags, routes can loop back across both ASBRs.
#
# IP addressing:
#   r1:eth1    <-> asbr1:eth1  = 10.1.10.0/30  (OSPF area 0)
#   asbr1:eth2 <-> r2:eth1     = 10.2.10.0/30  (EIGRP AS 100)
#   r2:eth2    <-> asbr2:eth1  = 10.2.20.0/30  (EIGRP AS 100)
#   asbr2:eth2 <-> r3:eth1     = 10.1.30.0/30  (OSPF area 0)
#
# Loopbacks:
#   r1=10.0.0.1/32, asbr1=10.0.0.2/32, r2=10.0.0.3/32
#   asbr2=10.0.0.4/32, r3=10.0.0.5/32
#
# What you configure:
#   1. OSPF on r1+asbr1 and asbr2+r3 (two separate area 0 domains)
#   2. EIGRP AS 100 on asbr1, r2, asbr2
#   3. Mutual redistribution WITHOUT tags — observe loop problem
#   4. Add route tags to prevent loops (see README for details)

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    asbr1:
      binds:
        - configs/asbr1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf

    asbr2:
      binds:
        - configs/asbr2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1",    "asbr1:eth1"]   # 10.1.10.0/30  OSPF domain left
    - endpoints: ["asbr1:eth2", "r2:eth1"]       # 10.2.10.0/30  EIGRP AS 100
    - endpoints: ["r2:eth2",    "asbr2:eth1"]    # 10.2.20.0/30  EIGRP AS 100
    - endpoints: ["asbr2:eth2", "r3:eth1"]       # 10.1.30.0/30  OSPF domain right
