name: debug-gre-basics

# Debug lab: gw-b's GRE tunnel remote is set to gw-a's LAN IP instead of WAN IP.
# The tunnel interface comes up but no traffic crosses it.
#
# Topology:
#   [host-a] --- [gw-a] ---WAN--- [internet] ---WAN--- [gw-b] --- [host-b]
#    LAN A         |                                      |          LAN B
#              tun0:172.16.0.1                     tun0:172.16.0.2

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    host-a:
      binds:
        - configs/host-a/frr.conf:/etc/frr/frr.conf
    gw-a:
      binds:
        - configs/gw-a/frr.conf:/etc/frr/frr.conf
        - configs/gw-a/setup.sh:/setup.sh
      exec:
        - bash /setup.sh
    internet:
      binds:
        - configs/internet/frr.conf:/etc/frr/frr.conf
    gw-b:
      binds:
        - configs/gw-b/frr.conf:/etc/frr/frr.conf
        - configs/gw-b/setup.sh:/setup.sh
      exec:
        - bash /setup.sh
    host-b:
      binds:
        - configs/host-b/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["host-a:eth1",   "gw-a:eth1"]
    - endpoints: ["gw-a:eth2",     "internet:eth1"]
    - endpoints: ["internet:eth2", "gw-b:eth1"]
    - endpoints: ["gw-b:eth2",     "host-b:eth1"]
