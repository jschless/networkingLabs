frr version 8.5
frr defaults traditional
hostname pe2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: pe2  (Provider Edge)
! Role:  IS-IS + SR underlay, BGP L3VPN toward CE2
!
! Loopback:  10.0.0.3/32
! IS-IS NET: 49.0001.0000.0000.0003.00
! SR SID:    index 3  ->  label 16003  (SRGB base 16000)
! BGP AS:    65000    neighbor 10.0.0.1 (rr1)
!
! L3VPN:     VRF CUST-A, table 100
!            RD  65000:100
!            RT  import/export 65000:100
!            eth2 -> CE2 (AS 65002, 192.168.20.1)
!
! To set up the VRF kernel device when ready:
!   ip link add CUST-A type vrf table 100
!   ip link set CUST-A up
!   ip link set eth2 master CUST-A
!   vtysh -b
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to P2
 ip address 10.1.0.18/30
!
interface eth2
 description to CE2  [will move to VRF CUST-A]
 ip address 192.168.20.2/30
!
end
