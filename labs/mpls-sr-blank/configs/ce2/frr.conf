frr version 8.5
frr defaults traditional
hostname ce2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: ce2  (Customer Edge)
! Role:  eBGP customer site, AS 65002
!
! Loopback:  10.100.2.1/32  (the "customer" prefix to advertise)
! BGP:       AS 65002, neighbor 192.168.20.2 (pe2) remote-as 65000
! -------------------------------------------------------
!
interface lo
 ip address 10.100.2.1/32
!
interface eth1
 description to PE2
 ip address 192.168.20.1/30
!
end
