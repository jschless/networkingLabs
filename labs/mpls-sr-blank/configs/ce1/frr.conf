frr version 8.5
frr defaults traditional
hostname ce1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: ce1  (Customer Edge)
! Role:  eBGP customer site, AS 65001
!
! Loopback:  10.100.1.1/32  (the "customer" prefix to advertise)
! BGP:       AS 65001, neighbor 192.168.10.2 (pe1) remote-as 65000
! -------------------------------------------------------
!
interface lo
 ip address 10.100.1.1/32
!
interface eth1
 description to PE1
 ip address 192.168.10.1/30
!
end
