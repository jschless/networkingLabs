frr version 8.4_git
frr defaults traditional
hostname pe1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to CE1 [will move to VRF CUST-A]
 ip address 192.168.10.2/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description to P1
 ip address 10.1.0.1/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.0.0.2/32
 ip router isis CORE
 isis passive
exit
!
interface eth0
 ip router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
exit
!
