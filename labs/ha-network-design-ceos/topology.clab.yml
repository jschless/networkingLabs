name: ha-network-design-ceos

mgmt:
  network: clab-ha-network-design-ceos-mgmt
  ipv4-subnet: 172.31.255.0/24

# High-Availability Network Design Lab — Arista cEOS
#
# Focus areas:
# - Link HA: LACP + MLAG at distribution layer
# - Gateway HA: VRRP with upstream tracking
# - Control-plane HA: OSPF ECMP + BFD + GR behavior checks
# - WAN HA: dual edge + dual ISP using eBGP
#
# Resource optimization:
# - Keep the six control-plane cEOS nodes (dist/core/edge)
# - Replace ISP routers with FRR Linux containers
# - Replace host/application endpoints with lightweight Linux containers
#
#                  (Campus / DC side)                     (WAN side)
#
#         hosta
#       (LACP Po1)
#         /   \
#     [dist1]===[dist2]   <- MLAG pair
#        |  \   /  |
#        |   \ /   |
#      [core1]   [core2]
#         |  \   /  |
#         |   \ /   |
#       [edge1]   [edge2]
#          |         |
#        [isp1]   [isp2]
#           \       /
#              [app1]
#
# Pre-configured:
# - Host, routed interface IPs, loopbacks
# - No MLAG, VRRP, OSPF, BFD, or BGP protocol config
#
# Your tasks:
# - Build HA services in phases in README.md

topology:
  nodes:
    dist1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/dist1/startup-config

    dist2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/dist2/startup-config

    core1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/core1/startup-config

    core2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/core2/startup-config

    edge1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/edge1/startup-config

    edge2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/edge2/startup-config

    isp1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/isp1/frr.conf:/etc/frr/frr.conf
        - configs/isp1/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh
        - vtysh -b

    isp2:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/isp2/frr.conf:/etc/frr/frr.conf
        - configs/isp2/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh
        - vtysh -b

    hosta:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/hosta/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    app1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/app1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    # Host dual-homing to distribution (LACP/MLAG task)
    - endpoints: ["hosta:eth1", "dist1:eth1"]
    - endpoints: ["hosta:eth2", "dist2:eth1"]

    # Distribution interconnects
    - endpoints: ["dist1:eth2", "dist2:eth2"]   # MLAG peer-link member 1
    - endpoints: ["dist1:eth3", "dist2:eth3"]   # MLAG peer-link member 2
    - endpoints: ["dist1:eth6", "dist2:eth6"]   # MLAG keepalive L3

    # Dist <-> Core (L3 ECMP underlay)
    - endpoints: ["dist1:eth4", "core1:eth1"]   # 10.0.1.0/31
    - endpoints: ["dist1:eth5", "core2:eth1"]   # 10.0.1.2/31
    - endpoints: ["dist2:eth4", "core1:eth2"]   # 10.0.1.4/31
    - endpoints: ["dist2:eth5", "core2:eth2"]   # 10.0.1.6/31

    # Core <-> Edge (L3 ECMP)
    - endpoints: ["core1:eth3", "edge1:eth1"]   # 10.0.2.0/31
    - endpoints: ["core1:eth4", "edge2:eth1"]   # 10.0.2.2/31
    - endpoints: ["core2:eth3", "edge1:eth2"]   # 10.0.2.4/31
    - endpoints: ["core2:eth4", "edge2:eth2"]   # 10.0.2.6/31

    # Edge <-> ISP (eBGP)
    - endpoints: ["edge1:eth3", "isp1:eth1"]    # 203.0.113.0/31
    - endpoints: ["edge2:eth3", "isp2:eth1"]    # 203.0.113.2/31

    # ISP <-> Application (dual-homed)
    - endpoints: ["isp1:eth2", "app1:eth1"]     # 198.51.100.0/31
    - endpoints: ["isp2:eth2", "app1:eth2"]     # 198.51.100.2/31
