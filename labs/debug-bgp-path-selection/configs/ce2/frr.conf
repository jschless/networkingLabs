frr version 8.5
frr defaults traditional
hostname ce2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.4/32
!
interface eth1
 description to isp1 (AS65100)
 ip address 10.1.21.2/30
!
interface eth2
 description to isp2 (AS65100)
 ip address 10.1.22.2/30
!
router bgp 65002
 no bgp ebgp-requires-policy
 bgp router-id 10.0.0.4
 neighbor 10.1.21.1 remote-as 65100
 neighbor 10.1.22.1 remote-as 65100
 address-family ipv4 unicast
  neighbor 10.1.21.1 activate
  neighbor 10.1.22.1 activate
  network 10.0.0.4/32
 exit-address-family
!
end
