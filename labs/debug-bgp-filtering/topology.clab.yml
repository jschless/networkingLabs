name: debug-bgp-filtering

# Debug lab — BGP prefix filtering with an intentional misconfiguration.
# r2 intends to block 172.16.2.0/24 from reaching r3 and r4.
# Something is wrong with the prefix-list direction on r2.
#
# Topology:
#   [r1]─eBGP─[r2]─eBGP─[r3]─eBGP─[r4]
#   AS65001    AS65002    AS65003    AS65004

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    r1:
      startup-config: configs/r1/startup-config
    r2:
      startup-config: configs/r2/startup-config
    r3:
      startup-config: configs/r3/startup-config
    r4:
      startup-config: configs/r4/startup-config

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30
