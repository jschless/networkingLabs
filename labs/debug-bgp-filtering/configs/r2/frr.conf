frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.2/32

interface eth1
 ip address 10.1.12.2/30

interface eth2
 ip address 10.1.23.1/30

ip prefix-list BLOCK-172-16-2 seq 5 deny 172.16.2.0/24
ip prefix-list BLOCK-172-16-2 seq 10 permit 0.0.0.0/0 le 32

router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.1.12.1 remote-as 65001
 neighbor 10.1.23.2 remote-as 65003
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor 10.1.12.1 soft-reconfiguration inbound
  neighbor 10.1.23.2 prefix-list BLOCK-172-16-2 in
 exit-address-family
