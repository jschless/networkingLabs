frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.3/32

interface eth1
 ip address 10.1.23.2/30

interface eth2
 ip address 10.1.34.1/30

ip as-path access-list ONLY-65001 permit _65001$

router bgp 65003
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 10.1.23.1 remote-as 65002
 neighbor 10.1.34.2 remote-as 65004
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  neighbor 10.1.23.1 filter-list ONLY-65001 in
  neighbor 10.1.23.1 soft-reconfiguration inbound
 exit-address-family
