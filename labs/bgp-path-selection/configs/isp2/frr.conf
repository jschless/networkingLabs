frr version 8.5
frr defaults traditional
hostname isp2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: isp2  (AS 65100 — ISP router, iBGP peer with isp1)
!
! isp2 peers eBGP with ce1 (eth1) and ce2 (eth3).
! isp2 peers iBGP with isp1 (eth2) — same AS 65100.
!
! Base config:
!   router bgp 65100
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.3
!    neighbor 10.1.12.1 remote-as 65001    ! eBGP to ce1
!    neighbor 10.1.99.1 remote-as 65100    ! iBGP to isp1
!    neighbor 10.1.22.2 remote-as 65002    ! eBGP to ce2
!    address-family ipv4 unicast
!     neighbor 10.1.12.1 activate
!     neighbor 10.1.99.1 activate
!     neighbor 10.1.99.1 next-hop-self
!     neighbor 10.1.22.2 activate
!     network 10.0.0.3/32
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to ce1 (AS65001)
 ip address 10.1.12.2/30
!
interface eth2
 description to isp1 — iBGP peering
 ip address 10.1.99.2/30
!
interface eth3
 description to ce2 (AS65002)
 ip address 10.1.22.1/30
!
end
