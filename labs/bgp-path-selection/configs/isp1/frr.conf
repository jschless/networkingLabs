frr version 8.5
frr defaults traditional
hostname isp1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: isp1  (AS 65100 — ISP router, iBGP peer with isp2)
!
! isp1 peers eBGP with ce1 (eth1) and ce2 (eth3).
! isp1 peers iBGP with isp2 (eth2) — same AS 65100.
!
! Base config:
!   router bgp 65100
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.2
!    neighbor 10.1.11.1 remote-as 65001    ! eBGP to ce1
!    neighbor 10.1.99.2 remote-as 65100    ! iBGP to isp2
!    neighbor 10.1.21.2 remote-as 65002    ! eBGP to ce2
!    address-family ipv4 unicast
!     neighbor 10.1.11.1 activate
!     neighbor 10.1.99.2 activate
!     neighbor 10.1.99.2 next-hop-self
!     neighbor 10.1.21.2 activate
!     network 10.0.0.2/32
!
! Experiment 2 — Local-Pref (AS65100-wide preference for ce1's traffic):
!   route-map LP-HIGH permit 10
!    set local-preference 200
!   neighbor 10.1.11.1 route-map LP-HIGH in
!   (isp2 will prefer isp1 as exit toward ce1, since LP is carried in iBGP)
!
! Experiment 4 — MED (only compared between paths from same AS):
!   MED is set by the customer (ce1/ce2) and received here.
!   'show bgp ipv4 unicast' will show the metric field for received prefixes.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to ce1 (AS65001)
 ip address 10.1.11.2/30
!
interface eth2
 description to isp2 — iBGP peering
 ip address 10.1.99.1/30
!
interface eth3
 description to ce2 (AS65002)
 ip address 10.1.21.1/30
!
end
