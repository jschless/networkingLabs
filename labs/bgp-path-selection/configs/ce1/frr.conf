frr version 8.5
frr defaults traditional
hostname ce1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: ce1  (AS 65001 — dual-homed customer)
!
! ce1 peers eBGP with isp1 (eth1) and isp2 (eth2).
! Both paths lead to ce2 (AS 65002).
!
! Base config:
!   router bgp 65001
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.1
!    neighbor 10.1.11.2 remote-as 65100    ! to isp1
!    neighbor 10.1.12.2 remote-as 65100    ! to isp2
!    address-family ipv4 unicast
!     neighbor 10.1.11.2 activate
!     neighbor 10.1.12.2 activate
!     network 10.0.0.1/32
!
! Experiment 1 — Weight (prefer isp1 for outbound):
!   neighbor 10.1.11.2 weight 200
!   neighbor 10.1.12.2 weight 100
!   (Weight is local to this router, highest wins, not advertised)
!
! Experiment 3 — AS-path prepend on isp2 (influence inbound from AS65100):
!   route-map PREPEND-ISP2 permit 10
!    set as-path prepend 65001 65001
!   neighbor 10.1.12.2 route-map PREPEND-ISP2 out
!   (Makes path via isp2 look longer to AS65100, so isp1 is preferred inbound)
!
! Experiment 4 — MED (advisory hint to AS65100 for inbound traffic):
!   route-map MED-ISP1 permit 10
!    set metric 10
!   route-map MED-ISP2 permit 10
!    set metric 100
!   neighbor 10.1.11.2 route-map MED-ISP1 out
!   neighbor 10.1.12.2 route-map MED-ISP2 out
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to isp1 (AS65100)
 ip address 10.1.11.1/30
!
interface eth2
 description to isp2 (AS65100)
 ip address 10.1.12.1/30
!
end
