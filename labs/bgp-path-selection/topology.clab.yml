name: bgp-path-selection

# BGP path selection practice — weight, local-preference, AS-path prepend, MED
#
# Topology (diamond — dual-homed CEs):
#
#          [isp1] (AS65100)
#         /        \
#    [ce1]          [ce2]
#    AS65001        AS65002
#         \        /
#          [isp2] (AS65100)
#
# Links:
#   ce1:eth1 ─── isp1:eth1   10.1.11.0/30
#   ce1:eth2 ─── isp2:eth1   10.1.12.0/30
#   isp1:eth2 ── isp2:eth2   10.1.99.0/30  (iBGP)
#   isp1:eth3 ── ce2:eth1    10.1.21.0/30
#   isp2:eth3 ── ce2:eth2    10.1.22.0/30

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    ce1:
      startup-config: configs/ce1/startup-config
    isp1:
      startup-config: configs/isp1/startup-config
    isp2:
      startup-config: configs/isp2/startup-config
    ce2:
      startup-config: configs/ce2/startup-config

  links:
    - endpoints: ["ce1:eth1",  "isp1:eth1"]   # 10.1.11.0/30  ce1-isp1 eBGP
    - endpoints: ["ce1:eth2",  "isp2:eth1"]   # 10.1.12.0/30  ce1-isp2 eBGP
    - endpoints: ["isp1:eth2", "isp2:eth2"]   # 10.1.99.0/30  iBGP peering
    - endpoints: ["isp1:eth3", "ce2:eth1"]    # 10.1.21.0/30  isp1-ce2 eBGP
    - endpoints: ["isp2:eth3", "ce2:eth2"]    # 10.1.22.0/30  isp2-ce2 eBGP
