frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! r1 Interfaces
!
! eth1: connects to r2 over 10.1.12.0/30
!   This is the FAST link (bandwidth 10000 Kbps — EIGRP default).
!   EIGRP will prefer routes via r2 because this link has lower metric.
!
! eth2: connects to r3 over 10.1.13.0/30
!   This is the SLOW link (bandwidth 1000 Kbps).
!   The 'bandwidth' command sets the value EIGRP uses for metric calc.
!   Lower bandwidth = higher EIGRP metric = less preferred path.
!
! lo: loopback 10.0.0.1/32 — used as router-id and reachability target
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.1/32

interface eth1
 description to-r2 (fast link, 10000 Kbps)
 ip address 10.1.12.1/30
 ! bandwidth is already 10000 by default; shown here for clarity
 bandwidth 10000

interface eth2
 description to-r3 (slow link, 1000 Kbps)
 ip address 10.1.13.1/30
 ! Lower bandwidth causes EIGRP to compute a higher metric for this path.
 ! TASK: Set bandwidth 1000 here (it is already pre-configured).
 bandwidth 1000

! -------------------------------------------------------------------
! TASK: Configure EIGRP
!
! router eigrp 100
!  network 10.0.0.0 0.0.0.0 255.255.255.255   <- or use wildcard form
!  network 10.1.12.0 0.0.0.3
!  network 10.1.13.0 0.0.0.3
!  no auto-summary
!
! After initial convergence:
!   show ip eigrp topology          <- see Successor and Feasible Successor
!   show ip route eigrp             <- one path (via r2) or two?
!
! TASK: Add variance to enable unequal-cost load balancing:
!   router eigrp 100
!    variance 2
!
! After variance:
!   show ip route eigrp             <- should now show two paths to 10.0.0.4
!   show ip eigrp topology 10.0.0.4/32  <- check FD and RD values
! -------------------------------------------------------------------
