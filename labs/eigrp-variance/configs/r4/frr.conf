frr version 8.5
frr defaults traditional
hostname r4
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! r4 Interfaces
!
! eth1: connects to r2 over 10.1.24.0/30
! eth2: connects to r3 over 10.1.34.0/30
! lo:   loopback 10.0.0.4/32
!
! r4 is the DESTINATION for the variance exercise.
! r1 will (after variance 2) have two paths to 10.0.0.4/32:
!   Path 1 (Successor):           r1 -> r2 -> r4  (lower metric)
!   Path 2 (Feasible Successor):  r1 -> r3 -> r4  (higher metric)
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.4/32

interface eth1
 description to-r2
 ip address 10.1.24.2/30

interface eth2
 description to-r3
 ip address 10.1.34.2/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100
!
! router eigrp 100
!  network 10.0.0.4/32
!  network 10.1.24.0/30
!  network 10.1.34.0/30
!  no auto-summary
!
! Verify from r1 after variance:
!   show ip route 10.0.0.4          <- two EIGRP entries with different metrics
!   ping 10.0.0.4 source 10.0.0.1  <- should succeed via both paths
! -------------------------------------------------------------------
