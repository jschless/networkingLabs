frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! r2 Interfaces
!
! eth1: connects to r1 over 10.1.12.0/30 (fast link)
! eth2: connects to r4 over 10.1.24.0/30
! lo:   loopback 10.0.0.2/32
!
! r2 is on the FAST path: r1 -> r2 -> r4
! EIGRP will make this the Successor path from r1 to r4.
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.2/32

interface eth1
 description to-r1 (fast link, 10000 Kbps)
 ip address 10.1.12.2/30
 bandwidth 10000

interface eth2
 description to-r4
 ip address 10.1.24.1/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100
!
! router eigrp 100
!  network 10.0.0.2/32
!  network 10.1.12.0/30
!  network 10.1.24.0/30
!  no auto-summary
!
! Verify: show ip eigrp neighbors   <- should see r1 and r4 as neighbors
! Verify: show ip eigrp topology    <- check topology table
! -------------------------------------------------------------------
