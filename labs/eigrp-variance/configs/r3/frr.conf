frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! r3 Interfaces
!
! eth1: connects to r1 over 10.1.13.0/30 (slow link, 1000 Kbps)
! eth2: connects to r4 over 10.1.34.0/30
! lo:   loopback 10.0.0.3/32
!
! r3 is on the SLOW path: r1 -> r3 -> r4
! Because eth1 has bandwidth 1000 (vs 10000 on the r1-r2 link),
! the EIGRP metric for paths through r3 will be higher.
!
! For r3's path to r4 to be installed via variance 2 on r1, its
! Reported Distance (RD) from r3 must be less than r1's current
! Feasible Distance (FD) to r4 via r2. This is the Feasibility
! Condition (FC). Check with: show ip eigrp topology 10.0.0.4/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.3/32

interface eth1
 description to-r1 (slow link, 1000 Kbps)
 ip address 10.1.13.2/30
 ! Match the bandwidth set on r1:eth2
 bandwidth 1000

interface eth2
 description to-r4
 ip address 10.1.34.1/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100
!
! router eigrp 100
!  network 10.0.0.3/32
!  network 10.1.13.0/30
!  network 10.1.34.0/30
!  no auto-summary
!
! Verify: show ip eigrp neighbors   <- should see r1 and r4
! -------------------------------------------------------------------
