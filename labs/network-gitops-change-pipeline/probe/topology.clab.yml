name: network-gitops-probe

mgmt:
  network: network-gitops-probe-mgmt
  ipv4-subnet: 172.31.212.0/24

topology:
  nodes:
    probe1:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.212.11
      startup-config: configs/probe1/startup-config
    probe2:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.212.12
      startup-config: configs/probe2/startup-config

  links:
    - endpoints: ["probe1:eth1", "probe2:eth1"]  # 10.212.12.0/30
