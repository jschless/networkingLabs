name: troubleshooting-range-hybrid-access

mgmt:
  network: clab-troubleshooting-range-hybrid-access-mgmt
  ipv4-subnet: 172.30.253.0/24

topology:
  defaults:
    kind: linux
    image: ops-lab:local
  nodes:
    managed-client:
      binds:
        - configs/managed-client/reset.sh:/opt/range/golden/reset.sh:ro
        - configs/http_probe.py:/opt/range/http_probe.py:ro
      exec:
        - sh /opt/range/golden/reset.sh
    campus-edge:
      binds:
        - configs/router-reset.sh:/opt/range/golden/reset.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - sh /opt/range/golden/reset.sh
    wan-a:
      binds:
        - configs/router-reset.sh:/opt/range/golden/reset.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - sh /opt/range/golden/reset.sh
    wan-b:
      binds:
        - configs/router-reset.sh:/opt/range/golden/reset.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - sh /opt/range/golden/reset.sh
    cloud-edge:
      binds:
        - configs/router-reset.sh:/opt/range/golden/reset.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
        net.ipv6.conf.all.forwarding: "1"
      exec:
        - sh /opt/range/golden/reset.sh
    pep:
      binds:
        - configs/pep/reset.sh:/opt/range/golden/reset.sh:ro
        - configs/pep/pep_proxy.py:/opt/range/pep_proxy.py:ro
      exec:
        - sh /opt/range/golden/reset.sh
    origin-a:
      binds:
        - configs/origin-a/reset.sh:/opt/range/golden/reset.sh:ro
        - configs/origin/app_server.py:/opt/range/app_server.py:ro
      exec:
        - sh /opt/range/golden/reset.sh
    origin-b:
      binds:
        - configs/origin-b/reset.sh:/opt/range/golden/reset.sh:ro
        - configs/origin/app_server.py:/opt/range/app_server.py:ro
      exec:
        - sh /opt/range/golden/reset.sh
    dns:
      binds:
        - configs/dns/reset.sh:/opt/range/golden/reset.sh:ro
        - configs/dns/dnsmasq.conf:/opt/range/golden/dnsmasq.conf:ro
      exec:
        - sh /opt/range/golden/reset.sh

  links:
    - endpoints: ["managed-client:eth1", "campus-edge:eth1"] # 10.70.10.0/24, 2001:db8:70:10::/64
    - endpoints: ["campus-edge:eth2", "wan-a:eth1"]          # 10.70.12.0/30, 2001:db8:70:12::/64
    - endpoints: ["campus-edge:eth3", "wan-b:eth1"]          # 10.70.13.0/30, 2001:db8:70:13::/64
    - endpoints: ["wan-a:eth2", "cloud-edge:eth1"]           # 10.70.24.0/30, 2001:db8:70:24::/64
    - endpoints: ["wan-b:eth2", "cloud-edge:eth2"]           # 10.70.25.0/30, 2001:db8:70:25::/64
    - endpoints: ["cloud-edge:eth3", "pep:eth1"]             # 10.70.30.0/24, 2001:db8:70:30::/64
    - endpoints: ["cloud-edge:eth4", "origin-a:eth1"]        # 10.70.41.0/24, 2001:db8:70:41::/64
    - endpoints: ["cloud-edge:eth5", "origin-b:eth1"]        # 10.70.42.0/24, 2001:db8:70:42::/64
    - endpoints: ["cloud-edge:eth6", "dns:eth1"]             # 10.70.53.0/24, 2001:db8:70:53::/64
