frr version 8.5
frr defaults traditional
hostname internet
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 ! WAN A link: 203.0.113.0/30, internet=.2
 ip address 203.0.113.2/30
!
interface eth2
 ! WAN B link: 203.0.113.4/30, internet=.5
 ip address 203.0.113.5/30
!
! NOTE: ip_forward is set via sysctl in topology.yml
! No routing protocol needed — directly connected routes cover both WAN segments
!
end
