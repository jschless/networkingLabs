name: gre-ipsec

# GRE over IPsec Lab
#
# Combine GRE (for routing protocol support) with IPsec transport mode
# (for encryption). Classic enterprise WAN pattern.
#
# Topology:
#
#   [host-a] --- [gw-a] ---WAN--- [internet] ---WAN--- [gw-b] --- [host-b]
#
# Physical addressing (pre-configured):
#   LAN A:   192.168.1.0/24
#     host-a eth1: 192.168.1.10    default route -> 192.168.1.1
#     gw-a   eth1: 192.168.1.1
#   WAN:
#     gw-a     eth2: 203.0.113.1/30
#     internet eth1: 203.0.113.2/30
#     internet eth2: 203.0.113.5/30
#     gw-b     eth1: 203.0.113.6/30
#   LAN B:   192.168.2.0/24
#     gw-b   eth2: 192.168.2.1
#     host-b eth1: 192.168.2.10    default route -> 192.168.2.1
#
# GRE tunnel (pre-configured by VyOS startup-config):
#   gw-a tun0: 172.16.0.1/30
#   gw-b tun0: 172.16.0.2/30
#   GRE local/remote = WAN IPs
#
# What you configure:
#   - Native VyOS IKEv2/IPsec on gw-a and gw-b
#   - IPsec transport mode protecting GRE (proto 47) between WAN IPs
#   - Verify `show vpn ike sa` / `show vpn ipsec sa`
#
# Node images:
#   gw-a, gw-b:            vyos:local
#   host-a, host-b:        frr-lab:local
#   internet:              ceos:4.35.2F

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv4.ip_forward: "1"

  nodes:
    host-a:
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/host-a/frr.conf:/etc/frr/frr.conf
      exec:
        - bash -c 'ip route del default dev eth0 2>/dev/null || true'
        - vtysh -b
        - ip route replace default via 192.168.1.1

    gw-a:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/gw-a/config.boot

    internet:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/internet/startup-config

    gw-b:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/gw-b/config.boot

    host-b:
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/host-b/frr.conf:/etc/frr/frr.conf
      exec:
        - bash -c 'ip route del default dev eth0 2>/dev/null || true'
        - vtysh -b
        - ip route replace default via 192.168.2.1

  links:
    - endpoints: ["host-a:eth1",   "gw-a:eth1"]      # 192.168.1.0/24  LAN A
    - endpoints: ["gw-a:eth2",     "internet:eth1"]   # 203.0.113.0/30  WAN A
    - endpoints: ["internet:eth2", "gw-b:eth1"]       # 203.0.113.4/30  WAN B
    - endpoints: ["gw-b:eth2",     "host-b:eth1"]     # 192.168.2.0/24  LAN B
