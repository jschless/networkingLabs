name: gre-ipsec

# Native VyOS GRE-over-IPsec Build lab. The GRE overlay and static routes are
# prerequisite scaffold; the learned IKEv2/ESP configuration is absent.

topology:
  nodes:
    host-a:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-a/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    gw-a:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/gw-a/config.boot
      binds:
        - configs/gw-a/apply-solution.sh:/opt/gre-ipsec/apply-solution.sh:ro

    internet:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/internet/setup.sh:/setup.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    gw-b:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/gw-b/config.boot
      binds:
        - configs/gw-b/apply-solution.sh:/opt/gre-ipsec/apply-solution.sh:ro
        - configs/gw-b/inject-fault.sh:/opt/gre-ipsec/inject-fault.sh:ro
        - configs/gw-b/restore-hash.sh:/opt/gre-ipsec/restore-hash.sh:ro

    host-b:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-b/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["host-a:eth1",   "gw-a:eth1"]      # 192.168.1.0/24  LAN A
    - endpoints: ["gw-a:eth2",     "internet:eth1"]   # 203.0.113.0/30  WAN A
    - endpoints: ["internet:eth2", "gw-b:eth1"]       # 203.0.113.4/30  WAN B
    - endpoints: ["gw-b:eth2",     "host-b:eth1"]     # 192.168.2.0/24  LAN B
