name: debug-vrf-lite

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    pe1:
      startup-config: configs/pe1/startup-config

    pe2:
      startup-config: configs/pe2/startup-config

    ce-a1:
      startup-config: configs/ce-a1/startup-config

    ce-a2:
      startup-config: configs/ce-a2/startup-config

    ce-b1:
      startup-config: configs/ce-b1/startup-config

    ce-b2:
      startup-config: configs/ce-b2/startup-config

  links:
    # VRF-RED links
    - endpoints: ["ce-a1:eth1", "pe1:eth1"]   # 10.10.12.0/30  RED
    - endpoints: ["pe1:eth2",   "pe2:eth1"]   # 10.10.99.0/30  RED inter-PE
    - endpoints: ["pe2:eth2",   "ce-a2:eth1"] # 10.10.34.0/30  RED
    # VRF-BLUE links
    - endpoints: ["ce-b1:eth1", "pe1:eth3"]   # 10.20.12.0/30  BLUE
    - endpoints: ["pe1:eth4",   "pe2:eth3"]   # 10.20.99.0/30  BLUE inter-PE
    - endpoints: ["pe2:eth4",   "ce-b2:eth1"] # 10.20.34.0/30  BLUE
