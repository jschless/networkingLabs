name: graceful-restart

# Graceful Restart Practice Lab  (FRR)
#
# Teaches BGP Graceful Restart (RFC 4724) and OSPF NSF/GR.
# Graceful Restart allows a routing process to restart without causing
# a full reconvergence — neighbors preserve stale routes during the restart
# interval, keeping traffic flowing during planned maintenance.
#
# Topology (triangle):
#         [r1]
#        /    \
#     [r2]----[r3]
#
# Links:
#   r1:eth1 <-> r2:eth1   10.0.12.0/30
#   r2:eth2 <-> r3:eth1   10.0.23.0/30
#   r1:eth2 <-> r3:eth2   10.0.13.0/30
#
# OSPF area 0 on all links, iBGP AS65000 (r1 is route reflector)
#
# Pre-configured: All routing (OSPF + iBGP with GR enabled).
# Your task: Restart FRR on r2, measure packet loss with/without GR.

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]    # 10.0.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"]    # 10.0.23.0/30
    - endpoints: ["r1:eth2", "r3:eth2"]    # 10.0.13.0/30
