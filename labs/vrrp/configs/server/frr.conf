frr version 8.5
frr defaults traditional
hostname server
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! server is reachable from the LAN via either r1 or r2
! eth1 = link to r1:eth2 (10.0.1.0/30)
! eth2 = link to r2:eth2 (10.0.2.0/30)
! lo   = server loopback (ping target for failover testing)

interface lo
 ip address 10.99.0.1/32

interface eth1
 ! Link to r1
 ip address 10.0.1.2/30

interface eth2
 ! Link to r2
 ip address 10.0.2.2/30

! Default routes back toward the LAN via both routers (ECMP)
ip route 192.168.1.0/24 10.0.1.1
ip route 192.168.1.0/24 10.0.2.1
