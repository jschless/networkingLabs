frr version 8.5
frr defaults traditional
hostname host
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! host sits on the LAN segment only
! it uses the VRRP VIP (192.168.1.254) as its default gateway
interface eth1
 ! LAN interface — host address
 ip address 192.168.1.10/24

ip route 0.0.0.0/0 192.168.1.254
