frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! r1 is the VRRP MASTER (priority 110, preempt enabled)
! eth1 = LAN segment (shared with r2 and host via br-lan)
! eth2 = link to server

interface eth1
 ! LAN interface — r1 real IP; VRRP VIP 192.168.1.254 goes here (user configures)
 ip address 192.168.1.1/24

interface eth2
 ! Point-to-point link to server:eth1
 ip address 10.0.1.1/30

! Static route to server loopback via eth2
ip route 10.99.0.1/32 10.0.1.2

