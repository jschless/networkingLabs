name: bgp-rpki

# BGP RPKI / Route Origin Validation Practice Lab  (FRR + Python RTR server)
#
# Topology:
#   [isp1 AS65100] ---eth1--- [edge AS65000] ---eth2--- [hijacker AS65999]
#                                    |eth3
#                             [rpki-server :3323]
#
# IP Addressing:
#   isp1         eth1: 10.0.1.1/30     lo: 10.0.0.10/32
#   edge         eth1: 10.0.1.2/30     lo: 10.0.0.1/32
#                eth2: 10.0.2.1/30     eth3: 10.0.3.1/30
#   hijacker     eth1: 10.0.2.2/30     lo: 10.0.0.99/32
#   rpki-server  eth1: 10.0.3.2/30
#
# ROA Database (served by rpki-server):
#   10.100.0.0/24  maxLen 24  AS65100  → isp1 announcement is VALID
#   10.200.0.0/24  maxLen 24  AS65200  → nobody announces → NOT-FOUND on edge
#   hijacker announces 10.100.0.0/24 as AS65999 → INVALID (origin AS mismatch)
#
# Pre-configured: IP addressing, eBGP sessions, RPKI cache connection on edge,
#                 ROV policy route-map on edge.
# Your task: Verify RPKI states, observe ROV in action, and experiment with policy.

topology:
  nodes:
    rpki-server:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/rpki-server/setup.sh:/setup.sh
        - configs/rpki-server/rtr_server.py:/rtr_server.py
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    isp1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/isp1/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - vtysh -b

    edge:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/edge/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash -c 'sleep 5 && vtysh -b'

    hijacker:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/hijacker/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - vtysh -b

  links:
    - endpoints: ["isp1:eth1",      "edge:eth1"]        # 10.0.1.0/30
    - endpoints: ["edge:eth2",      "hijacker:eth1"]    # 10.0.2.0/30
    - endpoints: ["edge:eth3",      "rpki-server:eth1"] # 10.0.3.0/30
