frr version 8.4
frr defaults traditional
hostname isp1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! isp1 — legitimate ISP, AS65100
! Announces 10.100.0.0/24 which has a matching ROA (AS65100, maxLen 24).
! Edge will see this route as VALID.
!
interface lo
 ip address 10.0.0.10/32
!
interface eth1
 description to edge (AS65000)
 ip address 10.0.1.1/30
!
router bgp 65100
 bgp router-id 10.0.0.10
 no bgp ebgp-requires-policy
 !
 neighbor 10.0.1.2 remote-as 65000
 neighbor 10.0.1.2 description edge
 !
 address-family ipv4 unicast
  neighbor 10.0.1.2 activate
  network 10.100.0.0/24
 exit-address-family
!
! Static black-hole so the network statement is accepted
ip route 10.100.0.0/24 Null0
!
end
