frr version 8.4
frr defaults traditional
hostname hijacker
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! hijacker — rogue router, AS65999
! Announces 10.100.0.0/24 — the same prefix as isp1 — but with origin AS65999.
! The ROA for 10.100.0.0/24 only authorizes AS65100, so edge will see this
! route as INVALID (origin AS mismatch).
!
interface lo
 ip address 10.0.0.99/32
!
interface eth1
 description to edge (AS65000)
 ip address 10.0.2.2/30
!
router bgp 65999
 bgp router-id 10.0.0.99
 no bgp ebgp-requires-policy
 !
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 description edge
 !
 address-family ipv4 unicast
  neighbor 10.0.2.1 activate
  network 10.100.0.0/24
 exit-address-family
!
! Static black-hole so the network statement is accepted
ip route 10.100.0.0/24 Null0
!
end
