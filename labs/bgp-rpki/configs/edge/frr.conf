frr version 8.4
frr defaults traditional
hostname edge
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! edge — AS65000 — the router under test
!
! Peers with:
!   isp1     (10.0.1.1, AS65100) — legitimate, announces VALID prefix
!   hijacker (10.0.2.2, AS65999) — rogue,      announces INVALID prefix
!
! RPKI cache connection to the local RTR server at 10.0.3.2:3323.
! ROA database covers:
!   10.100.0.0/24  maxLen 24  AS65100  → isp1 route = VALID
!                                        hijacker route = INVALID (wrong origin)
!   10.200.0.0/24  maxLen 24  AS65200  → not announced → would be NOT-FOUND
!
! Route-map RPKI-POLICY implements ROV:
!   VALID    → accept, local-preference 200
!   NOTFOUND → accept, local-preference 100
!   INVALID  → DROP
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to isp1 (AS65100)
 ip address 10.0.1.2/30
!
interface eth2
 description to hijacker (AS65999)
 ip address 10.0.2.1/30
!
interface eth3
 description to rpki-server (RTR :3323)
 ip address 10.0.3.1/30
!
rpki
 rpki cache 10.0.3.2 3323 preference 1
exit
!
! ---------------------------------------------------------------------------
! ROV route-map — applied inbound on all eBGP peers
!
! Sequence 10: VALID prefix → accept, raise local-preference to 200
! Sequence 20: NOT-FOUND prefix → accept, keep local-preference at 100
! Sequence 30: INVALID prefix → DROP (deny terminates route-map processing)
! Sequence 100: catch-all permit (safety; only reached if rpki match fails)
! ---------------------------------------------------------------------------
!
route-map RPKI-POLICY permit 10
 description VALID - accept with high local-preference
 match rpki valid
 set local-preference 200
!
route-map RPKI-POLICY permit 20
 description NOT-FOUND - accept with normal local-preference
 match rpki notfound
 set local-preference 100
!
route-map RPKI-POLICY deny 30
 description INVALID - drop (origin AS mismatch or prefix-length violation)
 match rpki invalid
!
route-map RPKI-POLICY permit 100
 description catch-all permit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 neighbor 10.0.1.1 remote-as 65100
 neighbor 10.0.1.1 description isp1-VALID
 neighbor 10.0.1.1 route-map RPKI-POLICY in
 !
 neighbor 10.0.2.2 remote-as 65999
 neighbor 10.0.2.2 description hijacker-INVALID
 neighbor 10.0.2.2 route-map RPKI-POLICY in
 !
 address-family ipv4 unicast
  neighbor 10.0.1.1 activate
  neighbor 10.0.2.2 activate
 exit-address-family
!
end
