name: enterprise-routed-access-capstone

# Enterprise Routed Access (L3-Everywhere) Capstone — Practice Lab
#
# Modern campus design: every switch is a router, no spanning tree, no L2
# domains spanning multiple switches. OSPF everywhere with BFD for fast failover.
#
# What is pre-configured:
#   - All interface IPs, descriptions, no switchport on all cEOS nodes
#   - Linux host IPs and default routes
#
# What YOU configure:
#   - OSPF on core1, core2 (area 0, BFD)
#   - iBGP stub sessions on core1, core2
#   - OSPF ABR on dist1-4 (area 0 uplinks, area 1 downlinks, stub)
#   - OSPF on acc1, acc2 (area 1 stub, BFD)
#
# See labs/enterprise-routed-access/ for the fully-working reference solution.
#
#                   [core1]----------[core2]
#                   /  | | \        /  | | \
#                  /   | |  \      /   | |  \
#           [dist1][dist2][dist3][dist4]
#              |      |       |      |
#            [acc1]         [acc2]
#            /    \         /    \
#          [h1]  [h2]     [h3]  [h4]
#
# OSPF Areas:
#   Area 0: core1, core2, core-core link, all core-dist links
#   Area 1: dist-acc links, acc-host subnets (dist nodes are ABRs)
#
# Loopbacks:
#   core1: 10.0.0.1/32   core2: 10.0.0.2/32
#   dist1: 10.0.1.1/32   dist2: 10.0.1.2/32   dist3: 10.0.1.3/32   dist4: 10.0.1.4/32
#   acc1:  10.0.2.1/32   acc2:  10.0.2.2/32

topology:
  nodes:
    # ── Core Layer ──────────────────────────────────────────────────────────
    core1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/core1/startup-config

    core2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/core2/startup-config

    # ── Distribution Layer ───────────────────────────────────────────────────
    dist1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/dist1/startup-config

    dist2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/dist2/startup-config

    dist3:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/dist3/startup-config

    dist4:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/dist4/startup-config

    # ── Access Layer ─────────────────────────────────────────────────────────
    acc1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/acc1/startup-config

    acc2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/acc2/startup-config

    # ── Hosts ─────────────────────────────────────────────────────────────────
    h1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/h1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    h2:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/h2/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    h3:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/h3/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    h4:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/h4/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    # ── Core ↔ Distribution (area 0) ─────────────────────────────────────────
    - endpoints: ["core1:eth1", "dist1:eth1"]   # 10.1.0.0/31
    - endpoints: ["core1:eth2", "dist2:eth1"]   # 10.1.0.2/31
    - endpoints: ["core1:eth3", "dist3:eth1"]   # 10.1.0.4/31
    - endpoints: ["core1:eth4", "dist4:eth1"]   # 10.1.0.6/31
    - endpoints: ["core2:eth1", "dist1:eth2"]   # 10.1.1.0/31
    - endpoints: ["core2:eth2", "dist2:eth2"]   # 10.1.1.2/31
    - endpoints: ["core2:eth3", "dist3:eth2"]   # 10.1.1.4/31
    - endpoints: ["core2:eth4", "dist4:eth2"]   # 10.1.1.6/31
    # ── Core ↔ Core (area 0) ──────────────────────────────────────────────────
    - endpoints: ["core1:eth5", "core2:eth5"]   # 10.1.2.0/31
    # ── Distribution ↔ Access (area 1) ───────────────────────────────────────
    - endpoints: ["dist1:eth3", "acc1:eth1"]    # 10.2.0.0/31
    - endpoints: ["dist2:eth3", "acc1:eth2"]    # 10.2.0.2/31
    - endpoints: ["dist3:eth3", "acc2:eth1"]    # 10.2.1.0/31
    - endpoints: ["dist4:eth3", "acc2:eth2"]    # 10.2.1.2/31
    # ── Access ↔ Hosts ─────────────────────────────────────────────────────────
    - endpoints: ["acc1:eth3", "h1:eth1"]       # 10.10.1.0/30
    - endpoints: ["acc1:eth4", "h2:eth1"]       # 10.10.1.4/30
    - endpoints: ["acc2:eth3", "h3:eth1"]       # 10.10.2.0/30
    - endpoints: ["acc2:eth4", "h4:eth1"]       # 10.10.2.4/30
