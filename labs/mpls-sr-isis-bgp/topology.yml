name: mpls-sr-isis-bgp

# Full MPLS/BGP/IS-IS/Segment-Routing lab
#
# Topology:
#
#          [rr1]   AS65000 Route Reflector
#         /     \
#      [p1]────[p2]   P routers (IS-IS + SR-MPLS only)
#       |          |
#     [pe1]     [pe2]  PE routers (IS-IS + SR + BGP L3VPN)
#       |          |
#     [ce1]     [ce2]  CE routers (eBGP, AS65001/65002)
#
# Loopbacks (BGP RIDs / SR Node SIDs):
#   rr1: 10.0.0.1  SID index 1  -> label 16001
#   pe1: 10.0.0.2  SID index 2  -> label 16002
#   pe2: 10.0.0.3  SID index 3  -> label 16003
#   p1:  10.0.0.4  SID index 4  -> label 16004
#   p2:  10.0.0.5  SID index 5  -> label 16005
#
# Transit links (/30):
#   pe1:eth2 <-> p1:eth1   10.1.0.0/30
#   p1:eth2  <-> rr1:eth1  10.1.0.4/30
#   rr1:eth2 <-> p2:eth1   10.1.0.8/30
#   p1:eth3  <-> p2:eth2   10.1.0.12/30  (direct P-P shortcut)
#   p2:eth3  <-> pe2:eth1  10.1.0.16/30
#
# CE links (/30, in VRF CUST-A on PE side):
#   ce1:eth1 <-> pe1:eth1  192.168.10.0/30
#   ce2:eth1 <-> pe2:eth2  192.168.20.0/30

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      # Shared daemons and vtysh.conf for all nodes
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.mpls.platform_labels: "1048575"
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    rr1:
      binds:
        - configs/rr1/frr.conf:/etc/frr/frr.conf

    pe1:
      binds:
        - configs/pe1/frr.conf:/etc/frr/frr.conf
        - configs/pe1/setup.sh:/etc/frr/setup.sh
      exec:
        - bash /etc/frr/setup.sh

    pe2:
      binds:
        - configs/pe2/frr.conf:/etc/frr/frr.conf
        - configs/pe2/setup.sh:/etc/frr/setup.sh
      exec:
        - bash /etc/frr/setup.sh

    p1:
      binds:
        - configs/p1/frr.conf:/etc/frr/frr.conf

    p2:
      binds:
        - configs/p2/frr.conf:/etc/frr/frr.conf

    ce1:
      binds:
        - configs/ce1/frr.conf:/etc/frr/frr.conf

    ce2:
      binds:
        - configs/ce2/frr.conf:/etc/frr/frr.conf

  links:
    # CE -- PE
    - endpoints: ["ce1:eth1",  "pe1:eth1"]   # 192.168.10.0/30  (VRF CUST-A on pe1)
    - endpoints: ["ce2:eth1",  "pe2:eth2"]   # 192.168.20.0/30  (VRF CUST-A on pe2)
    # PE -- P
    - endpoints: ["pe1:eth2",  "p1:eth1"]    # 10.1.0.0/30
    - endpoints: ["pe2:eth1",  "p2:eth3"]    # 10.1.0.16/30
    # P -- RR
    - endpoints: ["p1:eth2",   "rr1:eth1"]   # 10.1.0.4/30
    - endpoints: ["rr1:eth2",  "p2:eth1"]    # 10.1.0.8/30
    # P -- P  (direct shortcut, preferred forwarding path)
    - endpoints: ["p1:eth3",   "p2:eth2"]    # 10.1.0.12/30
