frr version 8.5
frr defaults traditional
hostname pe2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
vrf CUST-A
!
interface lo
 ip address 10.0.0.3/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to P2
 ip address 10.1.0.18/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
! eth2 is placed into VRF CUST-A via exec (ip link set eth2 master CUST-A)
interface eth2 vrf CUST-A
 description to CE2
 ip address 192.168.20.2/30
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.3/32 index 3
!
! Global BGP instance: iBGP to RR, VPNv4 address family
router bgp 65000
 bgp router-id 10.0.0.3
 !
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 description rr1
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.1 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 send-community both
 exit-address-family
!
! VRF BGP instance: eBGP to CE2, exports into VPNv4
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 !
 neighbor 192.168.20.1 remote-as 65002
 neighbor 192.168.20.1 description ce2
 !
 address-family ipv4 unicast
  neighbor 192.168.20.1 activate
  label vpn export auto
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
end
