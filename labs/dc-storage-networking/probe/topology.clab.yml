name: dc-storage-probe

topology:
  defaults:
    kind: linux
    image: dc-storage-tools:1.0.0
  nodes:
    initiator:
      binds:
        - initiator-init.sh:/opt/storage/init.sh:ro
        - vm-exec.sh:/usr/local/bin/vm-exec:ro
        - multipath.conf:/etc/multipath.conf:ro
      exec: ["bash /opt/storage/init.sh"]
    target:
      env:
        STORAGE_ROLE: target
      binds:
        - /lib/modules:/lib/modules:ro
        - target-init.sh:/opt/storage/init.sh:ro
      exec: ["bash /opt/storage/init.sh"]
  links:
    - endpoints: ["initiator:eth1", "target:eth1"] # Storage A 10.111.10.0/24
    - endpoints: ["initiator:eth2", "target:eth2"] # Storage B 10.111.20.0/24
    - endpoints: ["initiator:eth3", "target:eth3"] # Management 10.111.30.0/24
