name: copp-basics

# Software control-plane policing reference. r2 is the learned Linux/FRR
# control-plane role; r1 and r3 provide bounded BGP, OSPF, and transit traffic.
topology:
  defaults:
    kind: linux
    image: copp-lab:local
    cap-add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
      - configs/setup.sh:/setup.sh:ro
    exec:
      - bash /setup.sh

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
