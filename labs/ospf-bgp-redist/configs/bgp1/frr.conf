frr version 8.5
frr defaults traditional
hostname bgp1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: bgp1  (BGP route reflector / transit router)
!
! This router is in AS 65200. It peers eBGP with asbr and
! iBGP with bgp2. It does NOT speak OSPF.
!
! eBGP neighbour: asbr (10.0.23.1) via eth1
! iBGP neighbour: bgp2 (10.0.34.2) via eth2
!
! What you need to configure here:
!
!   router bgp 65200
!    no bgp ebgp-requires-policy
!    neighbor 10.0.23.1 remote-as 65100     ! eBGP to asbr
!    neighbor 10.0.34.2 remote-as 65200     ! iBGP to bgp2
!    address-family ipv4 unicast
!     neighbor 10.0.23.1 activate
!     neighbor 10.0.34.2 activate
!     neighbor 10.0.34.2 next-hop-self      ! fix next-hop for iBGP
!
! Note: next-hop-self is needed because bgp2 won't have a route
! to 10.0.23.0/30 (the eBGP peering subnet). Without it, the
! next-hop for prefixes from asbr will be unreachable on bgp2.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to asbr
 ip address 10.0.23.2/30
!
interface eth2
 description to bgp2
 ip address 10.0.34.1/30
!
end
