frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r1  (OSPF-only router, area 0)
!
! This router speaks only OSPF. It never sees BGP.
! Its loopback prefix (10.0.0.1/32) should end up reachable
! on bgp2 after you configure redistribution on asbr.
!
! What you need to configure here:
!   - OSPF process with router-id 10.0.0.1
!   - ip ospf area 0 on eth1 (link to asbr)
!   - ip ospf area 0 on lo, marked passive
!
! Hint:
!   interface lo
!    ip ospf passive
!    ip ospf area 0
!   !
!   interface eth1
!    ip ospf area 0
!   !
!   router ospf
!    ospf router-id 10.0.0.1
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to asbr
 ip address 10.0.12.1/30
!
end
