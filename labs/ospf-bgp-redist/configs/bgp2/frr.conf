frr version 8.5
frr defaults traditional
hostname bgp2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: bgp2  (BGP end-router)
!
! This router is in AS 65200. It peers iBGP with bgp1 only.
! It does NOT speak OSPF.
!
! iBGP neighbour: bgp1 (10.0.34.1) via eth1
!
! What you need to configure here:
!
!   router bgp 65200
!    no bgp ebgp-requires-policy
!    neighbor 10.0.34.1 remote-as 65200     ! iBGP to bgp1
!    address-family ipv4 unicast
!     neighbor 10.0.34.1 activate
!
! After configuration, bgp2 should receive OSPF-redistributed
! prefixes (10.0.0.1/32, 10.0.0.2/32, etc.) via BGP.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.4/32
!
interface eth1
 description to bgp1
 ip address 10.0.34.2/30
!
end
