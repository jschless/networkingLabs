frr version 8.5
frr defaults traditional
hostname asbr
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: asbr  (Autonomous System Boundary Router)
!
! This is the most important node in the lab. It sits at the
! boundary between the OSPF domain and the BGP AS.
!
! AS number: 65100
! OSPF neighbour: r1 (10.0.12.1) via eth1
! eBGP neighbour: bgp1 (10.0.23.2) via eth2
!
! What you need to configure here:
!
!   Step 1 — OSPF (same as r1)
!     interface lo
!      ip ospf passive
!      ip ospf area 0
!     interface eth1
!      ip ospf area 0
!     router ospf
!      ospf router-id 10.0.0.2
!
!   Step 2 — BGP with eBGP peer
!     router bgp 65100
!      no bgp ebgp-requires-policy
!      neighbor 10.0.23.2 remote-as 65200
!      address-family ipv4 unicast
!       neighbor 10.0.23.2 activate
!
!   Step 3 — Redistribute OSPF into BGP
!     router bgp 65100
!      address-family ipv4 unicast
!       redistribute ospf
!
!   Step 4 — Redistribute BGP into OSPF
!     router ospf
!      redistribute bgp
!
!   (Optional) Advertise the loopback into BGP via network statement
!   instead of redistribution — compare the resulting attributes.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1
 ip address 10.0.12.2/30
!
interface eth2
 description to bgp1
 ip address 10.0.23.1/30
!
end
