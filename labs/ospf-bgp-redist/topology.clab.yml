name: ospf-bgp-redist

# OSPF ↔ BGP redistribution practice lab
#
# Topology:
#   [r1]─OSPF─[asbr]─eBGP─[bgp1]─iBGP─[bgp2]
#   AS65100           AS65100  AS65200    AS65200
#
# Goal: r1's OSPF routes appear in bgp2's routing table via redistribution.

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    r1:
      startup-config: configs/r1/startup-config
    asbr:
      startup-config: configs/asbr/startup-config
    bgp1:
      startup-config: configs/bgp1/startup-config
    bgp2:
      startup-config: configs/bgp2/startup-config

  links:
    - endpoints: ["r1:eth1",   "asbr:eth1"]   # 10.0.12.0/30  OSPF
    - endpoints: ["asbr:eth2", "bgp1:eth1"]   # 10.0.23.0/30  eBGP
    - endpoints: ["bgp1:eth2", "bgp2:eth1"]   # 10.0.34.0/30  iBGP
