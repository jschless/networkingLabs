name: ospf-bgp-redist

# OSPF ↔ BGP Redistribution practice lab
#
# IP addressing is pre-configured on every node. You implement the
# routing protocols and redistribution yourself.
#
# Topology:
#
#   [r1] --OSPF area0-- [asbr] --eBGP-- [bgp1] --iBGP-- [bgp2]
#                       AS65100          AS65200
#
# Goal: Make r1's loopback (10.0.0.1) reachable from bgp2 (10.0.0.4)
# and vice versa, entirely through redistribution at the ASBR.
#
# Suggested order:
#   1. OSPF on r1 and asbr (area 0, loopbacks passive)
#   2. eBGP between asbr (AS 65100) and bgp1 (AS 65200)
#   3. iBGP between bgp1 and bgp2 (same AS 65200)
#   4. redistribute ospf into bgp on asbr
#   5. redistribute bgp into ospf on asbr
#   6. Verify end-to-end reachability

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    asbr:
      binds:
        - configs/asbr/frr.conf:/etc/frr/frr.conf

    bgp1:
      binds:
        - configs/bgp1/frr.conf:/etc/frr/frr.conf

    bgp2:
      binds:
        - configs/bgp2/frr.conf:/etc/frr/frr.conf

  links:
    # r1 -- asbr  (OSPF area 0)
    - endpoints: ["r1:eth1", "asbr:eth1"]    # 10.0.12.0/30
    # asbr -- bgp1  (eBGP peering)
    - endpoints: ["asbr:eth2", "bgp1:eth1"]  # 10.0.23.0/30
    # bgp1 -- bgp2  (iBGP peering)
    - endpoints: ["bgp1:eth2", "bgp2:eth1"]  # 10.0.34.0/30
