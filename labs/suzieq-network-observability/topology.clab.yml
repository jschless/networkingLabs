name: suzieq-network-observability

mgmt:
  network: suzieq-lab-mgmt
  ipv4-subnet: 172.31.42.0/24

topology:
  nodes:
    r1:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.42.11
      startup-config: configs/r1/startup-config

    r2:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.42.12
      startup-config: configs/r2/startup-config

    r3:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.42.13
      startup-config: configs/r3/startup-config

    suzieq:
      kind: linux
      image: suzieq-lab:local
      mgmt-ipv4: 172.31.42.100
      binds:
        - suzieq:/workspace
      cmd: sleep infinity

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30
