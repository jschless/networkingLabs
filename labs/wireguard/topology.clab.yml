name: wireguard

topology:
  nodes:
    wan:
      kind: linux
      image: ops-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/wan/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    hub:
      kind: linux
      image: wireguard-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      sysctls:
        net.ipv4.ip_forward: "1"
      binds:
        - configs/hub/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    gw-a:
      kind: linux
      image: wireguard-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      sysctls:
        net.ipv4.ip_forward: "1"
      binds:
        - configs/gw-a/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    gw-b:
      kind: linux
      image: wireguard-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      sysctls:
        net.ipv4.ip_forward: "1"
      binds:
        - configs/gw-b/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

  links:
    - endpoints: ["hub:eth1", "wan:eth1"]
    - endpoints: ["gw-a:eth1", "wan:eth2"]
    - endpoints: ["gw-b:eth1", "wan:eth3"]
