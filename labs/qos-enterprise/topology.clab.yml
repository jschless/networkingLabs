name: qos-enterprise

# The router is the learned native VyOS role. The four Linux nodes are
# incidental traffic generators/receivers. The startup state deliberately has
# only an undifferentiated 2 Mbit/s VyOS rate-control policy on router eth4.

topology:
  defaults:
    kind: linux
    image: qos-lab:local

  nodes:
    router:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/router/config.boot
      binds:
        - configs/router/inject-fault.sh:/opt/qos/inject-fault.sh:ro
        - configs/router/restore.sh:/opt/qos/restore.sh:ro

    client-voice:
      binds:
        - configs/client-voice/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    client-video:
      binds:
        - configs/client-video/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    client-data:
      binds:
        - configs/client-data/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    server:
      binds:
        - configs/server/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

  links:
    - endpoints: ["client-voice:eth1", "router:eth1"]
    - endpoints: ["client-video:eth1", "router:eth2"]
    - endpoints: ["client-data:eth1", "router:eth3"]
    - endpoints: ["router:eth4", "server:eth1"]
