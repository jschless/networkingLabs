name: qos-enterprise

# Linux tc QoS lab — DSCP marking, HTB scheduling, WRED, policing
#
# Topology:
#
#   [client-voice] ---eth1--- \
#   [client-video] ---eth1---  [router] ---eth4--- [server]
#   [client-data]  ---eth1--- /
#
# IP addressing (pre-configured by setup.sh on each node):
#
#   Voice LAN:  10.1.1.0/30
#     client-voice eth1: 10.1.1.1    gw: 10.1.1.2
#     router       eth1: 10.1.1.2
#
#   Video LAN:  10.1.2.0/30
#     client-video eth1: 10.1.2.1    gw: 10.1.2.2
#     router       eth2: 10.1.2.2
#
#   Data LAN:   10.1.3.0/30
#     client-data  eth1: 10.1.3.1    gw: 10.1.3.2
#     router       eth3: 10.1.3.2
#
#   WAN (server-side):  10.2.0.0/30
#     router  eth4: 10.2.0.1
#     server  eth1: 10.2.0.2    gw: 10.2.0.1
#
# Traffic classes on router eth4 (WAN bottleneck, shaped to 2Mbps):
#   1:10  Voice — EF   (DSCP 46 / 0xb8) — 800kbps guaranteed, strict priority
#   1:20  Video — AF41 (DSCP 34 / 0x88) — 600kbps guaranteed, WRED
#   1:30  Data  — BE   (DSCP  0 / 0x00) — 600kbps guaranteed, can borrow
#
# What is pre-configured:
#   - IP addressing on all nodes
#   - iperf3 clients (auto-started) sending traffic with correct DSCP markings
#   - iperf3 server listening on 10.2.0.2
#
# What you run:
#   docker exec -it clab-qos-enterprise-router bash /qos-apply.sh   # enable QoS
#   docker exec -it clab-qos-enterprise-router bash /qos-show.sh    # view stats
#   docker exec -it clab-qos-enterprise-router bash /qos-remove.sh  # tear down

topology:
  defaults:
    kind: linux
    image: qos-lab:local
    sysctls:
      net.ipv4.ip_forward: "1"

  nodes:
    router:
      binds:
        - configs/router/setup.sh:/setup.sh
        - configs/router/qos-apply.sh:/qos-apply.sh
        - configs/router/qos-remove.sh:/qos-remove.sh
        - configs/router/qos-show.sh:/qos-show.sh
      exec:
        - bash /setup.sh

    client-voice:
      binds:
        - configs/client-voice/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    client-video:
      binds:
        - configs/client-video/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    client-data:
      binds:
        - configs/client-data/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    server:
      binds:
        - configs/server/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["client-voice:eth1", "router:eth1"]   # 10.1.1.0/30  Voice LAN
    - endpoints: ["client-video:eth1", "router:eth2"]   # 10.1.2.0/30  Video LAN
    - endpoints: ["client-data:eth1",  "router:eth3"]   # 10.1.3.0/30  Data LAN
    - endpoints: ["router:eth4",       "server:eth1"]   # 10.2.0.0/30  WAN / bottleneck
