frr version 8.5
frr defaults traditional
hostname pe2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: pe2  (Provider Edge — VRF-RED and VRF-BLUE)
!
! Interface-to-VRF mapping:
!   eth1  -> VRF-RED   (to pe1,    10.10.99.0/30)
!   eth2  -> VRF-RED   (to ce-a2,  10.10.34.0/30)
!   eth3  -> VRF-BLUE  (to pe1,    10.20.99.0/30)
!   eth4  -> VRF-BLUE  (to ce-b2,  10.20.34.0/30)
!
! What you need to configure — static routes within each VRF:
!
!   ip route 10.10.0.1/32 10.10.99.1 vrf VRF-RED   ! ce-a1 loopback (via pe1)
!   ip route 10.10.0.2/32 10.10.34.2 vrf VRF-RED   ! ce-a2 loopback
!   ip route 10.20.0.1/32 10.20.99.1 vrf VRF-BLUE  ! ce-b1 loopback (via pe1)
!   ip route 10.20.0.2/32 10.20.34.2 vrf VRF-BLUE  ! ce-b2 loopback
! -------------------------------------------------------
!
interface lo
 ip address 192.168.0.2/32
!
interface eth1 vrf VRF-RED
 description to pe1 RED inter-PE link
 ip address 10.10.99.2/30
!
interface eth2 vrf VRF-RED
 description to ce-a2 (RED)
 ip address 10.10.34.1/30
!
interface eth3 vrf VRF-BLUE
 description to pe1 BLUE inter-PE link
 ip address 10.20.99.2/30
!
interface eth4 vrf VRF-BLUE
 description to ce-b2 (BLUE)
 ip address 10.20.34.1/30
!
end
