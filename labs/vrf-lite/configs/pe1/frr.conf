frr version 8.5
frr defaults traditional
hostname pe1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: pe1  (Provider Edge — VRF-RED and VRF-BLUE)
!
! VRF-RED  (table 100): serves customer A (ce-a1 and ce-a2)
! VRF-BLUE (table 200): serves customer B (ce-b1 and ce-b2)
!
! Interface-to-VRF mapping (already declared below):
!   eth1  -> VRF-RED   (to ce-a1,  10.10.12.0/30)
!   eth2  -> VRF-RED   (to pe2,    10.10.99.0/30)
!   eth3  -> VRF-BLUE  (to ce-b1,  10.20.12.0/30)
!   eth4  -> VRF-BLUE  (to pe2,    10.20.99.0/30)
!
! What you need to configure — static routes within each VRF:
!
!   ip route 10.10.0.1/32 10.10.12.1 vrf VRF-RED   ! ce-a1 loopback
!   ip route 10.10.0.2/32 10.10.99.2 vrf VRF-RED   ! ce-a2 loopback (via pe2)
!   ip route 10.20.0.1/32 10.20.12.1 vrf VRF-BLUE  ! ce-b1 loopback
!   ip route 10.20.0.2/32 10.20.99.2 vrf VRF-BLUE  ! ce-b2 loopback (via pe2)
!
! Verification:
!   show ip route vrf VRF-RED
!   show ip route vrf VRF-BLUE
!
! Isolation check: from ce-a1, ping ce-b1 (10.20.0.1) — should FAIL.
! -------------------------------------------------------
!
interface lo
 ip address 192.168.0.1/32
!
interface eth1 vrf VRF-RED
 description to ce-a1 (RED)
 ip address 10.10.12.2/30
!
interface eth2 vrf VRF-RED
 description to pe2 RED inter-PE link
 ip address 10.10.99.1/30
!
interface eth3 vrf VRF-BLUE
 description to ce-b1 (BLUE)
 ip address 10.20.12.2/30
!
interface eth4 vrf VRF-BLUE
 description to pe2 BLUE inter-PE link
 ip address 10.20.99.1/30
!
end
