frr version 8.5
frr defaults traditional
hostname ce-a1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! Customer A — Site 1 (VRF-RED)
! Pre-configured: IP address, static default route toward PE.
! No routing config needed here — this node is fully set up.
!
interface lo
 ip address 10.10.0.1/32
!
interface eth1
 description to pe1 (VRF-RED)
 ip address 10.10.12.1/30
!
ip route 0.0.0.0/0 10.10.12.2
!
end
