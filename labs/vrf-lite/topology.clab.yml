name: vrf-lite

# The two PEs are the learned native platform. The four customer roles are
# intentionally lightweight Linux traffic endpoints so the lab teaches VRFs,
# not six copies of EOS.

topology:
  nodes:
    pe1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/pe1/startup-config

    pe2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/pe2/startup-config

    ce-a1:
      kind: linux
      image: ops-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/ce-a1/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    ce-a2:
      kind: linux
      image: ops-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/ce-a2/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    ce-b1:
      kind: linux
      image: ops-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/ce-b1/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    ce-b2:
      kind: linux
      image: ops-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/ce-b2/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["ce-a1:eth1", "pe1:eth1"]
    - endpoints: ["pe1:eth2", "pe2:eth1"]
    - endpoints: ["pe2:eth2", "ce-a2:eth1"]
    - endpoints: ["ce-b1:eth1", "pe1:eth3"]
    - endpoints: ["pe1:eth4", "pe2:eth3"]
    - endpoints: ["pe2:eth4", "ce-b2:eth1"]
