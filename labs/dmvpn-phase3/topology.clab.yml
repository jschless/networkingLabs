name: dmvpn-phase3

# DMVPN Phase 3 — Shortcut Routing with Hub Summarization  (Arista cEOS)
#
# Phase 3 = Phase 1 routing (hub-and-spoke OSPF p2mp) + NHRP shortcuts.
# Hub can summarize spoke routes, AND spokes still build direct tunnels on demand.
#
# Topology:
#   [spoke1] (WAN: 10.0.0.11) --\
#   [spoke2] (WAN: 10.0.0.12) ---[hub] (WAN: 10.0.0.1)   br-wan: 10.0.0.0/24
#   [spoke3] (WAN: 10.0.0.13) --/
#
# Tunnel IPs:
#   hub:    172.16.0.1/24   spoke1: 172.16.0.11/24
#   spoke2: 172.16.0.12/24  spoke3: 172.16.0.13/24
#
# Simulated LANs (Loopback1):
#   spoke1: 192.168.1.0/24   spoke2: 192.168.2.0/24   spoke3: 192.168.3.0/24
#
# Key commands:
#   Hub:    ip nhrp redirect  +  OSPF point-to-multipoint  +  summary-address 192.168.0.0/16
#   Spokes: ip nhrp shortcut  +  OSPF point-to-point       (same as Phase 1 + shortcut)
#
# How Phase 3 works (step by step):
#   1. Routing: spoke1 learns 192.168.0.0/16 via hub (OSPF summary from hub)
#   2. spoke1 sends traffic for spoke2 LAN toward hub (per routing table)
#   3. Hub forwards to spoke2 AND sends NHRP redirect to spoke1:
#      "192.168.2.x is reachable via spoke2 (NBMA: 10.0.0.12, tunnel: 172.16.0.12)"
#   4. spoke1 resolves spoke2 and installs shortcut: 192.168.2.0/24 via 172.16.0.12
#   5. The /24 shortcut is MORE SPECIFIC than the /16 summary -> shortcut wins
#   6. Subsequent packets spoke1->spoke2 bypass the hub entirely
#
# vs Phase 2:
#   Phase 2: OSPF broadcast, direct next-hops in routing table, shortcuts
#   Phase 3: OSPF p2mp, hub-and-spoke routing (all via hub), but NHRP shortcuts override
#   Phase 3 advantage: hub can summarize routes (Phase 2 cannot without next-hop-self)
#
# Pre-configured: hub (OSPF p2mp + nhrp redirect + summary-address)
# Your task: Configure NHRP + OSPF + ip nhrp shortcut on each spoke

topology:
  nodes:
    br-wan:
      kind: linux
      image: frr-lab:local
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0

    hub:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/hub/startup-config

    spoke1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spoke1/startup-config

    spoke2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spoke2/startup-config

    spoke3:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spoke3/startup-config

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
