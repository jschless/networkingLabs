frr version 8.4_git
frr defaults traditional
hostname hub
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description WAN NBMA network (10.0.0.0/24)
 ip address 10.0.0.1/24
!
interface tun0
 description DMVPN mGRE hub — nhrpd acts as NHS
 ip nhrp network-id 1
 ip nhrp holdtime 300
 ip nhrp redirect
 ip ospf network point-to-multipoint
 ip ospf area 0.0.0.0
!
! Static summary route — redistributed into OSPF so spokes learn 192.168.0.0/16 via hub.
! The blackhole is added in setup.sh: ip route add blackhole 192.168.0.0/16
ip route 192.168.0.0/16 blackhole
!
router ospf
 ospf router-id 10.0.0.1
 passive-interface lo
 passive-interface eth1
 redistribute static
 summary-address 192.168.0.0/16
!
