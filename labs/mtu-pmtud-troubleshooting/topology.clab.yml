name: mtu-pmtud-troubleshooting

topology:
  defaults:
    kind: linux
    image: ops-lab:local

  nodes:
    host-a:
      binds:
        - configs/host-a/setup.sh:/setup.sh:ro
        - configs/common/df-probe.py:/df-probe.py:ro
        - configs/common/services.py:/services.py:ro
      exec:
        - bash /setup.sh

    edge-a:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/edge-a/config.boot

    provider:
      binds:
        - configs/provider/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    edge-b:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/edge-b/config.boot
      binds:
        - configs/edge-b/inject-fault.sh:/opt/inject-fault.sh:ro

    host-b:
      binds:
        - configs/host-b/setup.sh:/setup.sh:ro
        - configs/common/df-probe.py:/df-probe.py:ro
        - configs/common/services.py:/services.py:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["host-a:eth1", "edge-a:eth1"]
    - endpoints: ["edge-a:eth2", "provider:eth1"]
    - endpoints: ["provider:eth2", "edge-b:eth2"]
    - endpoints: ["edge-b:eth1", "host-b:eth1"]
