frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r2  (EIGRP AS 100)
!
! r2 connects to r1 (eth1) and r4 (eth2).
! It is one of two paths between r1 and r4.
!
! What you need to configure:
!
!   router eigrp 100
!    eigrp router-id 10.0.0.2
!    network 0.0.0.0/0
!    passive-interface lo
!
! To influence path selection, try changing the bandwidth on eth1 or eth2:
!   interface eth1
!    bandwidth 10000       ! in Kbps; lower bandwidth = higher EIGRP metric
!
! EIGRP composite metric: (K1*BW + K3*Delay) * 256  (with default K values)
! Lower bandwidth raises the metric, making this path less preferred.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1
 ip address 10.1.12.2/30
!
interface eth2
 description to r4
 ip address 10.1.24.1/30
!
end
