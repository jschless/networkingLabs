frr version 8.4
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r3  (EIGRP AS 100)
!
! r3 connects to r1 (eth1) and r4 (eth2).
! It is the second of two paths between r1 and r4.
!
! What you need to configure:
!
!   router eigrp 100
!    eigrp router-id 10.0.0.3
!    network 0.0.0.0/0
!    passive-interface lo
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to r1
 ip address 10.1.13.2/30
!
interface eth2
 description to r4
 ip address 10.1.34.1/30
!
end
