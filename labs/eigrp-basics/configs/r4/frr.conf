frr version 8.5
frr defaults traditional
hostname r4
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r4  (EIGRP AS 100)
!
! r4 connects to r2 (eth1) and r3 (eth2).
! It is the destination for the dual-path demonstration.
!
! What you need to configure:
!
!   router eigrp 100
!    eigrp router-id 10.0.0.4
!    network 0.0.0.0/0
!    passive-interface lo
!
! After all routers converge, r4 should have routes to all loopbacks.
! r1 should show r4's loopback (10.0.0.4/32) with either one or two
! ECMP paths — check with 'show ip route eigrp'.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.4/32
!
interface eth1
 description to r2
 ip address 10.1.24.2/30
!
interface eth2
 description to r3
 ip address 10.1.34.2/30
!
end
