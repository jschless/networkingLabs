frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r1  (EIGRP AS 100)
!
! r1 connects to r2 (eth1) and r3 (eth2).
! Two paths exist to r4: via r2 or via r3.
! After configuration, inspect which path is the Successor and
! which (if any) qualifies as a Feasible Successor.
!
! What you need to configure:
!
!   router eigrp 100
!    eigrp router-id 10.0.0.1
!    network 0.0.0.0/0          ! advertise all interfaces
!    passive-interface lo        ! don't send hellos on loopback
!
! Verification:
!   show ip eigrp neighbors                 -- check adjacencies
!   show ip eigrp topology                  -- successor / FS per prefix
!   show ip eigrp topology 10.0.0.4/32      -- detail for r4's loopback
!   show ip route eigrp                     -- EIGRP routes installed
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to r2
 ip address 10.1.12.1/30
!
interface eth2
 description to r3
 ip address 10.1.13.1/30
!
end
