name: eigrp-basics

# EIGRP fundamentals practice lab
#
# IP addressing is pre-configured. You implement EIGRP.
#
# Topology (square — two paths between r1 and r4):
#
#   [r1] --- [r2]
#    |         |
#   [r3] --- [r4]
#
# All routers in EIGRP AS 100.
# r1 has two equal-cost paths to r4: via r2 or via r3.
# Use 'show ip eigrp topology' to inspect successor and feasible successor.

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf
    r4:
      binds:
        - configs/r4/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.1.13.0/30
    - endpoints: ["r2:eth2", "r4:eth1"]   # 10.1.24.0/30
    - endpoints: ["r3:eth2", "r4:eth2"]   # 10.1.34.0/30
