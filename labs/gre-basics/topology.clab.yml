name: gre-basics

topology:
  nodes:
    host-a:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-a/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    gw-a:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/gw-a/startup-config
      binds:
        - configs/eos-forward-ready.sh:/opt/eos-forward-ready.sh:ro
      exec:
        - bash /opt/eos-forward-ready.sh eth1 /tmp/gre-basics-eos-forward.ready

    internet:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/internet/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    gw-b:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/gw-b/startup-config
      binds:
        - configs/eos-forward-ready.sh:/opt/eos-forward-ready.sh:ro
      exec:
        - bash /opt/eos-forward-ready.sh eth2 /tmp/gre-basics-eos-forward.ready

    host-b:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-b/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["host-a:eth1",   "gw-a:eth1"]      # 192.168.1.0/24  LAN A
    - endpoints: ["gw-a:eth2",     "internet:eth1"]   # 203.0.113.0/30  WAN A
    - endpoints: ["internet:eth2", "gw-b:eth1"]       # 203.0.113.4/30  WAN B
    - endpoints: ["gw-b:eth2",     "host-b:eth1"]     # 192.168.2.0/24  LAN B
