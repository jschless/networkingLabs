frr version 8.5
frr defaults traditional
hostname gw-a
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: gw-a  (Site A gateway)
!
! Physical interfaces are pre-configured.
! You create the GRE tunnel and add routing over it.
!
! Step 1 — Create GRE tunnel (run in BASH, not vtysh):
!   docker exec -it clab-gre-basics-gw-a bash
!   ip tunnel add tun0 mode gre local 203.0.113.1 remote 203.0.113.6 ttl 255
!   ip link set tun0 up
!   ip addr add 172.16.0.1/30 dev tun0
!
! Step 2 — Add route to LAN B through the tunnel (in vtysh):
!   ip route 192.168.2.0/24 172.16.0.2
!
! Verification:
!   ping 172.16.0.2                   -- tunnel endpoint reachable?
!   ping 192.168.2.10                 -- LAN B host reachable?
!   ip tunnel show                     -- show tunnel config
!   ip -d link show tun0              -- detailed tunnel info
!
! GRE tunnel parameters:
!   Local  endpoint: 203.0.113.1  (this router's WAN IP)
!   Remote endpoint: 203.0.113.6  (gw-b's WAN IP)
!   Tunnel IP:       172.16.0.1/30
!
! NOTE: The WAN route to 203.0.113.6 goes through 203.0.113.2 (internet).
! This route is pre-configured below as a static route.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to host-a (LAN A)
 ip address 192.168.1.1/24
!
interface eth2
 description to internet (WAN)
 ip address 203.0.113.1/30
!
! Default route toward internet — enables WAN reachability
ip route 0.0.0.0/0 203.0.113.2
!
end
