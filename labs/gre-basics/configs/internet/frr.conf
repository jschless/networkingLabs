frr version 8.5
frr defaults traditional
hostname internet
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! internet — simulated WAN transit router
! Both WAN subnets are directly connected. No configuration needed.
! This router forwards packets between gw-a and gw-b.
!
interface lo
 ip address 10.99.99.1/32
!
interface eth1
 description to gw-a WAN
 ip address 203.0.113.2/30
!
interface eth2
 description to gw-b WAN
 ip address 203.0.113.5/30
!
end
