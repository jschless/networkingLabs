frr version 8.5
frr defaults traditional
hostname gw-b
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: gw-b  (Site B gateway)
!
! Mirror image of gw-a. Create the GRE tunnel and add routing.
!
! Step 1 — Create GRE tunnel (run in BASH):
!   docker exec -it clab-gre-basics-gw-b bash
!   ip tunnel add tun0 mode gre local 203.0.113.6 remote 203.0.113.1 ttl 255
!   ip link set tun0 up
!   ip addr add 172.16.0.2/30 dev tun0
!
! Step 2 — Add route to LAN A through the tunnel (in vtysh):
!   ip route 192.168.1.0/24 172.16.0.1
!
! GRE tunnel parameters:
!   Local  endpoint: 203.0.113.6  (this router's WAN IP)
!   Remote endpoint: 203.0.113.1  (gw-a's WAN IP)
!   Tunnel IP:       172.16.0.2/30
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to internet (WAN)
 ip address 203.0.113.6/30
!
interface eth2
 description to host-b (LAN B)
 ip address 192.168.2.1/24
!
! Default route toward internet
ip route 0.0.0.0/0 203.0.113.5
!
end
