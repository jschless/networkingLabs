frr version 8.5
frr defaults traditional
hostname host-b
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! host-b — LAN B end host
! Pre-configured. No configuration needed here.
!
interface lo
 ip address 192.168.2.100/32
!
interface eth1
 description to gw-b (LAN B gateway)
 ip address 192.168.2.10/24
!
ip route 0.0.0.0/0 192.168.2.1
!
end
