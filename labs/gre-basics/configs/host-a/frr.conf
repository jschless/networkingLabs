frr version 8.5
frr defaults traditional
hostname host-a
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! host-a — LAN A end host
! Pre-configured with IP address and default route toward gw-a.
! No configuration needed here.
!
interface lo
 ip address 192.168.1.100/32
!
interface eth1
 description to gw-a (LAN A gateway)
 ip address 192.168.1.10/24
!
ip route 0.0.0.0/0 192.168.1.1
!
end
