name: ospf-multiarea

# Blank OSPF multi-area practice lab
#
# IP addressing is pre-configured on every node. You implement OSPF yourself.
#
# Suggested order:
#   1. OSPF process "CORE" on each router (router ospf)
#   2. Enable OSPF on each interface with the correct area (ip ospf area X)
#   3. Mark loopbacks passive (ip ospf passive)
#   4. Declare Area 2 as a stub area on r3 and r4
#
# Topology:
#
#   [r1] --Area1-- [r2] --Area0-- [r3] --Area2(stub)-- [r4]
#                 (ABR)            (ABR)
#
#   r1: 10.0.0.1/32  regular Area 1 router
#   r2: 10.0.0.2/32  ABR between Area 0 and Area 1
#   r3: 10.0.0.3/32  ABR between Area 0 and Area 2
#   r4: 10.0.0.4/32  stub Area 2 router

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      # All nodes share the same daemons and vtysh.conf
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      # Re-apply config after containerlab creates all veth pairs
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

    r4:
      binds:
        - configs/r4/frr.conf:/etc/frr/frr.conf

  links:
    # r1 -- r2  (Area 1)
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    # r2 -- r3  (Area 0)
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30
    # r3 -- r4  (Area 2 stub)
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30
