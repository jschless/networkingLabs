frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r3  (ABR — Area 0 and Area 2 stub)
!
! This router is an Area Border Router (ABR).
! eth1 connects to r2 in Area 0 (backbone).
! eth2 connects to r4 in Area 2 (stub area).
! The loopback should be in Area 0.
!
! What you need to configure here:
!   - OSPF process "CORE" with router-id 10.0.0.3
!   - ip ospf area 0 on eth1 (link to r2, backbone side)
!   - ip ospf area 2 on eth2 (link to r4, stub side)
!   - ip ospf area 0 on lo, marked passive
!   - Declare Area 2 as a stub area in the OSPF process:
!       area 2 stub
! Hint:
!   interface lo
!    ip ospf passive
!    ip ospf area 0
!   !
!   interface eth1
!    ip ospf area 0
!   !
!   interface eth2
!    ip ospf area 2
!   !
!   router ospf
!    ospf router-id 10.0.0.3
!    area 2 stub
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to r2
 ip address 10.1.23.2/30
!
interface eth2
 description to r4
 ip address 10.1.34.1/30
!
end
