frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r2  (ABR — Area 0 and Area 1)
!
! This router is an Area Border Router (ABR).
! eth1 connects to r1 in Area 1.
! eth2 connects to r3 in Area 0 (backbone).
! The loopback should be in Area 0 (backbone ABRs
! must participate in the backbone).
!
! What you need to configure here:
!   - OSPF process "CORE" with router-id 10.0.0.2
!   - ip ospf area 1 on eth1 (link to r1, Area 1 side)
!   - ip ospf area 0 on eth2 (link to r3, backbone side)
!   - ip ospf area 0 on lo, marked passive
! Hint:
!   interface lo
!    ip ospf passive
!    ip ospf area 0
!   !
!   interface eth1
!    ip ospf area 1
!   !
!   interface eth2
!    ip ospf area 0
!   !
!   router ospf
!    ospf router-id 10.0.0.2
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1
 ip address 10.1.12.2/30
!
interface eth2
 description to r3
 ip address 10.1.23.1/30
!
end
