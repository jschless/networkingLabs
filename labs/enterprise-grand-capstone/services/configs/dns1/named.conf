// dns1 — campus resolver + DDNS target (grand capstone)
//
// Three jobs:
//   1. Recursive resolver for the campus VLAN subnets (forwarders to the Internet).
//   2. Conditional-forward of lab.corp to the AD DC (dc1) — so campus clients
//      resolve AD names.
//   3. Authoritative, TSIG-updatable zones that Kea (dhcp1) writes leases into:
//      forward campus.lab.corp + the three campus reverse zones.
//
// AD DNS (dc1) is set to conditional-forward campus.lab.corp BACK to dns1, so
// AD-joined hosts resolve the DHCP-registered campus names too.

include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

key "kea-ddns" {
    algorithm hmac-sha256;
    secret "n9hKeZwVvOhCuSdgw9wVWbOnLTZ/hdQbk+8+P+B3rbs=";
};

acl internal-clients {
    10.100.0.0/16;     // services seam
    10.10.10.0/24;     // VLAN 10 corporate
    10.20.20.0/24;     // VLAN 20 voice
    10.30.30.0/24;     // VLAN 30 guest
    192.168.99.0/24;   // VLAN 99 management
    localhost;
};

options {
    directory "/var/cache/bind";
    listen-on    { any; };
    listen-on-v6 { none; };

    recursion yes;
    allow-recursion { internal-clients; };
    forwarders { 8.8.8.8; 1.1.1.1; };

    dnssec-validation auto;
    validate-except { "lab.corp"; "campus.lab.corp"; };
};

// Conditional forward to AD DNS.
zone "lab.corp" {
    type forward;
    forward only;
    forwarders { 10.100.1.10; };
};

// DHCP dynamic forward zone (Kea writes A records here over TSIG).
zone "campus.lab.corp" {
    type master;
    file "/var/lib/bind/db.campus.lab.corp";
    allow-update { key "kea-ddns"; };
};

// DHCP dynamic reverse zones (Kea writes PTR records).
zone "10.10.10.in-addr.arpa" {
    type master;
    file "/var/lib/bind/db.10.10.10";
    allow-update { key "kea-ddns"; };
};
zone "20.20.10.in-addr.arpa" {
    type master;
    file "/var/lib/bind/db.10.20.20";
    allow-update { key "kea-ddns"; };
};
zone "30.30.10.in-addr.arpa" {
    type master;
    file "/var/lib/bind/db.10.30.30";
    allow-update { key "kea-ddns"; };
};
