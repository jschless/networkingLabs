# RADIUS clients (NAS devices) for the grand capstone.
#
# The server answers a request ONLY from a client listed here, using the matching
# shared secret. The Linux access switches (hostapd authenticators) are the NAS
# devices; they reach radius1 over the lab-corp seam via the collapsed core.
#
# In EIT101 Lab 12 authorizing the NAS is a student TODO — the capstone ships it
# done so the campus authenticates out of the box.

client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
}

# The campus access switches sit behind the collapsed core and source RADIUS
# from their management-VLAN (99) address, routed to radius1 over the lab-corp
# seam. Authorize the whole mgmt subnet with one shared secret (planted-fault F2
# breaks the shared secret on one switch).
client campus-access {
    ipaddr   = 192.168.99.0/24
    secret   = testing123
    nas_type = other
}
