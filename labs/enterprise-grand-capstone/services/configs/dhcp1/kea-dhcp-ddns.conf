{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea-ddns-ctrl-socket"
    },

    // D2 receives name-change requests from kea-dhcp4 and pushes TSIG-signed DNS
    // UPDATEs into dns1 (bind9), which holds the dynamic campus.lab.corp forward
    // zone and the campus reverse zones. AD DNS (dc1) conditional-forwards
    // campus.lab.corp to dns1, so AD-joined clients resolve the leased names too.
    "tsig-keys": [
      {
        "name": "kea-ddns",
        "algorithm": "HMAC-SHA256",
        "secret": "n9hKeZwVvOhCuSdgw9wVWbOnLTZ/hdQbk+8+P+B3rbs="
      }
    ],

    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "campus.lab.corp.",
          "key-name": "kea-ddns",
          "dns-servers": [ { "ip-address": "10.100.1.40", "port": 53 } ]
        }
      ]
    },

    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "10.10.10.in-addr.arpa.",
          "key-name": "kea-ddns",
          "dns-servers": [ { "ip-address": "10.100.1.40", "port": 53 } ]
        },
        {
          "name": "20.20.10.in-addr.arpa.",
          "key-name": "kea-ddns",
          "dns-servers": [ { "ip-address": "10.100.1.40", "port": 53 } ]
        },
        {
          "name": "30.30.10.in-addr.arpa.",
          "key-name": "kea-ddns",
          "dns-servers": [ { "ip-address": "10.100.1.40", "port": 53 } ]
        }
      ]
    },

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [ { "output": "/var/log/kea/kea-ddns.log" } ],
        "severity": "INFO"
      }
    ]
  }
}
