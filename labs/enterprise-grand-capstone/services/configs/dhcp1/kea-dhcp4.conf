{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth0" ] },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/leases4.csv"
    },

    "valid-lifetime": 1800,
    "renew-timer": 600,
    "rebind-timer": 1200,

    // Campus clients reach Kea via DHCP relay (giaddr) on the collapsed core.
    // Kea selects the subnet by giaddr, which falls inside each campus subnet
    // below. Replies unicast back to giaddr (a core SVI), reachable because each
    // service container has a campus return-route via the seam VIP (gcap.sh).
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },
    "ddns-send-updates": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "ddns-replace-client-name": "always",
    "ddns-qualifying-suffix": "campus.lab.corp",

    "subnet4": [
      {
        "id": 10,
        "subnet": "10.10.10.0/24",
        "pools": [ { "pool": "10.10.10.100 - 10.10.10.200" } ],
        "relay": { "ip-addresses": [ "10.10.10.2", "10.10.10.3" ] },
        "option-data": [
          { "name": "routers", "data": "10.10.10.1" },
          { "name": "domain-name-servers", "data": "10.100.1.40" },
          { "name": "domain-name", "data": "campus.lab.corp" }
        ]
      },
      {
        "id": 20,
        "subnet": "10.20.20.0/24",
        "pools": [ { "pool": "10.20.20.100 - 10.20.20.200" } ],
        "relay": { "ip-addresses": [ "10.20.20.2", "10.20.20.3" ] },
        "option-data": [
          { "name": "routers", "data": "10.20.20.1" },
          { "name": "domain-name-servers", "data": "10.100.1.40" },
          { "name": "domain-name", "data": "campus.lab.corp" }
        ]
      },
      {
        "id": 30,
        "subnet": "10.30.30.0/24",
        "pools": [ { "pool": "10.30.30.100 - 10.30.30.200" } ],
        "relay": { "ip-addresses": [ "10.30.30.2", "10.30.30.3" ] },
        "option-data": [
          { "name": "routers", "data": "10.30.30.1" },
          { "name": "domain-name-servers", "data": "10.100.1.40" },
          { "name": "domain-name", "data": "campus.lab.corp" }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "/var/log/kea/kea-dhcp4.log" } ],
        "severity": "INFO"
      }
    ]
  }
}
