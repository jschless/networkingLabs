# hostapd — 802.1X authenticator on access-sw1 eth2 (corp-pc).
# driver=wired: 802.1X over a copper port. RADIUS is the real EIT101 radius1,
# reached over the lab-corp seam via the collapsed core (sourced from the
# switch's VLAN-99 management address).
driver=wired
interface=eth2
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

logger_stdout=-1
logger_stdout_level=1

ieee8021x=1
eapol_version=2
eap_reauth_period=3600

auth_server_addr=10.100.20.10
auth_server_port=1812
auth_server_shared_secret=testing123

acct_server_addr=10.100.20.10
acct_server_port=1813
acct_server_shared_secret=testing123

own_ip_addr=192.168.99.11
nas_identifier=access-sw1
