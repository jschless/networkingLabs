frr version 8.4
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r2  (site-2 router, AS 65002)
! Role:  eBGP core + server peering — configured by you
!
! Loopback:  10.0.0.2/32
! Peers:     r1   10.0.12.1   (AS 65001)
!            dns2 10.0.102.2  (AS 65102)
! Locally originated: 172.16.2.0/24 (site-2 clients), 10.0.0.2/32
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1
 ip address 10.0.12.2/30
!
interface eth2
 description to dns2
 ip address 10.0.102.1/30
!
interface eth3
 description site-2 clients
 ip address 172.16.2.1/24
!
end
