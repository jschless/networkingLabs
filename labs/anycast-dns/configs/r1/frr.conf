frr version 8.4
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r1  (site-1 router, AS 65001)
! Role:  eBGP core + server peering — configured by you
!
! Loopback:  10.0.0.1/32
! Peers:     r2   10.0.12.2   (AS 65002)
!            dns1 10.0.101.2  (AS 65101)
! Locally originated: 172.16.1.0/24 (site-1 clients), 10.0.0.1/32
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to r2
 ip address 10.0.12.1/30
!
interface eth2
 description to dns1
 ip address 10.0.101.1/30
!
interface eth3
 description site-1 clients
 ip address 172.16.1.1/24
!
end
