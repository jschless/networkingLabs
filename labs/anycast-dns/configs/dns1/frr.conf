frr version 8.4
frr defaults traditional
hostname dns1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: dns1  (anycast resolver #1 — FRR on the server, AS 65101)
! Role:  advertise the service into the network — configured by you
!
! Unique address: 10.0.0.11/32   (lo — "this specific machine")
! Anycast VIP:    10.53.53.53/32 (lo — owned by the health-check
!                 watchdog; it appears/disappears with dnsmasq.
!                 Do NOT configure it here.)
! Uplink:         eth1 → r1 10.0.101.1 (AS 65001)
!
! Your job (Task 2): eBGP to r1, then advertise ONLY the two lo /32s
! via filtered redistribution. Think about what else counts as
! "connected" on this box before you redistribute.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.11/32
!
interface eth1
 description to r1
 ip address 10.0.101.2/30
!
ip route 172.16.0.0/16 10.0.101.1
!
end
