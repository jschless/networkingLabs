# dnsmasq — anycast resolver instance "dns2"
#
# The DNS layer is scaffolding: this lab is about the routing. Both
# resolvers serve identical records except whoami.lab.test, which names
# the instance that answered — your anycast litmus test.
port=53
no-resolv
no-hosts
log-queries
log-facility=/var/log/dnsmasq.log
# Wildcard socket, filtered by destination address (no bind-interfaces):
# the VIP can come and go on lo without dnsmasq restarting. Listing
# addresses also disables dnsmasq's implicit local-subnet-only filter,
# so the remote client subnets may query us.
listen-address=127.0.0.1,10.53.53.53,10.0.0.12
local=/lab.test/
txt-record=whoami.lab.test,dns2
address=/www.lab.test/192.0.2.80
address=/app.lab.test/192.0.2.81
