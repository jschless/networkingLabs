frr version 8.4
frr defaults traditional
hostname dns2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: dns2  (anycast resolver #2 — FRR on the server, AS 65102)
! Role:  advertise the service into the network — configured by you
!
! Unique address: 10.0.0.12/32   (lo — "this specific machine")
! Anycast VIP:    10.53.53.53/32 (lo — owned by the health-check
!                 watchdog; it appears/disappears with dnsmasq.
!                 Do NOT configure it here.)
! Uplink:         eth1 → r2 10.0.102.1 (AS 65002)
!
! Your job (Task 3): eBGP to r2, then advertise ONLY the two lo /32s
! via filtered redistribution. Think about what else counts as
! "connected" on this box before you redistribute.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.12/32
!
interface eth1
 description to r2
 ip address 10.0.102.2/30
!
end
