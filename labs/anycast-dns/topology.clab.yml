name: anycast-dns

# Anycast DNS build lab. Native cEOS routers provide the ordinary routed
# core. FRR remains on the resolver hosts because coupling a connected
# service /32 to a filtered BGP advertisement is the mechanism being learned.

topology:
  defaults:
    kind: linux

  nodes:
    r1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r1/startup-config

    r2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r2/startup-config

    dns1:
      image: anycast-dns:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/dns1/frr.conf:/etc/frr/frr.conf
        - configs/dns1/dnsmasq.conf:/etc/dnsmasq.conf:ro
        - configs/dns/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        - configs/dns/service-control.sh:/usr/local/bin/service-control.sh:ro
        - configs/dns1/scenario-state.sh:/usr/local/bin/scenario-state.sh:ro
        - configs/dns/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    dns2:
      image: anycast-dns:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/dns2/frr.conf:/etc/frr/frr.conf
        - configs/dns2/dnsmasq.conf:/etc/dnsmasq.conf:ro
        - configs/dns/healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
        - configs/dns/service-control.sh:/usr/local/bin/service-control.sh:ro
        - configs/dns/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    c1:
      image: ops-lab:local
      binds:
        - configs/c1/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    c2:
      image: ops-lab:local
      binds:
        - configs/c2/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "dns1:eth1"]
    - endpoints: ["r2:eth2", "dns2:eth1"]
    - endpoints: ["r1:eth3", "c1:eth1"]
    - endpoints: ["r2:eth3", "c2:eth1"]
