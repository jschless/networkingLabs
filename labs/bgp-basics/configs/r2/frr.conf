frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r2  (AS 65002 — eBGP to r1, iBGP to r3)
!
! r2 peers eBGP with r1 (AS 65001) on eth1.
! r2 peers iBGP with r3 (same AS 65002) on eth2.
!
! KEY CONCEPT: When r2 receives r1's prefix (10.0.0.1/32) from eBGP
! and advertises it to r3 via iBGP, the next-hop stays as r1's IP
! (10.1.12.1). r3 cannot reach 10.1.12.1 unless you add next-hop-self!
!
! What you need to configure:
!
!   router bgp 65002
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.2
!    neighbor 10.1.12.1 remote-as 65001     ! eBGP to r1
!    neighbor 10.1.23.2 remote-as 65002     ! iBGP to r3
!    address-family ipv4 unicast
!     neighbor 10.1.12.1 activate
!     neighbor 10.1.23.2 activate
!     neighbor 10.1.23.2 next-hop-self      ! Fix the iBGP next-hop problem
!     network 10.0.0.2/32
!
! Try WITHOUT next-hop-self first — observe that r3 cannot use r1's prefix.
! Then add it and see routes become valid.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1 (AS65001) — eBGP
 ip address 10.1.12.2/30
!
interface eth2
 description to r3 (AS65002) — iBGP
 ip address 10.1.23.1/30
!
end
