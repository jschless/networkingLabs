frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r3  (AS 65002 — iBGP to r2, eBGP to r4)
!
! r3 peers iBGP with r2 (same AS 65002) on eth1.
! r3 peers eBGP with r4 (AS 65003) on eth2.
!
! KEY CONCEPT: iBGP split-horizon — r3 will NOT re-advertise routes
! learned from r2 (iBGP) to any other iBGP peer. In a larger network
! this requires either full-mesh iBGP or a route reflector. Here we
! have only two iBGP peers so it is not a problem, but keep it in mind.
!
! What you need to configure:
!
!   router bgp 65002
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.3
!    neighbor 10.1.23.1 remote-as 65002     ! iBGP to r2
!    neighbor 10.1.34.2 remote-as 65003     ! eBGP to r4
!    address-family ipv4 unicast
!     neighbor 10.1.23.1 activate
!     neighbor 10.1.34.2 activate
!     neighbor 10.1.34.2 next-hop-self      ! Fix next-hop for r4
!     network 10.0.0.3/32
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to r2 (AS65002) — iBGP
 ip address 10.1.23.2/30
!
interface eth2
 description to r4 (AS65003) — eBGP
 ip address 10.1.34.1/30
!
end
