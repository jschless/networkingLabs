frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r1  (AS 65001 — eBGP speaker)
!
! r1 peers eBGP with r2 (AS 65002).
! It advertises its own loopback (10.0.0.1/32) into BGP.
!
! What you need to configure:
!
!   router bgp 65001
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.1
!    neighbor 10.1.12.2 remote-as 65002
!    address-family ipv4 unicast
!     neighbor 10.1.12.2 activate
!     network 10.0.0.1/32
!
! Tip: use 'show bgp ipv4 unicast summary' to verify session state.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to r2 (AS65002)
 ip address 10.1.12.1/30
!
end
