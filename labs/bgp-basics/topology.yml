name: bgp-basics

# BGP fundamentals practice lab
#
# IP addressing is pre-configured. You implement BGP.
#
# Topology:
#
#   [r1] --eBGP-- [r2] --iBGP-- [r3] --eBGP-- [r4]
#   AS65001       AS65002        AS65002        AS65003
#
# Key concepts:
#   - eBGP peers must be directly connected (TTL=1 default)
#   - iBGP peers share the same AS number
#   - iBGP does NOT re-advertise routes learned from other iBGP peers (split-horizon)
#   - iBGP next-hop is NOT changed — next-hop-self fixes this

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf
    r4:
      binds:
        - configs/r4/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30  eBGP
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30  iBGP
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30  eBGP
