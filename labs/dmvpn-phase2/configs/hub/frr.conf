frr version 8.4_git
frr defaults traditional
hostname hub
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.1/32
 ip ospf passive
!
interface eth1
 description WAN NBMA network (10.0.0.0/24)
 ip address 10.0.0.1/24
 ip ospf passive
!
interface tun0
 description DMVPN mGRE hub — nhrpd acts as NHS
 ip nhrp network-id 1
 ip nhrp holdtime 300
 ip nhrp map multicast dynamic
 ip nhrp redirect
 ip ospf area 0.0.0.0
 ip ospf network broadcast
 ip ospf priority 10
!
router ospf
 ospf router-id 10.0.0.1
!
