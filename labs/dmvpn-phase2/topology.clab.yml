name: dmvpn-phase2

# DMVPN Phase 2 — Dynamic Spoke-to-Spoke Shortcuts  (Arista cEOS)
#
# Phase 2 enables direct spoke-to-spoke tunnels via NHRP resolution.
# Unlike Phase 1 (all traffic via hub), Phase 2 creates dynamic GRE tunnels
# directly between spokes after NHRP resolves the remote spoke's WAN IP.
#
# Topology:
#   [spoke1] (WAN: 10.0.0.11) --\
#   [spoke2] (WAN: 10.0.0.12) ---[hub] (WAN: 10.0.0.1)   br-wan: 10.0.0.0/24
#   [spoke3] (WAN: 10.0.0.13) --/
#
# Tunnel IPs:
#   hub:    172.16.0.1/24   spoke1: 172.16.0.11/24
#   spoke2: 172.16.0.12/24  spoke3: 172.16.0.13/24
#
# Simulated LANs (Loopback1):
#   spoke1: 192.168.1.1/24   spoke2: 192.168.2.1/24   spoke3: 192.168.3.1/24
#
# Phase 2 vs Phase 1 differences:
#   - OSPF: broadcast mode (vs point-to-multipoint/point-to-point in Phase 1)
#   - Hub: OSPF priority 10 (forces DR), ip nhrp redirect (already in P1)
#   - Spokes: OSPF priority 0 (never DR), ip nhrp shortcut (new in P2)
#   - Result: routing table has spoke tunnel IPs as direct next-hops
#     because OSPF broadcast preserves the originating router's IP as next-hop
#     -> NHRP can create spoke-to-spoke shortcuts bypassing hub
#
# Pre-configured: hub (fully working Phase 2)
# Your task: Configure NHRP + OSPF broadcast + ip nhrp shortcut on each spoke

topology:
  nodes:
    br-wan:
      kind: linux
      image: frr-lab:local
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0

    hub:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/hub/startup-config

    spoke1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spoke1/startup-config

    spoke2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spoke2/startup-config

    spoke3:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spoke3/startup-config

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
