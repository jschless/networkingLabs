name: dmvpn-phase2

# DMVPN Phase 2 — Dynamic Spoke-to-Spoke Shortcuts  (Linux/FRR)
#
# Phase 2 enables direct spoke-to-spoke tunnels via NHRP resolution.
# Unlike Phase 1 (all traffic via hub), Phase 2 creates dynamic shortcuts
# directly between spokes after NHRP resolves the remote spoke's WAN IP.
#
# Platform note: FRR nhrpd v8.4 provides NHS/NHC and shortcut route injection.
#
# Tunnel IPs:
#   hub:    172.16.0.1/24   spoke1: 172.16.0.11/24
#   spoke2: 172.16.0.12/24  spoke3: 172.16.0.13/24
#
# Phase 2 vs Phase 1 differences:
#   - OSPF: broadcast mode (vs point-to-multipoint in Phase 1)
#   - Hub: OSPF priority 10 (forces DR)
#   - Spokes: OSPF priority 0 (never DR), ip nhrp shortcut (new in P2)
#
# Pre-configured: hub (fully working Phase 2)
# Your task: Configure NHRP + OSPF broadcast + ip nhrp shortcut on each spoke
#
# Access:
#   ./scripts/lab.sh cli dmvpn-phase2 hub       # vtysh
#   ./scripts/lab.sh cli dmvpn-phase2 spoke1    # vtysh

topology:
  defaults:
    kind: linux
    image: frr-lab:local

  nodes:
    br-wan:
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0

    hub:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/hub/frr.conf:/etc/frr/frr.conf
        - configs/hub/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    spoke1:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke1/frr.conf:/etc/frr/frr.conf
        - configs/spoke1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    spoke2:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke2/frr.conf:/etc/frr/frr.conf
        - configs/spoke2/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    spoke3:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke3/frr.conf:/etc/frr/frr.conf
        - configs/spoke3/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
