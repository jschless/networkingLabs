name: dmvpn-phase2

# Native VyOS DMVPN compatibility reference. Current VyOS/FRR requires /32
# NHRP tunnel addresses; BGP preserves remote-spoke next hops while NHRP
# redirect/shortcut supplies the observed direct-data-path optimization.

topology:
  nodes:
    br-wan:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/br-wan/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    hub:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/hub/config.boot

    spoke1:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke1/config.boot
      binds:
        - configs/spoke1/inject-fault.sh:/opt/dmvpn-phase2/inject-fault.sh:ro
        - configs/spoke1/restore-service-host-map.sh:/opt/dmvpn-phase2/restore-service-host-map.sh:ro

    spoke2:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke2/config.boot

    spoke3:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke3/config.boot

  links:
    - endpoints: ["hub:eth1", "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
