name: enterprise-edge-nat-firewall

# Enterprise DMZ — screened subnet (dual-firewall) security architecture
#
# Security zones (outside to inside):
#
#   INTERNET  ──── [isp (cEOS)] ────┬──── [internet-client]
#                                   │
#                               fw-outside  (perimeter firewall, nftables)
#                              /     |     \
#                         DMZ-web DMZ-mail  DMZ-inner
#                        172.16.0.0/30 .4/30  172.16.1.0/30
#                           |           |           |
#                       [web-server] [mail-server]  fw-inside  (internal FW, nftables)
#                                                  /           \
#                                             LAN-db (10.0.0.0/30)  LAN-ws (10.0.0.4/30)
#                                               |                        |
#                                          [db-server]           [workstation]
#
# Address summary:
#   203.0.113.0/30  — isp ↔ internet-client
#   203.0.114.0/30  — isp ↔ fw-outside WAN
#   172.16.0.0/30   — DMZ-web:  fw-outside(.1) ↔ web-server(.2)
#   172.16.0.4/30   — DMZ-mail: fw-outside(.5) ↔ mail-server(.6)
#   172.16.1.0/30   — DMZ-inner: fw-outside(.1) ↔ fw-inside(.2)
#   10.0.0.0/30     — LAN-db:   fw-inside(.1) ↔ db-server(.2)
#   10.0.0.4/30     — LAN-ws:   fw-inside(.5) ↔ workstation(.6)
#
# Firewall policies:
#   fw-outside:  internet → DMZ (HTTP/SMTP only); LAN outbound; block all else; SNAT
#   fw-inside:   workstation ↔ DMZ management; web-server → db:3306; block DMZ→LAN direct

topology:
  defaults:
    kind: linux
    image: dmz-lab:local

  nodes:
    # ── ISP / simulated internet (Arista cEOS) ─────────────────────────────
    isp:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp/startup-config

    internet-client:
      binds:
        - configs/internet-client/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    fw-outside:
      binds:
        - configs/fw-outside/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    web-server:
      binds:
        - configs/web-server/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    mail-server:
      binds:
        - configs/mail-server/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    fw-inside:
      binds:
        - configs/fw-inside/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    db-server:
      binds:
        - configs/db-server/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    workstation:
      binds:
        - configs/workstation/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    guest-laptop:
      binds:
        - configs/guest-laptop/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    # Internet segment
    - endpoints: ["isp:eth1",          "internet-client:eth1"]  # 203.0.113.0/30
    - endpoints: ["isp:eth2",          "fw-outside:eth1"]       # 203.0.114.0/30  WAN
    # DMZ segments (all hanging off fw-outside)
    - endpoints: ["fw-outside:eth2",   "web-server:eth1"]       # 172.16.0.0/30   DMZ-web
    - endpoints: ["fw-outside:eth3",   "mail-server:eth1"]      # 172.16.0.4/30   DMZ-mail
    - endpoints: ["fw-outside:eth4",   "fw-inside:eth1"]        # 172.16.1.0/30   DMZ-inner
    # LAN segments (hanging off fw-inside)
    - endpoints: ["fw-inside:eth2",    "db-server:eth1"]        # 10.0.0.0/30     LAN-db
    - endpoints: ["fw-inside:eth3",    "workstation:eth1"]      # 10.0.0.4/30     LAN-ws
    - endpoints: ["fw-inside:eth4",    "guest-laptop:eth1"]     # 10.0.0.8/30     GUEST
