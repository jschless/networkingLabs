frr version 8.5
frr defaults traditional
hostname p1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! p1 — Provider (transit) router
!
!   eth1 : to pe1 (10.1.0.2/30)
!   eth2 : to pe2 (10.1.0.5/30)
!   lo   : 10.0.0.2/32
!
! p1 is a pure P router: it runs IS-IS and LDP for the core.
! It does NOT participate in the pseudowire — it only provides label-switched
! transit between pe1 and pe2 (swap operation on incoming/outgoing labels).
!
interface lo
 ip address 10.0.0.2/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to pe1
 ip address 10.1.0.2/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
interface eth2
 description to pe2
 ip address 10.1.0.5/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
!
! LDP — link sessions on both core interfaces
! p1 does NOT participate in targeted LDP (no pseudowire endpoints here)
!
mpls ldp
 router-id 10.0.0.2
 !
 address-family ipv4
  discovery transport-address 10.0.0.2
  !
  interface eth1
  interface eth2
 exit-address-family
!
end
