frr version 8.5
frr defaults traditional
hostname pe2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! pe2 — Provider Edge router
!
!   eth1 : MPLS core toward p1 (10.1.0.6/30)
!   eth2 : L2VPN attachment circuit to ce2 (L2 only, no IP)
!          enslaved to Linux bridge br-l2vpn by setup.sh
!   lo   : router-id and IS-IS/LDP transport address (10.0.0.3/32)
!
interface lo
 ip address 10.0.0.3/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to p1 (MPLS core)
 ip address 10.1.0.6/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
!
! LDP configuration
! Link session on eth1 (core-facing).
! Targeted session to pe1 (10.0.0.1) for PW label negotiation.
!
mpls ldp
 router-id 10.0.0.3
 !
 address-family ipv4
  discovery transport-address 10.0.0.3
  targeted-hello accept
  !
  interface eth1
  !
  neighbor 10.0.0.1 targeted
 exit-address-family
!
! L2VPN pseudowire — mirror of pe1 configuration
! Same PW-ID (100), remote peer = pe1 (10.0.0.1), local bridge = br-l2vpn
!
l2vpn VPWS-CUST
 bridge br-l2vpn
 member pseudowire pw-to-pe1
  neighbor lsr-id 10.0.0.1
  pw-id 100
 exit
!
end
