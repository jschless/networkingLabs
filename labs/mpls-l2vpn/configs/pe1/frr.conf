frr version 8.5
frr defaults traditional
hostname pe1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! pe1 — Provider Edge router
!
!   eth1 : L2VPN attachment circuit to ce1 (L2 only, no IP)
!          enslaved to Linux bridge br-l2vpn by setup.sh
!   eth2 : MPLS core toward p1 (10.1.0.1/30)
!   lo   : router-id and IS-IS/LDP transport address (10.0.0.1/32)
!
! The pseudowire:
!   - LDP FEC 128 pseudowire, PW-ID 100
!   - Targeted LDP session to pe2 (10.0.0.3) carries PW label negotiation
!   - After LDP signals labels, zebra programs:
!       incoming label N → bridge to br-l2vpn (local termination)
!       outgoing: push label M → send over MPLS core to pe2
!   - Linux bridge br-l2vpn joins eth1 (CE side) + pw0 (pseudowire iface)
!     so L2 frames from ce1 traverse: eth1 → br-l2vpn → pw0 → MPLS → pe2
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
!
interface eth2
 description to p1 (MPLS core)
 ip address 10.1.0.1/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
!
! LDP configuration
! Link session on eth2 (core-facing) distributes labels for all IGP prefixes.
! Targeted session to pe2 (10.0.0.3) carries PW label negotiation (FEC 128).
!
mpls ldp
 router-id 10.0.0.1
 !
 address-family ipv4
  discovery transport-address 10.0.0.1
  targeted-hello accept
  !
  interface eth2
  !
  neighbor 10.0.0.3 targeted
 exit-address-family
!
! L2VPN pseudowire (FEC 128 / VPWS)
! FRR ldpd l2vpn stanza: declares the PW and the local attachment interface.
! 'bridge br-l2vpn' means LDP/zebra programs MPLS forwarding into that bridge.
! 'member pseudowire pw-to-pe2' defines the remote peer and PW-ID.
!
l2vpn VPWS-CUST
 bridge br-l2vpn
 member pseudowire pw-to-pe2
  neighbor lsr-id 10.0.0.3
  pw-id 100
 exit
!
end
