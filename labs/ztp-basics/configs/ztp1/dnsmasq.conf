# dnsmasq — DHCP for the ZTP provisioning (mgmt) network (skeleton).
#
# Your job (Task 2): make this a working DHCP server that also tells a
# factory-blank switch where its config lives. The switch ZTPs on its
# MANAGEMENT interface, which lives on the containerlab mgmt network —
# this server's eth0.
#
#   - DNS is not needed: disable it (hint: port=0)
#   - serve DHCP on eth0 only; use bind-dynamic (the lab restarts
#     containers — a dynamic bind survives interface churn)
#   - lease range: 172.20.20.200-172.20.20.240, netmask 255.255.255.0
#     (well clear of the .100s containerlab hands out itself)
#   - the magic: DHCP option 67 (bootfile-name) pointing at the config
#     URL on this server, port 8000  (this host is 172.20.20.111)
#   - keep log-dhcp on so you can watch the handshake
#
log-dhcp
