frr version 8.4_git
frr defaults traditional
hostname hub
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! DC hub (AS65000). Pre-configured: eBGP to the MPLS PE and eBGP over the
! GRE tunnel to br2, both with BFD. NO path policy here on purpose: the
! branch must steer the hub's return traffic itself.
! Timers: keepalive 10 s, hold 30 s. BFD 300 ms x 3.
!
bfd
 profile BRANCH
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 65000
 bgp router-id 10.20.0.1
 no bgp ebgp-requires-policy
 timers bgp 10 30
 neighbor 172.16.2.2 remote-as 65100
 neighbor 172.16.2.2 description MPLS PE
 neighbor 172.16.2.2 bfd profile BRANCH
 neighbor 10.99.0.1 remote-as 65010
 neighbor 10.99.0.1 description br2 over GRE
 neighbor 10.99.0.1 bfd profile BRANCH
 !
 address-family ipv4 unicast
  network 10.20.20.0/24
 exit-address-family
exit
!
