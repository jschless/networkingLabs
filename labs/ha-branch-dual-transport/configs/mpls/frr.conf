frr version 8.4_git
frr defaults traditional
hostname mpls
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! Carrier PE (AS65100). Pre-configured: the provider has already
! provisioned BGP and BFD toward both customer sites.
! Provider timers: keepalive 10 s, hold 30 s. BFD 300 ms x 3.
!
bfd
 profile CUSTOMER
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 65100
 bgp router-id 172.16.255.1
 no bgp ebgp-requires-policy
 timers bgp 10 30
 neighbor 172.16.1.1 remote-as 65010
 neighbor 172.16.1.1 description branch br1
 neighbor 172.16.1.1 bfd profile CUSTOMER
 neighbor 172.16.2.1 remote-as 65000
 neighbor 172.16.2.1 description DC hub
 neighbor 172.16.2.1 bfd profile CUSTOMER
exit
!
