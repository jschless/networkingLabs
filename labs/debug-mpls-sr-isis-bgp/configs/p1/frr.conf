frr version 8.5
frr defaults traditional
hostname p1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.4/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to PE1
 ip address 10.1.0.2/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
interface eth2
 description to RR1
 ip address 10.1.0.5/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
interface eth3
 description to P2
 ip address 10.1.0.13/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.4/32 index 4
!
end
