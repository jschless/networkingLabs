frr version 8.5
frr defaults traditional
hostname rr1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to P1
 ip address 10.1.0.6/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
interface eth2
 description to P2
 ip address 10.1.0.9/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.1/32 index 1
!
router bgp 65000
 bgp router-id 10.0.0.1
 bgp cluster-id 10.0.0.1
 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65000
 neighbor IBGP update-source lo
 !
 neighbor 10.0.0.2 peer-group IBGP
 neighbor 10.0.0.2 description pe1
 neighbor 10.0.0.3 peer-group IBGP
 neighbor 10.0.0.3 description pe2
 !
 address-family ipv4 unicast
  no neighbor IBGP activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor IBGP activate
  neighbor IBGP route-reflector-client
  neighbor IBGP send-community both
 exit-address-family
!
end
