frr version 8.5
frr defaults traditional
hostname pe1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
vrf CUST-A
!
interface lo
 ip address 10.0.0.2/32
 ip router isis CORE
 isis passive
!
! eth1 is placed into VRF CUST-A via exec (ip link set eth1 master CUST-A)
interface eth1 vrf CUST-A
 description to CE1
 ip address 192.168.10.2/30
!
interface eth2
 description to P1
 ip address 10.1.0.1/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.2/32 index 2
!
! Global BGP instance: iBGP to RR, VPNv4 address family
router bgp 65000
 bgp router-id 10.0.0.2
 !
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 description rr1
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.1 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 send-community both
 exit-address-family
!
! VRF BGP instance: eBGP to CE1, exports into VPNv4
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 !
 neighbor 192.168.10.1 remote-as 65001
 neighbor 192.168.10.1 description ce1
 !
 address-family ipv4 unicast
  neighbor 192.168.10.1 activate
  label vpn export auto
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
end
