name: fortigate-firewall-capstone

# FortiGate Firewall Capstone
#
# Containerlab deploys the surrounding hosts and five host bridges.
# A separate QEMU/KVM FortiGate VM attaches to those bridges with:
#   port2 = WAN
#   port3 = corp
#   port4 = guest
#   port5 = DMZ
#   port6 = db
# The FortiGate management plane stays on a QEMU user-mode NIC exposed on
# localhost ports 2222/8080/8443.

topology:
  defaults:
    kind: linux
    image: fortigate-tools:local

  nodes:
    br-fgt-wan:
      kind: bridge

    br-fgt-corp:
      kind: bridge

    br-fgt-guest:
      kind: bridge

    br-fgt-dmz:
      kind: bridge

    br-fgt-db:
      kind: bridge

    isp:
      binds:
        - configs/isp/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    internet-client:
      binds:
        - configs/internet-client/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    corp-client:
      binds:
        - configs/corp-client/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    guest-client:
      binds:
        - configs/guest-client/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    dmz-web:
      binds:
        - configs/dmz-web/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    db-server:
      binds:
        - configs/db-server/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["br-fgt-wan:eth0", "isp:eth1"]
    - endpoints: ["isp:eth2", "internet-client:eth1"]
    - endpoints: ["br-fgt-corp:eth0", "corp-client:eth1"]
    - endpoints: ["br-fgt-guest:eth0", "guest-client:eth1"]
    - endpoints: ["br-fgt-dmz:eth0", "dmz-web:eth1"]
    - endpoints: ["br-fgt-db:eth0", "db-server:eth1"]
