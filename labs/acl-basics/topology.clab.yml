name: acl-basics

topology:
  defaults:
    kind: linux
    image: ops-lab:local

  nodes:
    router:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/router/startup-config

    client:
      binds:
        - configs/client/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    attacker:
      binds:
        - configs/attacker/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    server:
      binds:
        - configs/server/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["client:eth1", "router:eth1"]
    - endpoints: ["attacker:eth1", "router:eth2"]
    - endpoints: ["server:eth1", "router:eth3"]
