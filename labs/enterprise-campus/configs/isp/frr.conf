frr version 8.5
frr defaults traditional
hostname isp
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! ISP — AS65500
! Peers with edge (AS65100) via eBGP.
! Advertises a default route and its loopback (simulating internet reachability).
! Receives the enterprise public prefix 198.51.100.0/24 from edge.
!
interface lo
 ip address 1.1.1.1/32
!
interface eth1
 description to edge 203.0.113.0/30
 ip address 203.0.113.1/30
!
! Null route to generate a default route into BGP
ip route 0.0.0.0/0 Null0
!
router bgp 65500
 no bgp ebgp-requires-policy
 neighbor 203.0.113.2 remote-as 65100
 neighbor 203.0.113.2 description edge
 !
 address-family ipv4 unicast
  neighbor 203.0.113.2 activate
  network 0.0.0.0/0
  network 1.1.1.1/32
 exit-address-family
!
end
