[global]
type=global
user_agent=enterprise-voice-probe

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[phone-template](!)
type=endpoint
context=phones
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=no
force_rport=yes
rewrite_contact=no
timers=no

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes

[auth-a]
type=auth
auth_type=userpass
username=2001
password=voice-a-2001

[2001](phone-template)
auth=auth-a
aors=2001
callerid=Phone A <2001>

[2001](aor-template)

[auth-b]
type=auth
auth_type=userpass
username=2002
password=voice-b-2002

[2002](phone-template)
auth=auth-b
aors=2002
callerid=Phone B <2002>

[2002](aor-template)
