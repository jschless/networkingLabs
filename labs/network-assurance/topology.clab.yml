---
name: network-assurance

# Reference/observation lab: one native EOS forwarding device exposes SNMP,
# syslog, and SPAN. A non-inline Linux sensor turns the mirrored packets into
# genuine NetFlow v9 records without participating in the forwarding path.

topology:
  nodes:
    router:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/router/startup-config

    client:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/client/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    server:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/server/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    management:
      kind: linux
      image: assurance-lab:local
      binds:
        - configs/management/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    sensor:
      kind: linux
      image: assurance-lab:local
      binds:
        - configs/sensor/setup.sh:/opt/assurance/start-sensor.sh:ro
      exec:
        - bash /opt/assurance/start-sensor.sh

  links:
    - endpoints: ["client:eth1", "router:eth1"]          # 10.1.0.0/24
    - endpoints: ["server:eth1", "router:eth2"]          # 10.2.0.0/24
    - endpoints: ["management:eth1", "router:eth3"]      # 172.16.0.0/24
    - endpoints: ["sensor:eth1", "router:eth4"]          # unnumbered SPAN feed
    - endpoints: ["management:eth2", "sensor:eth2"]      # 172.16.1.0/30
