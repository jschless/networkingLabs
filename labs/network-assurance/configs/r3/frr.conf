frr version 8.4_git
frr defaults traditional
hostname r3
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 ip address 10.0.23.2/30
 ip ospf area 0
!
interface eth2
 ip address 10.3.0.1/30
!
interface eth3
 ip address 172.16.0.9/30
!
router ospf
 ospf router-id 10.0.0.3
 network 10.0.0.3/32 area 0
 passive-interface eth2
 passive-interface eth3
!
