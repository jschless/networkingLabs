name: opnsense-remote-access-concentrator

# One external OPNsense VM is the learned concentrator. The two WireGuard
# containers are intrinsic remote-access endpoints; service roles are
# incidental probes behind the firewall.
topology:
  nodes:
    br-remote-wan:
      kind: bridge
    br-corp:
      kind: bridge
    developer:
      kind: linux
      image: wireguard-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/developer/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh
    contractor:
      kind: linux
      image: wireguard-lab:local
      cap-add: [NET_ADMIN, NET_RAW]
      binds:
        - configs/contractor/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh
    corp-app:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/corp-app/setup.sh:/setup.sh:ro
        - configs/tcp-responder.py:/tcp-responder.py:ro
      exec:
        - bash /setup.sh
    jump-host:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/jump-host/setup.sh:/setup.sh:ro
        - configs/tcp-responder.py:/tcp-responder.py:ro
      exec:
        - bash /setup.sh
  links:
    - endpoints: ["br-remote-wan:eth1", "developer:eth1"]
    - endpoints: ["br-remote-wan:eth2", "contractor:eth1"]
    - endpoints: ["br-corp:eth3", "corp-app:eth1"]
    - endpoints: ["br-corp:eth4", "jump-host:eth1"]
