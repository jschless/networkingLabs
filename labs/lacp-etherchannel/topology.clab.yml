name: lacp-etherchannel

# LACP EtherChannel Practice Lab — Arista cEOS
#
# Topology:
#
#   [host1] ---eth1--- [sw1] ===eth1/eth2=== [sw2] ---eth3--- [host2]
#                           (2 parallel links)
#
# Links:
#   sw1:eth1 <-> sw2:eth1    Port-Channel1 member 1
#   sw1:eth2 <-> sw2:eth2    Port-Channel1 member 2
#   sw1:eth3 <-> host1:eth1  LAN A
#   sw2:eth3 <-> host2:eth1  LAN B
#
# IP Addressing:
#   host1:   10.0.1.1/24   gw 10.0.1.253
#   host2:   10.0.1.2/24   gw 10.0.1.254
#   sw1 eth3: 10.0.1.253/24
#   sw2 eth3: 10.0.1.254/24
#   Port-Channel1: sw1=10.12.0.1/30, sw2=10.12.0.2/30  (user creates)
#
# Pre-configured: IP addressing on hosts and access ports, loopbacks.
# Your task: Configure LACP port-channel on sw1 and sw2.

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    sw1:
      startup-config: configs/sw1/startup-config

    sw2:
      startup-config: configs/sw2/startup-config

    host1:
      startup-config: configs/host1/startup-config

    host2:
      startup-config: configs/host2/startup-config

  links:
    - endpoints: ["sw1:eth1", "sw2:eth1"]    # Port-Channel1 member 1
    - endpoints: ["sw1:eth2", "sw2:eth2"]    # Port-Channel1 member 2
    - endpoints: ["sw1:eth3", "host1:eth1"]  # LAN A
    - endpoints: ["sw2:eth3", "host2:eth1"]  # LAN B
