name: cloud-hybrid-networking

topology:
  nodes:
    onprem-edge1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/onprem-edge1/startup-config
      exec:
        - bash -c "iptables -D EOS_FORWARD -i eth1 -j DROP 2>/dev/null || true; iptables -D EOS_FORWARD -i eth2 -j DROP 2>/dev/null || true"
    onprem-edge2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/onprem-edge2/startup-config
      exec:
        - bash -c "iptables -D EOS_FORWARD -i eth1 -j DROP 2>/dev/null || true; iptables -D EOS_FORWARD -i eth2 -j DROP 2>/dev/null || true"
    cloud-transit:
      kind: linux
      image: cloud-lab:local
      binds: [configs/common/daemons:/etc/frr/daemons, configs/cloud-transit/frr.conf:/etc/frr/frr.conf, configs/cloud-transit/init.sh:/configs/init.sh]
      sysctls: {net.ipv4.ip_forward: "1"}
      exec: ["bash /configs/init.sh", "vtysh -b"]
    inspection:
      kind: linux
      image: cloud-lab:local
      binds: [configs/common/daemons:/etc/frr/daemons, configs/inspection/frr.conf:/etc/frr/frr.conf, configs/inspection/init.sh:/configs/init.sh]
      sysctls: {net.ipv4.ip_forward: "1"}
      exec: ["bash /configs/init.sh", "vtysh -b"]
    app-a-rtr:
      kind: linux
      image: cloud-lab:local
      binds: [configs/common/daemons:/etc/frr/daemons, configs/app-a-rtr/frr.conf:/etc/frr/frr.conf, configs/app-a-rtr/init.sh:/configs/init.sh]
      sysctls: {net.ipv4.ip_forward: "1"}
      exec: ["bash /configs/init.sh", "vtysh -b"]
    app-b-rtr:
      kind: linux
      image: cloud-lab:local
      binds: [configs/common/daemons:/etc/frr/daemons, configs/app-b-rtr/frr.conf:/etc/frr/frr.conf, configs/app-b-rtr/init.sh:/configs/init.sh]
      sysctls: {net.ipv4.ip_forward: "1"}
      exec: ["bash /configs/init.sh", "vtysh -b"]
    dns:
      kind: linux
      image: cloud-lab:local
      binds: [configs/dns/init.sh:/configs/init.sh, configs/dns/named.conf.solution:/configs/named.conf.solution, configs/dns/db.prod.corp:/configs/db.prod.corp, configs/dns/db.empty:/configs/db.empty]
      exec: ["bash /configs/init.sh"]
    corp-client:
      kind: linux
      image: cloud-lab:local
      binds: [configs/corp-client/init.sh:/configs/init.sh]
      exec: ["bash /configs/init.sh"]
    public-client:
      kind: linux
      image: cloud-lab:local
      binds: [configs/public-client/init.sh:/configs/init.sh]
      exec: ["bash /configs/init.sh"]
    corp-switch:
      kind: linux
      image: cloud-lab:local
      binds: [configs/corp-switch/init.sh:/configs/init.sh]
      exec: ["bash /configs/init.sh"]

  links:
    - endpoints: ["onprem-edge1:eth1", "cloud-transit:eth1"] # 169.254.60.0/30 attachment 1
    - endpoints: ["onprem-edge2:eth1", "cloud-transit:eth2"] # 169.254.60.4/30 attachment 2
    - endpoints: ["onprem-edge1:eth2", "corp-switch:eth1"] # 10.60.10.0/24 corporate LAN
    - endpoints: ["onprem-edge2:eth2", "corp-switch:eth2"] # 10.60.10.0/24 corporate LAN
    - endpoints: ["corp-client:eth1", "corp-switch:eth3"] # 10.60.10.0/24 corporate LAN
    - endpoints: ["cloud-transit:eth3", "app-a-rtr:eth1"] # 10.60.100.0/30 transit A control link
    - endpoints: ["cloud-transit:eth4", "app-b-rtr:eth1"] # 10.60.100.4/30 transit B control link
    - endpoints: ["cloud-transit:eth5", "inspection:eth1"] # 10.60.100.8/30 inspection ingress
    - endpoints: ["inspection:eth2", "app-a-rtr:eth2"] # 10.60.100.12/30 inspection to App A
    - endpoints: ["inspection:eth3", "app-b-rtr:eth2"] # 10.60.100.16/30 inspection to App B
    - endpoints: ["inspection:eth4", "dns:eth1"] # 10.63.10.0/24 shared DNS
    - endpoints: ["cloud-transit:eth6", "public-client:eth1"] # 198.18.60.0/30 untrusted client
