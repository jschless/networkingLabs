name: debug-vxlan-evpn

topology:
  nodes:
    spine:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spine/startup-config

    vtep1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/vtep1/startup-config

    vtep2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/vtep2/startup-config

    host1:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host1/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

    host2:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host2/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

  links:
    - endpoints: ["vtep1:eth1", "spine:eth1"]
    - endpoints: ["vtep2:eth1", "spine:eth2"]
    - endpoints: ["host1:eth1", "vtep1:eth2"]
    - endpoints: ["host2:eth1", "vtep2:eth2"]
