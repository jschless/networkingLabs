frr version 8.5
frr defaults traditional
hostname internet
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.100/32
!
interface eth1
 description to edge
 ip address 10.10.2.2/30
!
router ospf
 router-id 10.0.0.100
 network 10.0.0.100/32 area 0
 network 10.10.2.0/30 area 0
!
end
