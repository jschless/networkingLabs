frr version 8.5
frr defaults traditional
hostname edge
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! Edge router — uRPF practice
!
! TASK: Enable uRPF strict mode on eth1 (attacker-facing interface)
! After enabling, spoofed source addresses will be dropped.
!
! uRPF commands (run in vtysh):
!   configure
!   interface eth1
!    ip verify unicast source reachable-via rx   <- strict mode
!    ! OR:
!    ip verify unicast source reachable-via any  <- loose mode
!
! Test commands (run on attacker node via bash):
!   Legitimate traffic:
!     ip route add 10.99.99.0/24 dev eth1   <- add spoofed network to attacker
!     ping -I 10.10.1.1 10.0.0.100          <- should PASS (source in routing table via eth1)
!
!   Spoofed traffic (run on attacker via: docker exec -it clab-urpf-antispoofing-attacker bash):
!     ip addr add 10.99.99.1/32 dev lo      <- add spoofed source to attacker
!     ping -I 10.99.99.1 10.0.0.100         <- should FAIL with strict uRPF (source 10.99.99.x not reachable via eth1)
!
! Check drop counters on edge:
!   show interface eth1     <- look for "input drops" or uRPF drops
!   show ip traffic         <- interface statistics
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to attacker (uRPF-protected)
 ip address 10.10.1.2/30
 ! YOUR TASK: ip verify unicast source reachable-via rx
!
interface eth2
 description to internet
 ip address 10.10.2.1/30
!
router ospf
 router-id 10.0.0.1
 network 10.0.0.1/32 area 0
 network 10.10.1.0/30 area 0
 network 10.10.2.0/30 area 0
!
end
