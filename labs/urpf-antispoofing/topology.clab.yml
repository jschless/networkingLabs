name: urpf-antispoofing

topology:
  defaults:
    kind: linux
    image: ops-lab:local

  nodes:
    attacker:
      binds:
        - configs/attacker/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    edge:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/edge/config.boot
      binds:
        - configs/edge/inject-fault.sh:/opt/inject-fault.sh:ro

    internet:
      binds:
        - configs/internet/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["attacker:eth1", "edge:eth1"]
    - endpoints: ["edge:eth2", "internet:eth1"]
