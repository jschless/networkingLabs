frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! r2 is in AS65002
! r2 is the main filtering router in this lab. It applies:
!   - inbound prefix-list from r1 (block 172.16.2.0/24)
!   - soft-reconfiguration inbound to inspect pre-filter RIB
!
! Interface addressing:
!   eth1 = 10.1.12.2/30  (link to r1:eth1 at 10.1.12.1)
!   eth2 = 10.1.23.1/30  (link to r3:eth1 at 10.1.23.2)
!   lo   = 10.0.0.2/32   (loopback — advertised into BGP)

interface lo
 ip address 10.0.0.2/32

interface eth1
 ip address 10.1.12.2/30

interface eth2
 ip address 10.1.23.1/30

! ============================================================
! YOUR TASKS ON R2
! ============================================================
!
! TASK 1 — Base BGP
!   router bgp 65002
!    bgp router-id 10.0.0.2
!    no bgp ebgp-requires-policy
!    neighbor 10.1.12.1 remote-as 65001
!    neighbor 10.1.23.2 remote-as 65003
!    !
!    address-family ipv4 unicast
!     network 10.0.0.2/32
!    exit-address-family
!
! TASK 2 — Enable soft-reconfiguration inbound
!   This stores the raw (pre-filter) RIB so you can inspect what r1 sent
!   BEFORE your prefix-list or route-map filters it.
!
!   router bgp 65002
!    address-family ipv4 unicast
!     neighbor 10.1.12.1 soft-reconfiguration inbound
!
!   After enabling: clear ip bgp 10.1.12.1 soft in
!   Inspect: show bgp ipv4 unicast neighbors 10.1.12.1 received-routes
!
! TASK 3 — Inbound prefix-list: block 172.16.2.0/24
!   ip prefix-list BLOCK-172-16-2 seq 5 deny 172.16.2.0/24
!   ip prefix-list BLOCK-172-16-2 seq 10 permit 0.0.0.0/0 le 32
!
!   router bgp 65002
!    address-family ipv4 unicast
!     neighbor 10.1.12.1 prefix-list BLOCK-172-16-2 in
!
!   Apply: clear ip bgp * soft in
!   Verify: show bgp ipv4 unicast
!   172.16.2.0/24 should be absent; 172.16.1.0/24 should be present.
!
!   Inspect pre-filter: show bgp ipv4 unicast neighbors 10.1.12.1 received-routes
!   Both /24s still appear here (raw from r1).
!   Post-filter: show bgp ipv4 unicast neighbors 10.1.12.1 routes
!   Only 172.16.1.0/24 appears.
!
! TASK 4 — More specific prefix-list matching
!   You can match a range of prefix lengths using "le" (less-than-or-equal)
!   and "ge" (greater-than-or-equal):
!
!   Block any prefix in the 172.16.0.0/16 space:
!   ip prefix-list BLOCK-172-16 seq 5 deny 172.16.0.0/16 le 32
!   ip prefix-list BLOCK-172-16 seq 10 permit 0.0.0.0/0 le 32
!
!   This matches 172.16.0.0/16 and ALL more-specifics up to /32.
!
! TASK 5 — Apply a route-map with prefix-list for more complex logic
!   A route-map can embed a prefix-list match and also set attributes:
!
!   ip prefix-list WANTED seq 5 permit 172.16.1.0/24
!
!   route-map FILTER-AND-TAG permit 10
!    match ip address prefix-list WANTED
!    set local-preference 150
!   route-map FILTER-AND-TAG deny 20
!    match ip address prefix-list BLOCK-172-16-2
!   route-map FILTER-AND-TAG permit 30
!
!   neighbor 10.1.12.1 route-map FILTER-AND-TAG in
! ============================================================
