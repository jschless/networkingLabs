name: evpn-border-ceos

# EVPN Border Leaf Lab — Arista cEOS
#
# Extends the vxlan-evpn fabric with a border leaf (bleaf1) that provides
# external connectivity to Tenant-A via eBGP peering with an internet router.
# Tenant-B remains fully isolated — no external connectivity.
#
# Pre-configured: spine1, spine2, leaf1-4 (full working EVPN/VXLAN fabric),
#                 ext-router (simulated internet), all hosts
# Your task:      bleaf1 — fabric integration + external eBGP in VRF TENANT-A
#
#                  [spine1]              [spine2]
#                  AS65100               AS65200
#             /   /   \   \   \     /   /   \   \   \
#        [leaf1][leaf2][leaf3][leaf4][bleaf1]
#                                    AS65005
#                                       |
#                                  [ext-router]
#                                    AS65500
#                               "simulated internet"
#                                100.64.0.0/24
#
# New underlay links (bleaf1):
#   bleaf1-spine1: 10.1.0.8/31   bleaf1-spine2: 10.2.0.8/31
#
# External link (in VRF TENANT-A on bleaf1):
#   bleaf1:eth3 -- ext-router:eth1  203.0.113.0/30

topology:
  nodes:
    spine1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spine1/startup-config

    spine2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/spine2/startup-config

    leaf1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/leaf1/startup-config

    leaf2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/leaf2/startup-config

    leaf3:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/leaf3/startup-config

    leaf4:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/leaf4/startup-config

    bleaf1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/bleaf1/startup-config

    ext-router:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/ext-router/startup-config

    host-a1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/host-a1/startup-config

    host-b1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/host-b1/startup-config

    host-a2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/host-a2/startup-config

    host-b2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/host-b2/startup-config

  links:
    # Underlay: leaves to spine1
    - endpoints: ["leaf1:eth1",  "spine1:eth1"]   # 10.1.0.0/31
    - endpoints: ["leaf2:eth1",  "spine1:eth2"]   # 10.1.0.2/31
    - endpoints: ["leaf3:eth1",  "spine1:eth3"]   # 10.1.0.4/31
    - endpoints: ["leaf4:eth1",  "spine1:eth4"]   # 10.1.0.6/31
    - endpoints: ["bleaf1:eth1", "spine1:eth5"]   # 10.1.0.8/31

    # Underlay: leaves to spine2
    - endpoints: ["leaf1:eth2",  "spine2:eth1"]   # 10.2.0.0/31
    - endpoints: ["leaf2:eth2",  "spine2:eth2"]   # 10.2.0.2/31
    - endpoints: ["leaf3:eth2",  "spine2:eth3"]   # 10.2.0.4/31
    - endpoints: ["leaf4:eth2",  "spine2:eth4"]   # 10.2.0.6/31
    - endpoints: ["bleaf1:eth2", "spine2:eth5"]   # 10.2.0.8/31

    # Host-facing access ports
    - endpoints: ["host-a1:eth1", "leaf1:eth3"]   # Tenant-A, VLAN 10
    - endpoints: ["host-b1:eth1", "leaf2:eth3"]   # Tenant-B, VLAN 20
    - endpoints: ["host-a2:eth1", "leaf3:eth3"]   # Tenant-A, VLAN 10
    - endpoints: ["host-b2:eth1", "leaf4:eth3"]   # Tenant-B, VLAN 20

    # External peering (Tenant-A only)
    - endpoints: ["bleaf1:eth3", "ext-router:eth1"]  # 203.0.113.0/30
