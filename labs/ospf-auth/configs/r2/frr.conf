frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! ============================================================
! r2 — middle router in the linear chain: r1 --- r2 --- r3
! r2 has two links: eth1 toward r1, eth2 toward r3
! ============================================================

interface lo
 ip address 10.0.0.2/32

! Link to r1 — segment 10.1.12.0/30
! r1 is .1, r2 is .2 on this segment
interface eth1
 description Link to r1 (10.1.12.0/30, r1=.1 r2=.2)
 ip address 10.1.12.2/30

! Link to r3 — segment 10.1.23.0/30
! r2 is .1, r3 is .2 on this segment
interface eth2
 description Link to r3 (10.1.23.0/30, r2=.1 r3=.2)
 ip address 10.1.23.1/30

