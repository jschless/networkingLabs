frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! ============================================================
! r3 — rightmost router in the linear chain: r1 --- r2 --- r3
! ============================================================

interface lo
 ip address 10.0.0.3/32

! Link to r2 — segment 10.1.23.0/30
! r2 is .1, r3 is .2 on this segment
interface eth1
 description Link to r2 (10.1.23.0/30, r2=.1 r3=.2)
 ip address 10.1.23.2/30

! ============================================================
