!    ip ospf authentication message-digest
!    ip ospf message-digest-key 1 md5 SecretKey123
!
! Step 3 — Verify end-to-end reachability:
!   ping 10.0.0.1 source 10.0.0.3   — r3 loopback to r1 loopback
!
! Step 4 — Area-level auth (alternative approach):
!   Instead of per-interface config, you can set auth in the OSPF process:
!   router ospf
!    area 0 authentication message-digest
!   Then only configure the key on each interface (not the auth type).
!   Per-interface auth overrides area auth when both are configured.
!
! SHA authentication (FRR extension, not standard):
!   ip ospf authentication hmac-sha-256
!   ip ospf authentication-key <key>
!   Note: both peers must support this — not interoperable with Cisco IOS.
