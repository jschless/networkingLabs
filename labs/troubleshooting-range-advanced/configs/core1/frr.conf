frr version 8.4_git
frr defaults traditional
hostname core1
service integrated-vtysh-config
interface lo
 ip address 10.251.255.1/32
interface eth1
 ip address 10.251.10.1/24
interface eth2
 ip address 10.251.50.1/24
interface eth3
 ip address 10.251.0.0/31
 ip ospf network point-to-point
interface eth4
 ip address 10.251.0.2/31
 ip ospf network point-to-point
router ospf
 ospf router-id 10.251.255.1
 passive-interface default
 no passive-interface eth3
 no passive-interface eth4
 network 10.251.0.0/31 area 0
 network 10.251.0.2/31 area 0
 network 10.251.10.0/24 area 0
 network 10.251.50.0/24 area 0
 network 10.251.255.1/32 area 0
end
