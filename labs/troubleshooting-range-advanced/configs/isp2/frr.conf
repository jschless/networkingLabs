frr version 8.4_git
frr defaults traditional
hostname isp2
service integrated-vtysh-config
interface lo
 ip address 10.252.255.2/32
interface eth1
 ip address 192.0.2.3/31
interface eth2
 ip address 192.0.2.6/31
router bgp 64502
 bgp router-id 10.252.255.2
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 65000
 neighbor 192.0.2.7 remote-as 64500
 address-family ipv4 unicast
  network 192.0.2.2/31
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.7 activate
 exit-address-family
end
