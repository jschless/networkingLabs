frr version 8.5
frr defaults traditional
hostname isp2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ! Same internet target IP as isp1 — simulates both ISPs reaching same internet
 ip address 10.99.0.1/32
!
interface eth1
 ! Link to router: 10.0.2.0/30, isp2=.2
 ip address 10.0.2.2/30
!
end
