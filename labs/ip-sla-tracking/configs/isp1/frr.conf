frr version 8.5
frr defaults traditional
hostname isp1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ! Simulated internet target — router's SLA probe pings this address
 ip address 10.99.0.1/32
!
interface eth1
 ! Link to router: 10.0.1.0/30, isp1=.2
 ip address 10.0.1.2/30
!
end
