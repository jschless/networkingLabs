name: ip-sla-tracking

topology:
  nodes:
    isp1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp1/startup-config

    isp2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp2/startup-config

    router:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/router/startup-config

  links:
    - endpoints: ["router:eth1", "isp1:eth1"]    # 10.0.1.0/30
    - endpoints: ["router:eth2", "isp2:eth1"]    # 10.0.2.0/30
