frr version 8.4
frr defaults traditional
hostname tor
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: tor  (Top-of-Rack router, AS 65000)
! Role:  BGP to the two k3s nodes + default gateway — you configure it
!
! Loopback:  10.0.0.254/32
! Rack:      eth1 10.1.0.1/24  (k3s nodes: 10.1.0.11, 10.1.0.12 in AS 65001)
! Clients:   eth2 172.16.9.1/24
!
! Your job (Task 2 + 5): eBGP to both nodes, and enough maximum-paths
! that a VIP advertised by both installs as ECMP. The nodes' MetalLB
! speakers only advertise; they accept nothing — so this side never needs
! to send them routes.
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.254/32
!
interface eth1
 description rack segment (k3s nodes)
 ip address 10.1.0.1/24
!
interface eth2
 description clients
 ip address 172.16.9.1/24
!
end
