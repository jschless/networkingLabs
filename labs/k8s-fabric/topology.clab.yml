name: k8s-fabric

# Kubernetes LoadBalancer object -> MetalLB BGP /32 -> native EOS RIB/FIB.
# The ToR boots with addressing and management access only. The learner owns
# every BGP and route-policy statement that joins the cluster to the fabric.

topology:
  nodes:
    tor:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/tor/startup-config

    racksw:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/racksw/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    k3s1:
      kind: linux
      image: rancher/k3s:v1.30.6-k3s1@sha256:204d4094343ed60ff60ed4b009785151c43d8f611761929aae3a1beb02fc0adf
      # k3s server; entrypoint addresses eth1 first, then execs k3s
      entrypoint: /k3s-entry.sh
      binds:
        - configs/k3s1/k3s-entry.sh:/k3s-entry.sh:ro
        - configs/k3s1/bootstrap.sh:/bootstrap.sh:ro
        - configs/k3s1/scenario-state.sh:/scenario-state.sh:ro
        - configs/manifests:/manifests:ro
      exec:
        # Install MetalLB + the sample workload once the cluster is up
        # (backgrounded so deploy doesn't block on image pulls)
        - sh -c "nohup sh /bootstrap.sh >/var/log/bootstrap.log 2>&1 &"

    k3s2:
      kind: linux
      image: rancher/k3s:v1.30.6-k3s1@sha256:204d4094343ed60ff60ed4b009785151c43d8f611761929aae3a1beb02fc0adf
      # k3s agent; joins https://10.1.0.11:6443 with the shared token
      entrypoint: /k3s-entry.sh
      binds:
        - configs/k3s2/k3s-entry.sh:/k3s-entry.sh:ro

    client:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/client/setup.sh:/setup.sh:ro
      exec:
        - sh /setup.sh

  links:
    - endpoints: ["tor:eth1",  "racksw:eth1"]   # rack subnet 10.1.0.0/24
    - endpoints: ["k3s1:eth1", "racksw:eth2"]   # k3s1 10.1.0.11
    - endpoints: ["k3s2:eth1", "racksw:eth3"]   # k3s2 10.1.0.12
    - endpoints: ["tor:eth2",  "client:eth1"]   # client subnet 172.16.9.0/24
