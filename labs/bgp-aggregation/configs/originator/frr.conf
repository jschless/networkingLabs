frr version 8.5
frr defaults traditional
hostname originator
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! originator is in AS65001
! It simulates a network with a block of customer /24 prefixes in 10.1.0.0/22.
! These are the specific routes that the aggregator will summarize.
!
! The /24 prefixes are configured as loopback addresses. In real life these
! would be connected subnets or received from customer routers.
!
! Interface addressing:
!   eth1         = 10.1.12.1/30   (link to aggregator:eth1 at 10.1.12.2)
!   lo           = 10.0.0.1/32    (management loopback)
!   lo (alias1)  = 10.1.1.1/24   (customer prefix 1 — advertised into BGP)
!   lo (alias2)  = 10.1.2.1/24   (customer prefix 2 — advertised into BGP)
!   lo (alias3)  = 10.1.3.1/24   (customer prefix 3 — advertised into BGP)
!   lo (alias4)  = 10.1.4.1/24   (customer prefix 4 — advertised into BGP)
!
! Together, 10.1.1.0/24 + 10.1.2.0/24 + 10.1.3.0/24 + 10.1.4.0/24
! are the component routes of the aggregate 10.1.0.0/22.

interface lo
 ip address 10.0.0.1/32
 ip address 10.1.1.1/24
 ip address 10.1.2.1/24
 ip address 10.1.3.1/24
 ip address 10.1.4.1/24

interface eth1
 ip address 10.1.12.1/30

! ============================================================
! YOUR TASKS ON ORIGINATOR
! ============================================================
!
! TASK 1 — Base BGP, advertise all component prefixes
!   router bgp 65001
!    bgp router-id 10.0.0.1
!    no bgp ebgp-requires-policy
!    neighbor 10.1.12.2 remote-as 65002
!    !
!    address-family ipv4 unicast
!     network 10.0.0.1/32
!     network 10.1.1.0/24
!     network 10.1.2.0/24
!     network 10.1.3.0/24
!     network 10.1.4.0/24
!    exit-address-family
!
!   Verify on aggregator: show bgp ipv4 unicast
!   All four /24s should be present with AS-path "65001".
!
! TASK 2 — Selective withdrawal (simulate a route going down)
!   To test aggregation behavior, remove one of the component routes:
!
!   router bgp 65001
!    address-family ipv4 unicast
!     no network 10.1.4.0/24
!    exit-address-family
!
!   Observe: on aggregator, what happens to the aggregate?
!   (If aggregate-address requires all four to be present, removing one
!    may withdraw the aggregate. Depends on your configuration.)
!
!   Restore it after testing:
!    network 10.1.4.0/24
!
! NOTE: The "network" statement requires a matching route in the routing table.
! The loopback addresses create directly connected routes, which satisfies this.
! ============================================================
