name: ospf-default-route

topology:
  defaults:
    kind: linux
    image: frrouting/frr:latest
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    core:
      binds:
        - configs/core/frr.conf:/etc/frr/frr.conf
    asbr:
      binds:
        - configs/asbr/frr.conf:/etc/frr/frr.conf
    internet:
      binds:
        - configs/internet/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["core:eth1", "asbr:eth1"]
    - endpoints: ["asbr:eth2", "internet:eth1"]
