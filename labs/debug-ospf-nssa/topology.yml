name: debug-ospf-nssa

topology:
  nodes:
    ext:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/ext/startup-config

    r1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r1/startup-config

    r2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r2/startup-config

    r3:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r3/startup-config

  links:
    - endpoints: ["r1:eth1", "ext:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
