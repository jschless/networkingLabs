frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! r2 — ABR (Area Border Router) between NSSA Area 1 and Area 0
!
! r2 sits at the boundary between:
!   - Area 1 (configured as NSSA) — facing r1
!   - Area 0 (backbone)           — facing r3
!
! As the ABR, r2 performs the critical NSSA function:
!   Type-7 LSA translation: converts Type-7 LSAs (originated by r1
!   inside area 1) into Type-5 LSAs for flooding into area 0.
!
! This translation happens automatically when both conditions are met:
!   1. The area is configured as NSSA on the ABR
!   2. The ABR has the highest router-id in the NSSA (if multiple ABRs)
!
! r2 also installs a default route into area 1 (NSSA areas get a
! default route from the ABR by default unless 'no-summary' suppresses
! inter-area LSAs).
!
! eth1: connects to r1 (10.1.12.0/30, r2=.2) — OSPF NSSA Area 1
! eth2: connects to r3 (10.1.23.0/30, r2=.1) — OSPF Area 0
! lo:   loopback 10.0.0.2/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.2/32

interface eth1
 description to-r1 (OSPF NSSA area 1)
 ip address 10.1.12.2/30

interface eth2
 description to-r3 (OSPF area 0)
 ip address 10.1.23.1/30

! -------------------------------------------------------------------
! TASK: Configure OSPF on r2 (ABR)
!
! router ospf
!  router-id 10.0.0.2
!  network 10.0.0.2/32 area 0
!  network 10.1.12.0/30 area 1
!  network 10.1.23.0/30 area 0
!  area 1 nssa
!
! Critical: 'area 1 nssa' must be configured on r2 as well as r1.
! The NSSA area type must match on all routers within the area.
!
! The loopback is placed in area 0 (backbone) because r2 is the ABR.
!
! r2 will automatically:
!   - Block Type-5 LSAs from entering area 1
!   - Translate Type-7 LSAs from area 1 into Type-5 for area 0
!   - Advertise a default route (Type-7) into area 1
!
! Verify:
!   show ip ospf neighbor             <- r1 in area 1, r3 in area 0
!   show ip ospf database             <- see both Type-3, Type-7, Type-5
!   show ip ospf database nssa-external  <- Type-7 from r1
!   show ip ospf database external    <- Type-5 originated by r2 (translated)
!
! Optional: totally NSSA (blocks inter-area Type-3 LSAs too):
!   area 1 nssa no-summary
!   This sends only a default route into area 1 (no inter-area summaries).
! -------------------------------------------------------------------
