name: flexvpn-basics

# Linux strongSwan analogue of Cisco FlexVPN route-based IKEv2. The gateway
# roles are intentionally Linux: the validated local cEOS and VyOS images do
# not implement Cisco FlexVPN, while strongSwan plus ip_vti exposes the real
# IKEv2, XFRM-mark, VTI, encryption, and hub-hairpin mechanisms being learned.
# Hosts and the simulated internet are incidental ops-lab Linux roles.

topology:
  nodes:
    host-a:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-a/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    gw-a:
      kind: linux
      image: flexvpn-lab:local
      binds:
        - configs/common/strongswan.conf:/etc/strongswan.conf:ro
        - configs/gw-a/ipsec.conf:/opt/flexvpn-basics/hub-ipsec.conf:ro
        - configs/gw-a/ipsec.secrets:/opt/flexvpn-basics/hub-ipsec.secrets:ro
        - configs/gw-a/setup.sh:/setup.sh:ro
        - configs/gw-a/apply-solution.sh:/opt/flexvpn-basics/apply-solution.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    internet:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/internet/setup.sh:/setup.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    gw-b:
      kind: linux
      image: flexvpn-lab:local
      binds:
        - configs/common/strongswan.conf:/etc/strongswan.conf:ro
        - configs/gw-b/ipsec.conf:/opt/flexvpn-basics/initial-ipsec.conf:ro
        - configs/gw-b/setup.sh:/setup.sh:ro
        - configs/gw-b/apply-solution.sh:/opt/flexvpn-basics/apply-solution.sh:ro
        - configs/gw-b/set-vti-key.sh:/opt/flexvpn-basics/set-vti-key.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    host-b:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-b/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    gw-c:
      kind: linux
      image: flexvpn-lab:local
      binds:
        - configs/common/strongswan.conf:/etc/strongswan.conf:ro
        - configs/gw-c/ipsec.conf:/opt/flexvpn-basics/initial-ipsec.conf:ro
        - configs/gw-c/setup.sh:/setup.sh:ro
        - configs/gw-c/apply-solution.sh:/opt/flexvpn-basics/apply-solution.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    host-c:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/host-c/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["host-a:eth1",   "gw-a:eth1"]       # 192.168.1.0/24
    - endpoints: ["gw-a:eth2",     "internet:eth1"]    # 203.0.113.0/30
    - endpoints: ["internet:eth2", "gw-b:eth1"]        # 203.0.113.4/30
    - endpoints: ["internet:eth3", "gw-c:eth1"]        # 203.0.113.8/30
    - endpoints: ["gw-b:eth2",     "host-b:eth1"]      # 192.168.2.0/24
    - endpoints: ["gw-c:eth2",     "host-c:eth1"]      # 192.168.3.0/24
