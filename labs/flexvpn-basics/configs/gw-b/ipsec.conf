# gw-b — FlexVPN Spoke1 IKEv2 configuration (practice — complete this file)
#
# YOUR TASK: Uncomment the conn block below and run: ipsec start
#
# Before starting ipsec, first create the VTI interface (run in bash):
#
#   ip tunnel add vti0 mode vti local 203.0.113.6 remote 203.0.113.1 key 1
#   ip link set vti0 up
#   ip addr add 10.10.1.2/30 dev vti0
#   sysctl -w net.ipv4.conf.vti0.disable_policy=1
#
# Then uncomment the conn block below and run: ipsec start
#
# Key concepts:
#   keyexchange=ikev2  — use IKEv2 (RFC 7296), not legacy IKEv1
#   leftid / rightid   — identity strings used for PSK lookup (must match ipsec.secrets)
#   mark=%unique       — binds this ESP SA to the VTI interface via kernel XFRM marks
#   leftsubnet=0.0.0.0/0 + rightsubnet=0.0.0.0/0  — "route-based": VTI handles traffic
#                                                     selection, not per-subnet policies

config setup
    charondebug="ike 1, knl 1"
    uniqueids=no

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s
    ike=aes256-sha256-modp2048!
    esp=aes256gcm16-modp2048!

