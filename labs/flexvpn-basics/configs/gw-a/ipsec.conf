config setup
    uniqueids=yes

conn %default
    keyexchange=ikev2
    authby=secret
    type=tunnel
    ike=aes256-sha256-modp2048!
    esp=aes256gcm16-modp2048!
    # Stay a responder after peer loss; spokes own initiation and retry.
    dpdaction=clear
    dpddelay=30s
    left=203.0.113.1
    leftid=@hub
    leftsubnet=0.0.0.0/0
    rightsubnet=0.0.0.0/0

conn to-spoke1
    right=203.0.113.6
    rightid=@spoke1
    mark=1
    auto=add

conn to-spoke2
    right=203.0.113.10
    rightid=@spoke2
    mark=2
    auto=add
