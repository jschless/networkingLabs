# gw-a — FlexVPN Hub IKEv2 configuration
#
# Two connections: one per spoke. Each uses a unique mark value that matches
# the kernel mark on the pre-created VTI interface. strongSwan uses the mark
# to bind ESP SAs to the correct VTI, so routed traffic goes through the VTI
# rather than via a policy-based (non-interface) XFRM entry.
#
# leftsubnet/rightsubnet=0.0.0.0/0 with mark-based VTI means the VTI
# interface itself is the "selector" — OSPF and other routed traffic rides
# over it without per-subnet XFRM policies. This is the key VTI advantage
# over traditional policy-based IPsec.

config setup
    charondebug="ike 1, knl 1"
    uniqueids=no

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s
    ike=aes256-sha256-modp2048!
    esp=aes256gcm16-modp2048!

# Hub <-> Spoke1 (gw-b, WAN 203.0.113.6)
conn to-spoke1
    left=203.0.113.1
    leftid=@hub
    leftsubnet=0.0.0.0/0
    right=203.0.113.6
    rightid=@spoke1
    rightsubnet=0.0.0.0/0
    mark=%unique
    type=tunnel
    auto=start

# Hub <-> Spoke2 (gw-c, WAN 203.0.113.10)
conn to-spoke2
    left=203.0.113.1
    leftid=@hub
    leftsubnet=0.0.0.0/0
    right=203.0.113.10
    rightid=@spoke2
    rightsubnet=0.0.0.0/0
    mark=%unique
    type=tunnel
    auto=start
