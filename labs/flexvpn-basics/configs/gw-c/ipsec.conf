#     left=203.0.113.10
#     leftid=@spoke2
#     leftsubnet=0.0.0.0/0
#     right=203.0.113.1
#     rightid=@hub
#     rightsubnet=0.0.0.0/0
#     mark=%unique
#     type=tunnel
#     auto=start
