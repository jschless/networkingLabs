# gw-c — FlexVPN Spoke2 IKEv2 configuration (practice — complete this file)
#
# YOUR TASK: Uncomment the conn block below and run: ipsec start
#
# Before starting ipsec, first create the VTI interface (run in bash):
#
#   ip tunnel add vti0 mode vti local 203.0.113.10 remote 203.0.113.1 key 2
#   ip link set vti0 up
#   ip addr add 10.10.2.2/30 dev vti0
#   sysctl -w net.ipv4.conf.vti0.disable_policy=1
#
# Then uncomment the conn block below and run: ipsec start
#
# Note: key=2 on the VTI matches mark=%unique bound to this connection.
# The hub uses vti2 (10.10.2.1/30) for this spoke.

config setup
    charondebug="ike 1, knl 1"
    uniqueids=no

conn %default
    keyexchange=ikev2
    authby=secret
    dpdaction=restart
    dpddelay=30s
    ike=aes256-sha256-modp2048!
    esp=aes256gcm16-modp2048!

