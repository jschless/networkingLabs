frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive

interface eth1
 ip address 10.1.12.1/30
 ip router isis CORE

router isis CORE
 net 49.0001.0100.0000.0001.00
 is-type level-1-only
