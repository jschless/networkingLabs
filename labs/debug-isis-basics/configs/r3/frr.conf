frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.3/32
 ip router isis CORE
 isis passive

interface eth1
 ip address 10.1.23.2/30
 ip router isis CORE

interface eth2
 ip address 10.1.34.1/30
 ip router isis CORE

router isis CORE
 net 49.0001.0100.0000.0003.00
 is-type level-1-only
