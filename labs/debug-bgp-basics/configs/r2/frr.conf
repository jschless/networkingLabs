frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1 (AS65001) — eBGP
 ip address 10.1.12.2/30
!
interface eth2
 description to r3 (AS65002) — iBGP
 ip address 10.1.23.1/30
!
router bgp 65002
 no bgp ebgp-requires-policy
 bgp router-id 10.0.0.2
 neighbor 10.1.12.1 remote-as 65001
 neighbor 10.1.23.2 remote-as 65002
 address-family ipv4 unicast
  neighbor 10.1.12.1 activate
  neighbor 10.1.23.2 activate
  network 10.0.0.2/32
 exit-address-family
!
end
