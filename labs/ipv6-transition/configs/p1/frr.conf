frr version 8.5
frr defaults traditional
hostname p1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! p1 — P router (IPv4-only MPLS core) + BGP Route Reflector for 6PE
!
! Roles:
!   - IS-IS level-2 + SR-MPLS: label-switched forwarding for the core
!   - BGP Route Reflector: reflects IPv6 labeled-unicast routes between pe1/pe2
!     (p1 itself does NOT forward IPv6 traffic — it only reflects BGP routes)
!
! Loopback: 10.0.0.2/32  (SR node SID index 2  -> label 16002)
!
! As RR, p1 reflects IPv6 labeled-unicast routes between pe1 and pe2 without
! modifying the next-hop. Each PE's IPv6 labeled route carries an IPv4 next-hop
! (the originating PE's loopback) which the remote PE resolves via IS-IS/SR.
!
interface lo
 ip address 10.0.0.2/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to pe1
 ip address 10.1.0.2/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
interface eth2
 description to pe2
 ip address 10.1.0.5/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.2/32 index 2
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp cluster-id 10.0.0.2
 !
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65000
 neighbor IBGP update-source lo
 !
 neighbor 10.0.0.1 peer-group IBGP
 neighbor 10.0.0.1 description pe1
 neighbor 10.0.0.3 peer-group IBGP
 neighbor 10.0.0.3 description pe2
 !
 address-family ipv4 unicast
  no neighbor IBGP activate
 exit-address-family
 !
 ! 6PE Route Reflection: reflect IPv6 labeled-unicast routes between pe1 and pe2.
 ! p1 does not originate any IPv6 prefixes — it only reflects.
 address-family ipv6 labeled-unicast
  neighbor IBGP activate
  neighbor IBGP route-reflector-client
  neighbor IBGP send-community both
 exit-address-family
!
end
