frr version 8.5
frr defaults traditional
hostname pe2
log syslog informational
! zebra must leave kernel IPv6 forwarding ON (see pe1)
ipv6 forwarding
service integrated-vtysh-config
!
! pe2 — 6PE Provider Edge router (AS65000)
!
! Roles:
!   - IPv4/MPLS core: IS-IS level-2 + SR-MPLS on eth1 (toward p1)
!   - IPv6 CE edge:   eBGP IPv6 with ce2 on eth2 (no IPv4 on this link)
!   - 6PE:            BGP ipv6 labeled-unicast to p1 (RR); assigns labels to
!                     IPv6 prefixes learned from ce2 for transport over MPLS
!
! Loopback: 10.0.0.3/32  (SR node SID index 3  -> label 16003)
!
interface lo
 ip address 10.0.0.3/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to p1 (IPv4 MPLS core)
 ip address 10.1.0.6/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
interface eth2
 description to ce2 (IPv6 only, no IPv4)
 ipv6 address fd00:20::0/127
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.3/32 index 3
!
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 !
 ! iBGP to p1 (route reflector)
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description p1-RR
 !
 ! eBGP IPv6 session to ce2
 neighbor fd00:20::1 remote-as 65002
 neighbor fd00:20::1 description ce2
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.2 activate
 exit-address-family
 !
 ! PE-CE runs plain IPv6 unicast (see pe1 header note: activating the CE under
 ! labeled-unicast leaves no common AFI/SAFI and the session never establishes).
 address-family ipv6 unicast
  neighbor fd00:20::1 activate
  neighbor fd00:20::1 route-map CE-PEER-IN in
 exit-address-family
 !
 address-family ipv6 labeled-unicast
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 send-community both
  ! Rewrite the next-hop to our IPv4-mapped loopback (FRR 8.4 ignores
  ! next-hop-self for ipv6 labeled-unicast)
  neighbor 10.0.0.2 route-map RR-6PE-OUT out
 exit-address-family
!
route-map CE-PEER-IN permit 10
 set ipv6 next-hop prefer-global
!
route-map RR-6PE-OUT permit 10
 set ipv6 next-hop global ::ffff:10.0.0.3
!
! Data plane: labeled statics — Linux cannot install IPv6 routes via an IPv4
! next-hop, so the BGP 6PE routes never reach the FIB (see pe1 for details).
ipv6 route fd00:1::/48 fe80::2:2 eth1 label 16001
ipv6 route fd00:10::/127 fe80::2:2 eth1 label 16001
!
end
