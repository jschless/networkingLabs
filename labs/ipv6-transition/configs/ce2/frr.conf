frr version 8.5
frr defaults traditional
hostname ce2
log syslog informational
service integrated-vtysh-config
!
! ce2 — IPv6-only CE router (AS65002)
!
! This router has NO IPv4 addresses. It is entirely IPv6.
! It peers eBGP IPv6 with pe2 and advertises fd00:2::/48.
! Goal: fd00:2::/48 should be reachable from ce1 across the IPv4 MPLS core.
!
interface lo
 ipv6 address fd00:2::1/128
!
interface eth1
 description to pe2 (fd00:20::/127)
 ipv6 address fd00:20::1/127
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 !
 ! eBGP IPv6 session to pe2
 neighbor fd00:20::0 remote-as 65000
 neighbor fd00:20::0 description pe2
 !
 address-family ipv4 unicast
  no neighbor fd00:20::0 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00:20::0 activate
  ! Advertise our loopback and aggregate prefix
  network fd00:2::1/128
  network fd00:2::/48
 exit-address-family
!
end
