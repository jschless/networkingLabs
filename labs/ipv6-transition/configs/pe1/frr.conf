frr version 8.5
frr defaults traditional
hostname pe1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! pe1 — 6PE Provider Edge router (AS65000)
!
! Roles:
!   - IPv4/MPLS core: IS-IS level-2 + SR-MPLS on eth2 (toward p1)
!   - IPv6 CE edge:   eBGP IPv6 with ce1 on eth1 (no IPv4 on this link)
!   - 6PE:            BGP ipv6 labeled-unicast to p1 (RR); assigns labels to
!                     IPv6 prefixes learned from ce1 for transport over MPLS
!
! Loopback: 10.0.0.1/32  (SR node SID index 1  -> label 16001)
!
! 6PE next-hop: pe1 advertises its IPv4 loopback 10.0.0.1 as the IPv6
! next-hop using the IPv4-mapped IPv6 format ::ffff:10.0.0.1 = ::ffff:0a00:0001.
! FRR handles this automatically for ipv6 labeled-unicast.
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to ce1 (IPv6 only, no IPv4)
 ipv6 address fd00:10::0/127
!
interface eth2
 description to p1 (IPv4 MPLS core)
 ip address 10.1.0.1/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.1/32 index 1
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 ! iBGP to p1 (route reflector) — used for 6PE label exchange
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description p1-RR
 !
 ! eBGP IPv6 session to ce1
 neighbor fd00:10::1 remote-as 65001
 neighbor fd00:10::1 description ce1
 !
 address-family ipv4 unicast
  ! Disable IPv4 unicast for iBGP; we use labeled-unicast only
  no neighbor 10.0.0.2 activate
 exit-address-family
 !
 ! 6PE: IPv6 labeled-unicast — the core 6PE address family.
 ! IPv6 prefixes are advertised with MPLS labels over iBGP.
 ! The iBGP next-hop (10.0.0.2) is reached via SR-MPLS, providing
 ! the outer label. The BGP label is the inner (6PE) label.
 address-family ipv6 labeled-unicast
  ! Activate iBGP to RR (p1) for 6PE
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 send-community both
  ! Activate eBGP to ce1 to import its IPv6 prefixes
  neighbor fd00:10::1 activate
  ! When receiving from ce1, prefer the global (link-local won't work over MPLS)
  neighbor fd00:10::1 route-map CE-PEER-IN in
 exit-address-family
!
! Force use of global next-hop for CE eBGP peers (required for 6PE):
! link-local next-hops cannot be used as 6PE next-hops across the MPLS core.
route-map CE-PEER-IN permit 10
 set ipv6 next-hop prefer-global
!
end
