frr version 8.5
frr defaults traditional
hostname pe1
log syslog informational
! zebra must leave kernel IPv6 forwarding ON or the PE cannot forward
! between the CE link and the MPLS core ("no ipv6 forwarding" wins over
! the topology sysctls).
ipv6 forwarding
service integrated-vtysh-config
!
! pe1 — 6PE Provider Edge router (AS65000)
!
! Roles:
!   - IPv4/MPLS core: IS-IS level-2 + SR-MPLS on eth2 (toward p1)
!   - IPv6 CE edge:   eBGP IPv6 with ce1 on eth1 (no IPv4 on this link)
!   - 6PE:            BGP ipv6 labeled-unicast to p1 (RR); assigns labels to
!                     IPv6 prefixes learned from ce1 for transport over MPLS
!
! Loopback: 10.0.0.1/32  (SR node SID index 1  -> label 16001)
!
! 6PE next-hop: pe1 advertises its IPv4 loopback 10.0.0.1 as the IPv6
! next-hop using the IPv4-mapped IPv6 format ::ffff:10.0.0.1 = ::ffff:0a00:0001.
! FRR 8.4 does NOT rewrite the next-hop toward the RR on its own (next-hop-self
! is ignored for ipv6 labeled-unicast), so the RR-6PE-OUT route-map below sets
! it explicitly — without it the RR sees ce1's link address and the routes
! stay invalid.
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
!
interface eth1
 description to ce1 (IPv6 only, no IPv4)
 ipv6 address fd00:10::0/127
!
interface eth2
 description to p1 (IPv4 MPLS core)
 ip address 10.1.0.1/30
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 mpls enable
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing on
 segment-routing prefix 10.0.0.1/32 index 1
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 ! iBGP to p1 (route reflector) — used for 6PE label exchange
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description p1-RR
 !
 ! eBGP IPv6 session to ce1
 neighbor fd00:10::1 remote-as 65001
 neighbor fd00:10::1 description ce1
 !
 address-family ipv4 unicast
  ! Disable IPv4 unicast for iBGP; we use labeled-unicast only
  no neighbor 10.0.0.2 activate
 exit-address-family
 !
 ! PE-CE runs plain IPv6 unicast (ce1 activates SAFI unicast only — putting
 ! the CE under labeled-unicast leaves the two OPENs with no common AFI/SAFI
 ! and FRR resets the session with "Unsupported Capability"). FRR shares one
 ! RIB between ipv6 unicast and labeled-unicast, so routes learned here are
 ! advertised with labels to the LU peers below.
 address-family ipv6 unicast
  neighbor fd00:10::1 activate
  ! When receiving from ce1, prefer the global (link-local won't work over MPLS)
  neighbor fd00:10::1 route-map CE-PEER-IN in
 exit-address-family
 !
 ! 6PE: IPv6 labeled-unicast — the core 6PE address family.
 ! IPv6 prefixes are advertised with MPLS labels over iBGP.
 ! The iBGP next-hop (10.0.0.2) is reached via SR-MPLS, providing
 ! the outer label. The BGP label is the inner (6PE) label.
 address-family ipv6 labeled-unicast
  ! Activate iBGP to RR (p1) for 6PE
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 send-community both
  ! Rewrite the next-hop to our IPv4-mapped loopback (see header note)
  neighbor 10.0.0.2 route-map RR-6PE-OUT out
 exit-address-family
!
! Force use of global next-hop for CE eBGP peers (required for 6PE):
! link-local next-hops cannot be used as 6PE next-hops across the MPLS core.
route-map CE-PEER-IN permit 10
 set ipv6 next-hop prefer-global
!
! 6PE next-hop toward the RR: our IPv4 loopback as an IPv4-mapped IPv6 address.
route-map RR-6PE-OUT permit 10
 set ipv6 next-hop global ::ffff:10.0.0.1
!
! --- Data plane: labeled static routes -------------------------------------
! The Linux kernel cannot install an IPv6 route whose next-hop is an IPv4
! address (EINVAL for plain via, RTA_VIA and nexthop objects alike), so zebra
! can never program the BGP 6PE routes above into the FIB — they stay
! control-plane only. These statics push the same SR label the BGP route
! resolves to, via p1's fixed link-local address (configured in p1's frr.conf).
ipv6 route fd00:2::/48 fe80::2:1 eth2 label 16003
ipv6 route fd00:20::/127 fe80::2:1 eth2 label 16003
!
end
