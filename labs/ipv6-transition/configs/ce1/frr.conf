frr version 8.5
frr defaults traditional
hostname ce1
log syslog informational
service integrated-vtysh-config
!
! ce1 — IPv6-only CE router (AS65001)
!
! This router has NO IPv4 addresses. It is entirely IPv6.
! It peers eBGP IPv6 with pe1 and advertises fd00:1::/48.
! Goal: fd00:1::/48 should be reachable from ce2 across the IPv4 MPLS core.
!
interface lo
 ipv6 address fd00:1::1/128
!
interface eth1
 description to pe1 (fd00:10::/127)
 ipv6 address fd00:10::1/127
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 !
 ! eBGP IPv6 session to pe1
 neighbor fd00:10::0 remote-as 65000
 neighbor fd00:10::0 description pe1
 !
 address-family ipv4 unicast
  no neighbor fd00:10::0 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00:10::0 activate
  ! Advertise our loopback and aggregate prefix
  network fd00:1::1/128
  network fd00:1::/48
 exit-address-family
!
end
