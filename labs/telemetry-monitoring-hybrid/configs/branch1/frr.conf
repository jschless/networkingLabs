frr version 8.4_git
frr defaults traditional
hostname branch1
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
!
interface eth1
 ip address 10.10.10.1/24
 ip ospf area 0
 ip ospf passive
!
interface eth2
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf mtu-ignore
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.1
!
