frr version 8.4_git
frr defaults traditional
hostname dc1
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.5/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.45.2/30
 ip ospf area 0
 ip ospf mtu-ignore
 ip ospf network point-to-point
!
interface eth2
 ip address 10.20.20.1/24
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.5
!
