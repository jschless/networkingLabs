name: debug-ospf-auth

# Debug lab — OSPF MD5 authentication with an intentional key mismatch.
# Deploy, observe the symptoms, and diagnose the fault before looking at configs.
#
# Topology:
#
#   [r1] --Area 0-- [r2] --Area 0-- [r3]
#
# All interfaces are in OSPF area 0.
# MD5 authentication is configured on every OSPF interface.

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30
