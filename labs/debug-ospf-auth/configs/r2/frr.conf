frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to r1
 ip address 10.1.12.2/30
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 SecretKey321
!
interface eth2
 description to r3
 ip address 10.1.23.1/30
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 SecretKey123
!
router ospf
 ospf router-id 10.0.0.2
 network 10.0.0.2/32 area 0
 network 10.1.12.0/30 area 0
 network 10.1.23.0/30 area 0
 passive-interface lo
!
end
