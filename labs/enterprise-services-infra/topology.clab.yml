name: enterprise-services-infra

topology:
  defaults:
    kind: linux
    image: enterprise-services-infra:local

  nodes:
    edge1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/edge1/startup-config

    campus1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/campus1/startup-config

    services1:
      binds:
        - configs/services1/setup.sh:/setup.sh
        - configs/services1/dnsmasq.conf:/etc/dnsmasq.d/lab.conf
        - configs/services1/chrony.conf:/etc/chrony/chrony.conf
        - configs/services1/rsyslog.conf:/etc/rsyslog.conf
      exec:
        - bash /setup.sh

    tacacs1:
      image: enterprise-tacacs:local
      binds:
        - configs/tacacs1/setup.sh:/setup.sh
        - configs/tacacs1/tac_plus.conf:/etc/tacacs+/tac_plus.conf
      exec:
        - bash /setup.sh

    client1:
      binds:
        - configs/client1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    mgmt1:
      binds:
        - configs/mgmt1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["edge1:eth1", "campus1:eth1"]
    - endpoints: ["campus1:eth2", "client1:eth1"]
    - endpoints: ["campus1:eth3", "services1:eth1"]
    - endpoints: ["campus1:eth4", "mgmt1:eth1"]
    - endpoints: ["campus1:eth5", "tacacs1:eth1"]
