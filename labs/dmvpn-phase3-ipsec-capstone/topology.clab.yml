name: dmvpn-phase3-ipsec-capstone

# Native VyOS capstone. Learners build the complete NHRP, OSPF, PKI, and
# certificate-IPsec control plane over an interface-only baseline.

topology:
  nodes:
    br-wan:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/br-wan/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    ca:
      kind: linux
      image: dmvpn-pki:local
      binds:
        - configs/ca/init-ca.sh:/opt/dmvpn-pki/init-ca.sh:ro
        - configs/ca/issue-router.sh:/opt/dmvpn-pki/issue-router.sh:ro
        - configs/ca/validate-pki.sh:/opt/dmvpn-pki/validate-pki.sh:ro

    hub:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/hub/config.boot
      binds:
        - configs/router/apply-solution.sh:/opt/dmvpn-capstone/apply-solution.sh:ro

    spoke1:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke1/config.boot
      binds:
        - configs/router/apply-solution.sh:/opt/dmvpn-capstone/apply-solution.sh:ro
        - configs/spoke1/remove-pair.sh:/opt/dmvpn-capstone/remove-pair.sh:ro
        - configs/spoke1/restore-pair.sh:/opt/dmvpn-capstone/restore-pair.sh:ro

    spoke2:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke2/config.boot
      binds:
        - configs/router/apply-solution.sh:/opt/dmvpn-capstone/apply-solution.sh:ro
        - configs/spoke2/remove-pair.sh:/opt/dmvpn-capstone/remove-pair.sh:ro
        - configs/spoke2/restore-pair.sh:/opt/dmvpn-capstone/restore-pair.sh:ro

    spoke3:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke3/config.boot
      binds:
        - configs/router/apply-solution.sh:/opt/dmvpn-capstone/apply-solution.sh:ro

  links:
    - endpoints: ["hub:eth1", "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
