frr version 8.5
frr defaults traditional
hostname spoke1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! spoke1 Interfaces
!
! spoke1 is a pure spoke — it connects only to the hub.
! It has no downstream networks and should NOT transit traffic.
!
! eth1: connects to hub (10.1.11.0/30, spoke1=.2)
! lo:   loopback 10.0.0.2/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.2/32

interface eth1
 description to-hub
 ip address 10.1.11.2/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100 on spoke1
!
! router eigrp 100
!  network 10.0.0.2/32
!  network 10.1.11.0/30
!  no auto-summary
!
! Step 1 — Basic EIGRP (no stub yet):
!   Verify: show ip eigrp neighbors   <- hub should appear
!   Verify: show ip route eigrp       <- all loopbacks reachable
!
! Step 2 — Configure stub:
!   router eigrp 100
!    eigrp stub connected summary
!
! What this does:
!   - spoke1 will only advertise its CONNECTED routes and SUMMARY routes
!   - spoke1 will NOT transit traffic between hub and other spokes
!   - hub will NOT send queries to spoke1 when a route goes active
!
! Verify on hub:
!   show ip eigrp neighbors detail    <- look for "Peer-type is Stub"
!
! Note: spoke1 still receives routes from the hub. Stub only affects
! what spoke1 ADVERTISES and how hub handles QUERIES to spoke1.
! -------------------------------------------------------------------
