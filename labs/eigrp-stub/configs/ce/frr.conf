frr version 8.5
frr defaults traditional
hostname ce
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! ce (Customer Edge) Interfaces
!
! ce represents a downstream customer connected to spoke3.
! Its loopback (10.0.0.5/32) and the link to spoke3 (10.1.30.0/30)
! are the prefixes that must remain reachable via spoke3 even after
! spoke3 is configured as stub.
!
! eth1: connects to spoke3 (10.1.30.0/30, ce=.2)
! lo:   loopback 10.0.0.5/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.5/32

interface eth1
 description to-spoke3
 ip address 10.1.30.2/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100 on ce
!
! router eigrp 100
!  network 10.0.0.5/32
!  network 10.1.30.0/30
!  no auto-summary
!
! ce does NOT need to be stub — it has only one upstream (spoke3)
! and there is no reason to limit queries from spoke3 toward ce.
!
! Verify from hub after all stub config is done:
!   ping 10.0.0.5 source 10.0.0.1    <- hub to ce loopback
!   show ip route 10.0.0.5           <- should show D (EIGRP) via spoke3
! -------------------------------------------------------------------
