frr version 8.5
frr defaults traditional
hostname hub
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! hub Interfaces
!
! The hub is the central router in a hub-and-spoke EIGRP network.
! It connects to three spokes and is the only path between them.
!
! In a large hub-and-spoke network, when a route on the hub goes away,
! EIGRP sends queries to ALL neighbors asking "do you have a path?"
! The spokes receive the query but may not answer quickly (or may time
! out), leading to routes going Stuck In Active (SIA). The fix is to
! mark spoke routers as STUB so the hub never queries them.
!
! eth1: connects to spoke1 (10.1.11.0/30, hub=.1)
! eth2: connects to spoke2 (10.1.12.0/30, hub=.1)
! eth3: connects to spoke3 (10.1.13.0/30, hub=.1)
! lo:   loopback 10.0.0.1/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.1/32

interface eth1
 description to-spoke1
 ip address 10.1.11.1/30

interface eth2
 description to-spoke2
 ip address 10.1.12.1/30

interface eth3
 description to-spoke3
 ip address 10.1.13.1/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100 on hub
!
! router eigrp 100
!  network 10.0.0.1/32
!  network 10.1.11.0/30
!  network 10.1.12.0/30
!  network 10.1.13.0/30
!  no auto-summary
!
! NOTE: Do NOT configure stub on the hub. The hub must answer queries
! from other parts of the network.
!
! After spokes are configured as stub, verify from hub:
!   show ip eigrp neighbors detail
! Look for the line "Peer-type is Stub" next to each spoke neighbor.
!
! Test SIA prevention:
!   On hub, shut an interface (ip link set ethX down from Linux shell)
!   Watch: hub does NOT query stub spokes for alternate paths.
!   Compare with non-stub behavior (remove stub from a spoke, repeat).
! -------------------------------------------------------------------
