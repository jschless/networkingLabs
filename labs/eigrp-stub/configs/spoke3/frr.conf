frr version 8.5
frr defaults traditional
hostname spoke3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! spoke3 Interfaces
!
! spoke3 is a spoke that has a downstream customer (ce).
! Unlike spoke1 and spoke2, spoke3 has a non-connected external prefix
! (10.1.30.0/30 toward ce) that needs to be reachable from the hub.
!
! This makes spoke3 more complex: we WANT to mark it as stub (to limit
! queries), but we also need the hub to learn about 10.1.30.0/30.
!
! The solution is stub + leak-map: configure stub but allow specific
! prefixes through using a route-map (leak-map).
!
! eth1: connects to hub (10.1.13.0/30, spoke3=.2)
! eth2: connects to ce  (10.1.30.0/30, spoke3=.1)
! lo:   loopback 10.0.0.4/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.4/32

interface eth1
 description to-hub
 ip address 10.1.13.2/30

interface eth2
 description to-ce
 ip address 10.1.30.1/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100 on spoke3 with leak-map
!
! Step 1 — Basic EIGRP:
!   router eigrp 100
!    network 10.0.0.4/32
!    network 10.1.13.0/30
!    network 10.1.30.0/30
!    no auto-summary
!
! Step 2 — Create an access-list or prefix-list for the CE prefix:
!   ip prefix-list LEAK-CE seq 5 permit 10.1.30.0/30
!   ip prefix-list LEAK-CE seq 10 permit 10.0.0.5/32
!
! Step 3 — Create a route-map that matches the prefixes to leak:
!   route-map LEAK-MAP permit 10
!    match ip address prefix-list LEAK-CE
!
! Step 4 — Configure stub with leak-map:
!   router eigrp 100
!    eigrp stub connected summary leak-map LEAK-MAP
!
! What happens:
!   - spoke3 is marked stub (hub won't send queries to it)
!   - BUT spoke3 still advertises prefixes matched by LEAK-MAP
!   - hub can still reach ce via spoke3
!
! Verify:
!   show ip eigrp neighbors detail    (on hub: Stub flag on spoke3)
!   show ip route 10.1.30.0/30        (on hub: reachable via spoke3)
!   show ip route 10.0.0.5            (on hub: reachable via spoke3)
! -------------------------------------------------------------------
