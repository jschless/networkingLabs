frr version 8.5
frr defaults traditional
hostname spoke2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! -------------------------------------------------------------------
! spoke2 Interfaces
!
! spoke2 is a pure spoke — connects only to the hub.
! Mirror of spoke1. Will also be configured as stub.
!
! eth1: connects to hub (10.1.12.0/30, spoke2=.2)
! lo:   loopback 10.0.0.3/32
! -------------------------------------------------------------------

interface lo
 ip address 10.0.0.3/32

interface eth1
 description to-hub
 ip address 10.1.12.2/30

! -------------------------------------------------------------------
! TASK: Configure EIGRP AS 100 on spoke2
!
! Step 1 — Basic EIGRP:
!   router eigrp 100
!    network 10.0.0.3/32
!    network 10.1.12.0/30
!    no auto-summary
!
! Step 2 — Configure stub (same as spoke1):
!   router eigrp 100
!    eigrp stub connected summary
!
! Verify on hub after configuring both spoke1 and spoke2 as stub:
!   show ip eigrp neighbors detail
! You should see BOTH spoke1 and spoke2 flagged as Stub peers.
!
! Now simulate a route failure and observe query behaviour:
!   (on hub) ip link set eth3 down    <- break link to spoke3
!   debug eigrp packets query         <- watch: NO queries to stub spokes
! -------------------------------------------------------------------
