name: macsec-basics

# MACsec Basics — VyOS
#
# Two links between the same routers:
# - eth1 <-> eth1 : protected by MACsec (on-wire EtherType 0x88E5)
# - eth2 <-> eth2 : normal Ethernet baseline

topology:
  nodes:
    r1:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/r1/config.boot

    r2:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/r2/config.boot

  links:
    - endpoints: ["r1:eth1", "r2:eth1"] # MACsec source link
    - endpoints: ["r1:eth2", "r2:eth2"] # Plain Ethernet comparison link
