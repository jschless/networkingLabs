frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.1/32

interface eth1
 description to r2
 ip address 10.1.12.1/30

interface eth2
 description to r3
 ip address 10.1.13.1/30

router eigrp 100
 eigrp router-id 10.0.0.1
 network 0.0.0.0/0
 passive-interface lo
