frr version 8.5
frr defaults traditional
hostname r4
log syslog informational
ipv6 forwarding
service integrated-vtysh-config

interface lo
 ! Loopback — dual-stack
 ip address 10.0.0.4/32
 ipv6 address 2001:db8::4/128

interface eth1
 ! Link to r3 (AS65002)
 ! IPv4: 10.1.34.0/30 — r3=.1, r4=.2
 ! IPv6: 2001:db8:34::/64 — r3=::1, r4=::2
 ip address 10.1.34.2/30
 ipv6 address 2001:db8:34::2/64

! -------------------------------------------------------
! YOUR TASK: Configure BGP for AS65003
!
! r4 is in AS65003. It peers with r3 (AS65002). This is eBGP.
!
! APPROACH A — IPv4 session + extended next-hop for IPv6:
!
!   router bgp 65003
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.4
!    neighbor 10.1.34.1 remote-as 65002
!    !
!    address-family ipv4 unicast
!     neighbor 10.1.34.1 activate
!     network 10.0.0.4/32
!    !
!    address-family ipv6 unicast
!     neighbor 10.1.34.1 activate
!     neighbor 10.1.34.1 capability extended-nexthop
!     network 2001:db8::4/128
!
! APPROACH B — native IPv6 session:
!
!   router bgp 65003
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.4
!    neighbor 2001:db8:34::1 remote-as 65002
!    !
!    address-family ipv6 unicast
!     neighbor 2001:db8:34::1 activate
!     network 2001:db8::4/128
!
! After full config, r4 should see routes from AS65001 (r1's prefixes).
! -------------------------------------------------------
