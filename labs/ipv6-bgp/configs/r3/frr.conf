frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
ipv6 forwarding
service integrated-vtysh-config

interface lo
 ! Loopback — dual-stack
 ip address 10.0.0.3/32
 ipv6 address 2001:db8::3/128

interface eth1
 ! Link to r2 (iBGP peer in AS65002)
 ! IPv4: 10.1.23.0/30 — r2=.1, r3=.2
 ! IPv6: 2001:db8:23::/64 — r2=::1, r3=::2
 ip address 10.1.23.2/30
 ipv6 address 2001:db8:23::2/64

interface eth2
 ! Link to r4 (AS65003)
 ! IPv4: 10.1.34.0/30 — r3=.1, r4=.2
 ! IPv6: 2001:db8:34::/64 — r3=::1, r4=::2
 ip address 10.1.34.1/30
 ipv6 address 2001:db8:34::1/64

! -------------------------------------------------------
! YOUR TASK: Configure BGP for AS65002 on r3
!
! r3 is in AS65002. It has:
!   - iBGP session to r2 (AS65002) via eth1
!   - eBGP session to r4 (AS65003) via eth2
!
!   router bgp 65002
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.3
!    neighbor 10.1.23.1 remote-as 65002
!    neighbor 10.1.34.2 remote-as 65003
!    !
!    address-family ipv4 unicast
!     neighbor 10.1.23.1 activate
!     neighbor 10.1.23.1 next-hop-self
!     neighbor 10.1.34.2 activate
!     network 10.0.0.3/32
!    !
!    address-family ipv6 unicast
!     neighbor 10.1.23.1 activate
!     neighbor 10.1.23.1 next-hop-self
!     neighbor 10.1.34.2 activate
!     neighbor 10.1.34.2 capability extended-nexthop
!     network 2001:db8::3/128
! -------------------------------------------------------
