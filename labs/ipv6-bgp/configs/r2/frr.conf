frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
ipv6 forwarding
service integrated-vtysh-config

interface lo
 ! Loopback — dual-stack
 ip address 10.0.0.2/32
 ipv6 address 2001:db8::2/128

interface eth1
 ! Link to r1 (AS65001)
 ! IPv4: 10.1.12.0/30 — r1=.1, r2=.2
 ! IPv6: 2001:db8:12::/64 — r1=::1, r2=::2
 ip address 10.1.12.2/30
 ipv6 address 2001:db8:12::2/64

interface eth2
 ! Link to r3 (iBGP peer in AS65002)
 ! IPv4: 10.1.23.0/30 — r2=.1, r3=.2
 ! IPv6: 2001:db8:23::/64 — r2=::1, r3=::2
 ip address 10.1.23.1/30
 ipv6 address 2001:db8:23::1/64

! -------------------------------------------------------
! YOUR TASK: Configure BGP for AS65002 on r2
!
! r2 is in AS65002. It has:
!   - eBGP session to r1 (AS65001) via eth1
!   - iBGP session to r3 (AS65002) via eth2
!
! For iBGP, the session can be over loopbacks (update-source lo)
! or directly over the connected link. Use the connected link
! for simplicity.
!
! APPROACH A — IPv4 sessions:
!
!   router bgp 65002
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.2
!    neighbor 10.1.12.1 remote-as 65001
!    neighbor 10.1.23.2 remote-as 65002
!    !
!    address-family ipv4 unicast
!     neighbor 10.1.12.1 activate
!     neighbor 10.1.23.2 activate
!     neighbor 10.1.23.2 next-hop-self
!     network 10.0.0.2/32
!    !
!    address-family ipv6 unicast
!     neighbor 10.1.12.1 activate
!     neighbor 10.1.12.1 capability extended-nexthop
!     neighbor 10.1.23.2 activate
!     neighbor 10.1.23.2 next-hop-self
!     network 2001:db8::2/128
!
! NOTE: next-hop-self on iBGP is needed because eBGP next-hop
! (r1's address) is not reachable by r3 without it.
! -------------------------------------------------------
