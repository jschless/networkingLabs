frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
ipv6 forwarding
service integrated-vtysh-config

interface lo
 ! Loopback — dual-stack
 ip address 10.0.0.1/32
 ipv6 address 2001:db8::1/128

interface eth1
 ! Link to r2 (AS65002)
 ! IPv4: 10.1.12.0/30 — r1=.1, r2=.2
 ! IPv6: 2001:db8:12::/64 — r1=::1, r2=::2
 ip address 10.1.12.1/30
 ipv6 address 2001:db8:12::1/64

! -------------------------------------------------------
! YOUR TASK: Configure BGP for AS65001
!
! r1 is in AS65001. It peers with r2 (AS65002).
! This is an eBGP session.
!
! APPROACH A — IPv4 session with extended next-hop for IPv6:
!
!   router bgp 65001
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.1
!    neighbor 10.1.12.2 remote-as 65002
!    !
!    address-family ipv4 unicast
!     neighbor 10.1.12.2 activate
!     network 10.0.0.1/32
!    !
!    address-family ipv6 unicast
!     neighbor 10.1.12.2 activate
!     neighbor 10.1.12.2 capability extended-nexthop
!     network 2001:db8::1/128
!
! APPROACH B — native IPv6 session:
!
!   router bgp 65001
!    no bgp ebgp-requires-policy
!    bgp router-id 10.0.0.1
!    neighbor 2001:db8:12::2 remote-as 65002
!    !
!    address-family ipv6 unicast
!     neighbor 2001:db8:12::2 activate
!     network 2001:db8::1/128
!
! Verify:
!   show bgp ipv4 unicast summary
!   show bgp ipv6 unicast summary
!   show bgp ipv6 unicast
! -------------------------------------------------------
