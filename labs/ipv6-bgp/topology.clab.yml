name: ipv6-bgp

# Dual-stack BGP practice — IPv4 unicast + IPv6 unicast
#
# Topology:
#   [r1] --eBGP-- [r2] --iBGP-- [r3] --eBGP-- [r4]
#   AS65001       AS65002        AS65002        AS65003
#
# Both IPv4 and IPv6 addresses pre-configured.
# Task: configure BGP to advertise both address families end-to-end.
#
# Two approaches documented (implement either or both):
#   A. Separate IPv4 and IPv6 BGP sessions (one per AF)
#   B. IPv4 session carrying both AFs with extended-nexthop

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    r1:
      startup-config: configs/r1/startup-config
    r2:
      startup-config: configs/r2/startup-config
    r3:
      startup-config: configs/r3/startup-config
    r4:
      startup-config: configs/r4/startup-config

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30 + 2001:db8:12::/64
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30 + 2001:db8:23::/64
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30 + 2001:db8:34::/64
