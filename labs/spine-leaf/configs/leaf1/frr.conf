frr version 8.5
frr defaults traditional
hostname leaf1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.1/32

interface eth1
 ! Link to spine1 — 10.1.0.0/31 (leaf1=.0  spine1=.1)
 ip address 10.1.0.0/31

interface eth2
 ! Link to spine2 — 10.2.0.0/31 (leaf1=.0  spine2=.1)
 ip address 10.2.0.0/31

! -------------------------------------------------------
! YOUR TASK: Configure BGP AS65001 on leaf1
!
! leaf1 has dual uplinks to both spines via eBGP.
! Use maximum-paths 2 to enable ECMP across both uplinks.
! Advertise the loopback (simulates a VTEP or server IP).
!
! router bgp 65001
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.1
!  bgp bestpath as-path multipath-relax
!  maximum-paths 2
!  neighbor 10.1.0.1 remote-as 65100
!  neighbor 10.2.0.1 remote-as 65200
!  !
!  address-family ipv4 unicast
!   network 10.0.0.1/32
!   neighbor 10.1.0.1 activate
!   neighbor 10.2.0.1 activate
! -------------------------------------------------------
