frr version 8.5
frr defaults traditional
hostname spine2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.102/32

interface eth1
 ! Link to leaf1 — 10.2.0.0/31 (leaf1=.0  spine2=.1)
 ip address 10.2.0.1/31

interface eth2
 ! Link to leaf2 — 10.2.0.2/31 (leaf2=.2  spine2=.3)
 ip address 10.2.0.3/31

interface eth3
 ! Link to leaf3 — 10.2.0.4/31 (leaf3=.4  spine2=.5)
 ip address 10.2.0.5/31

interface eth4
 ! Link to leaf4 — 10.2.0.6/31 (leaf4=.6  spine2=.7)
 ip address 10.2.0.7/31

! -------------------------------------------------------
! YOUR TASK: Configure BGP AS65200 on spine2
!
! spine2 is the secondary spine. Same design as spine1 but with
! its own AS (65200) and different link subnets (10.2.x.x).
!
! router bgp 65200
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.102
!  bgp bestpath as-path multipath-relax
!  maximum-paths 4
!  neighbor 10.2.0.0 remote-as 65001
!  neighbor 10.2.0.2 remote-as 65002
!  neighbor 10.2.0.4 remote-as 65003
!  neighbor 10.2.0.6 remote-as 65004
!  !
!  address-family ipv4 unicast
!   network 10.0.0.102/32
!   neighbor 10.2.0.0 activate
!   neighbor 10.2.0.2 activate
!   neighbor 10.2.0.4 activate
!   neighbor 10.2.0.6 activate
! -------------------------------------------------------
