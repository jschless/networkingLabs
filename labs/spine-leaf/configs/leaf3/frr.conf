frr version 8.5
frr defaults traditional
hostname leaf3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.3/32

interface eth1
 ! Link to spine1 — 10.1.0.4/31 (leaf3=.4  spine1=.5)
 ip address 10.1.0.4/31

interface eth2
 ! Link to spine2 — 10.2.0.4/31 (leaf3=.4  spine2=.5)
 ip address 10.2.0.4/31

! -------------------------------------------------------
! YOUR TASK: Configure BGP AS65003 on leaf3
!
! router bgp 65003
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.3
!  bgp bestpath as-path multipath-relax
!  maximum-paths 2
!  neighbor 10.1.0.5 remote-as 65100
!  neighbor 10.2.0.5 remote-as 65200
!  !
!  address-family ipv4 unicast
!   network 10.0.0.3/32
!   neighbor 10.1.0.5 activate
!   neighbor 10.2.0.5 activate
! -------------------------------------------------------
