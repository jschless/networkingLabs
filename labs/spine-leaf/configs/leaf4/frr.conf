frr version 8.5
frr defaults traditional
hostname leaf4
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.4/32

interface eth1
 ! Link to spine1 — 10.1.0.6/31 (leaf4=.6  spine1=.7)
 ip address 10.1.0.6/31

interface eth2
 ! Link to spine2 — 10.2.0.6/31 (leaf4=.6  spine2=.7)
 ip address 10.2.0.6/31

! -------------------------------------------------------
! YOUR TASK: Configure BGP AS65004 on leaf4
!
! router bgp 65004
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.4
!  bgp bestpath as-path multipath-relax
!  maximum-paths 2
!  neighbor 10.1.0.7 remote-as 65100
!  neighbor 10.2.0.7 remote-as 65200
!  !
!  address-family ipv4 unicast
!   network 10.0.0.4/32
!   neighbor 10.1.0.7 activate
!   neighbor 10.2.0.7 activate
! -------------------------------------------------------
