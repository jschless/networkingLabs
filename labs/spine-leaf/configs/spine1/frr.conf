frr version 8.5
frr defaults traditional
hostname spine1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.101/32

interface eth1
 ! Link to leaf1 — 10.1.0.0/31 (leaf1=.0  spine1=.1)
 ip address 10.1.0.1/31

interface eth2
 ! Link to leaf2 — 10.1.0.2/31 (leaf2=.2  spine1=.3)
 ip address 10.1.0.3/31

interface eth3
 ! Link to leaf3 — 10.1.0.4/31 (leaf3=.4  spine1=.5)
 ip address 10.1.0.5/31

interface eth4
 ! Link to leaf4 — 10.1.0.6/31 (leaf4=.6  spine1=.7)
 ip address 10.1.0.7/31

! -------------------------------------------------------
! YOUR TASK: Configure BGP AS65100 on spine1
!
! spine1 is the primary spine in a CLOS fabric.
! Establish eBGP sessions to all 4 leaves and enable ECMP.
!
! Key concepts:
!   - bgp bestpath as-path multipath-relax: required so routes from
!     different leaf ASes are considered equal-cost (different AS paths
!     would otherwise prevent ECMP)
!   - maximum-paths 4: install up to 4 equal-cost BGP paths
!   - no bgp ebgp-requires-policy: skip explicit route-map requirement
!
! router bgp 65100
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.101
!  bgp bestpath as-path multipath-relax
!  maximum-paths 4
!  neighbor 10.1.0.0 remote-as 65001
!  neighbor 10.1.0.2 remote-as 65002
!  neighbor 10.1.0.4 remote-as 65003
!  neighbor 10.1.0.6 remote-as 65004
!  !
!  address-family ipv4 unicast
!   network 10.0.0.101/32
!   neighbor 10.1.0.0 activate
!   neighbor 10.1.0.2 activate
!   neighbor 10.1.0.4 activate
!   neighbor 10.1.0.6 activate
! -------------------------------------------------------
