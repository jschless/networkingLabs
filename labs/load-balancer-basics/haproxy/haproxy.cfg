# haproxy.cfg — YOU build this file, task by task.
#
# This directory is bind-mounted into the lb container at /etc/haproxy.
# Validate + run from inside lb:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
#   haproxy -D -f /etc/haproxy/haproxy.cfg     (pkill haproxy first to restart)
#
# The global/defaults sections below are scaffolding — keep them.
# Everything else (frontends, backends, the stats listener) is yours:
#   Task 2: a TCP-mode frontend on :80 balancing web1/web2 round-robin
#   Task 3: health checks + a stats listener
#   Task 4: switch to HTTP mode + X-Forwarded-For
#   Task 7: path routing + graceful degradation (open-ended)

global
    log stdout format raw local0
    maxconn 256

defaults
    log     global
    timeout connect 5s
    timeout client  30s
    timeout server  30s
