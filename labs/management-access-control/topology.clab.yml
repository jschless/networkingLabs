name: management-access-control

topology:
  defaults:
    kind: linux
    image: ops-lab:local

  nodes:
    device1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/device1/startup-config

    admin1:
      binds:
        - configs/admin1/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    guest1:
      binds:
        - configs/guest1/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["device1:eth1", "admin1:eth1"]
    - endpoints: ["device1:eth2", "guest1:eth1"]
