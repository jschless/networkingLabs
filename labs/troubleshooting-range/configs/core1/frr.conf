frr version 8.4_git
frr defaults traditional
hostname core1
service integrated-vtysh-config
interface lo
 ip address 10.250.255.21/32
interface eth1
 ip address 10.250.0.0/31
interface eth2
 ip address 10.250.0.4/31
interface eth3
 ip address 10.250.0.8/31
interface eth4
 ip address 10.250.0.10/31
interface eth5
 ip address 10.250.40.1/24
router ospf
 ospf router-id 10.250.255.21
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 no passive-interface eth3
 no passive-interface eth4
 network 10.250.0.0/31 area 0
 network 10.250.0.4/31 area 0
 network 10.250.0.8/31 area 0
 network 10.250.0.10/31 area 0
 network 10.250.40.0/24 area 0
 network 10.250.255.21/32 area 0
end
