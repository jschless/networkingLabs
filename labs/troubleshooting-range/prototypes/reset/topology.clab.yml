name: tr-range-reset-prototype

mgmt:
  network: clab-tr-range-reset-prototype-mgmt
  ipv4-subnet: 172.30.250.0/24

topology:
  nodes:
    sw1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/sw1/startup-config

    r1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/r1/daemons:/etc/frr/daemons:ro
        - configs/r1/vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r1/frr.conf:/etc/frr/frr.conf.orig:ro
        - configs/r1/setup.sh:/setup.sh:ro
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh
        - sh -lc 'cp /etc/frr/frr.conf.orig /etc/frr/frr.conf && mkdir -p /opt/range/golden && cp /etc/frr/frr.conf /opt/range/golden/frr.conf && vtysh -b'

    host1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/host1/reset.sh:/opt/range/golden/reset.sh:ro
      exec:
        - sh /opt/range/golden/reset.sh

  links:
    - endpoints: ["sw1:eth1", "r1:eth1"]
    - endpoints: ["sw1:eth2", "host1:eth1"]
