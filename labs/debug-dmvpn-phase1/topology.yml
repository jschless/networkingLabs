name: debug-dmvpn-phase1

# Debug lab: spoke1's NHRP NHS address points to the hub's WAN IP (10.0.0.1)
# instead of the hub's tunnel IP (172.16.0.1). NHRP registration fails and
# spoke1 can't reach the DMVPN fabric.
#
# Topology (all nodes share br-wan at 10.0.0.0/24):
#   hub: WAN 10.0.0.1, tunnel 172.16.0.1
#   spoke1: WAN 10.0.0.11, tunnel 172.16.0.11  ← BUG: wrong NHS
#   spoke2: WAN 10.0.0.12, tunnel 172.16.0.12
#   spoke3: WAN 10.0.0.13, tunnel 172.16.0.13

topology:
  nodes:
    br-wan:
      kind: bridge

    hub:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/hub/frr.conf:/etc/frr/frr.conf
        - configs/hub/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    spoke1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke1/frr.conf:/etc/frr/frr.conf
        - configs/spoke1/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    spoke2:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke2/frr.conf:/etc/frr/frr.conf
        - configs/spoke2/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    spoke3:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke3/frr.conf:/etc/frr/frr.conf
        - configs/spoke3/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth0"]
    - endpoints: ["spoke1:eth1", "br-wan:eth1"]
    - endpoints: ["spoke2:eth1", "br-wan:eth2"]
    - endpoints: ["spoke3:eth1", "br-wan:eth3"]
