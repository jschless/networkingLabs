name: debug-dmvpn-phase1

# Native VyOS Guided Debug lab. The saved startup state contains one wrong
# spoke1 NHRP unicast-map leaf; every other data/control-plane leaf is healthy.

topology:
  nodes:
    br-wan:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/br-wan/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    hub:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/hub/config.boot

    spoke1:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke1/config.boot
      binds:
        - configs/set-map.sh:/opt/debug-dmvpn-phase1/set-map.sh:ro
        - configs/spoke-startup-normalize.sh:/opt/debug-dmvpn-phase1/spoke-startup-normalize.sh:ro
      exec:
        - su - admin -c '/bin/bash /opt/debug-dmvpn-phase1/spoke-startup-normalize.sh 10.0.0.254'

    spoke2:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke2/config.boot
      binds:
        - configs/set-map.sh:/opt/debug-dmvpn-phase1/set-map.sh:ro
        - configs/spoke-startup-normalize.sh:/opt/debug-dmvpn-phase1/spoke-startup-normalize.sh:ro
      exec:
        - su - admin -c '/bin/bash /opt/debug-dmvpn-phase1/spoke-startup-normalize.sh 10.0.0.1'

    spoke3:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke3/config.boot
      binds:
        - configs/set-map.sh:/opt/debug-dmvpn-phase1/set-map.sh:ro
        - configs/spoke-startup-normalize.sh:/opt/debug-dmvpn-phase1/spoke-startup-normalize.sh:ro
      exec:
        - su - admin -c '/bin/bash /opt/debug-dmvpn-phase1/spoke-startup-normalize.sh 10.0.0.1'

  links:
    - endpoints: ["hub:eth1", "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
