frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
 ip ospf passive
 ip ospf area 0
!
interface eth1
 description to r1
 ip address 10.1.12.2/30
 ip ospf area 1
!
interface eth2
 description to r3
 ip address 10.1.23.1/30
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.2
!
end
