frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
 ip ospf passive
 ip ospf area 1
!
interface eth1
 description to r2
 ip address 10.1.12.1/30
 ip ospf area 1
!
router ospf
 ospf router-id 10.0.0.1
!
end
