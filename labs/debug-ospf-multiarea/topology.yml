name: debug-ospf-multiarea

# Debug lab — multi-area OSPF with an intentional misconfiguration.
# Deploy, observe the symptoms, and diagnose the fault before looking at configs.
#
# Topology:
#
#   [r1] --Area 1-- [r2] --Area 0-- [r3] --Area 2 (stub)-- [r4]
#                   (ABR)            (ABR)
#
# r1: 10.0.0.1/32  Area 1 router
# r2: 10.0.0.2/32  ABR — Area 0 + Area 1
# r3: 10.0.0.3/32  ABR — Area 0 + Area 2
# r4: 10.0.0.4/32  Area 2 stub router

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.ipv4.ip_forward: "1"
    exec:
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

    r4:
      binds:
        - configs/r4/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30  Area 1
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30  Area 0
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30  Area 2
