name: debug-ospf-multiarea

topology:
  nodes:
    r1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r1/startup-config

    r2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r2/startup-config

    r3:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r3/startup-config

    r4:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r4/startup-config

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30  Area 1
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30  Area 0
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30  Area 2
