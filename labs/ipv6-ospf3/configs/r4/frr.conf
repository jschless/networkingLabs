frr version 8.5
frr defaults traditional
hostname r4
log syslog informational
ipv6 forwarding
service integrated-vtysh-config

interface lo
 ! IPv4 loopback — used as OSPFv3 router-id
 ip address 10.0.0.4/32
 ! IPv6 loopback — advertise into OSPFv3
 ipv6 address 2001:db8::4/128

interface eth1
 ! Link to r3: 2001:db8:34::/64
 ipv6 address 2001:db8:34::2/64

! -------------------------------------------------------
! YOUR TASK: Configure OSPFv3
!
! r4 is the far end of the chain — one transit link (eth1 to r3).
!
!   interface eth1
!    ipv6 ospf6 area 0
!   interface lo
!    ipv6 ospf6 area 0
!    ipv6 ospf6 passive
!
!   router ospf6
!    ospf6 router-id 10.0.0.4
!
! After full configuration, r4 should be able to ping r1's loopback:
!   ping6 2001:db8::1
! -------------------------------------------------------
