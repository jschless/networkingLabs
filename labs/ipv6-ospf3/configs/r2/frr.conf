frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
ipv6 forwarding
service integrated-vtysh-config

interface lo
 ! IPv4 loopback — used as OSPFv3 router-id
 ip address 10.0.0.2/32
 ! IPv6 loopback — advertise into OSPFv3
 ipv6 address 2001:db8::2/128

interface eth1
 ! Link to r1: 2001:db8:12::/64
 ipv6 address 2001:db8:12::2/64

interface eth2
 ! Link to r3: 2001:db8:23::/64
 ipv6 address 2001:db8:23::1/64

! -------------------------------------------------------
! YOUR TASK: Configure OSPFv3
!
! r2 has two transit links: eth1 (to r1) and eth2 (to r3).
! Enable OSPFv3 on all three interfaces (lo, eth1, eth2).
!
! On each interface:
!   interface eth1
!    ipv6 ospf6 area 0
!   interface eth2
!    ipv6 ospf6 area 0
!   interface lo
!    ipv6 ospf6 area 0
!    ipv6 ospf6 passive
!
! Then:
!   router ospf6
!    ospf6 router-id 10.0.0.2
! -------------------------------------------------------
