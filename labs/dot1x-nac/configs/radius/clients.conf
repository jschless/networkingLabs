# clients.conf — define NAS clients that can send RADIUS requests

# Default client entry (fallback - allow localhost for radtest)
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    shortname = localhost
}

# The authenticator (NAS) — eth5 address
client authenticator {
    ipaddr = 192.168.100.1
    secret = testing123
    shortname = authenticator
    nas_type = other
}
