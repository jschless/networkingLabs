# hostapd-eth3.conf — 802.1X authenticator on eth3 (supplicant-mab / MAB)
#
# MAB (MAC Authentication Bypass): when no EAP supplicant responds after
# auth_fail_timeout seconds, hostapd sends an Access-Request with the
# station's MAC address as both User-Name and User-Password.
driver=wired
interface=eth3
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

logger_stdout=-1
logger_stdout_level=2
logger_syslog=-1
logger_syslog_level=2

ieee8021x=1
eapol_version=2
eap_reauth_period=3600

# MAB is handled by mab-eth3.sh (hostapd's radius_mac_auth_bypass is not
# available in this build). hostapd still handles any 802.1X supplicants
# that happen to respond on this port.

auth_server_addr=192.168.100.2
auth_server_port=1812
auth_server_shared_secret=testing123

acct_server_addr=192.168.100.2
acct_server_port=1813
acct_server_shared_secret=testing123

own_ip_addr=192.168.100.1
nas_identifier=dot1x-nac-authenticator
