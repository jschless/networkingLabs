# hostapd-eth1.conf — 802.1X authenticator on eth1 (supplicant-tls / EAP-TLS)
driver=wired
interface=eth1
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# Logging (stdout)
logger_stdout=-1
logger_stdout_level=2
logger_syslog=-1
logger_syslog_level=2

# 802.1X settings
ieee8021x=1
eapol_version=2
eap_reauth_period=3600

# RADIUS authentication server
auth_server_addr=192.168.100.2
auth_server_port=1812
auth_server_shared_secret=testing123

# RADIUS accounting server
acct_server_addr=192.168.100.2
acct_server_port=1813
acct_server_shared_secret=testing123

# NAS IP — authenticator's IP on the RADIUS link
own_ip_addr=192.168.100.1
nas_identifier=dot1x-nac-authenticator
