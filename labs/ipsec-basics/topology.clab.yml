name: ipsec-basics

# IPsec site-to-site tunnel practice lab
#
# Topology:
#
#  [host-a] ---eth1--- [gw-a] ---eth2--- [internet] ---eth2--- [gw-b] ---eth2--- [host-b]
#
# IP addressing (pre-configured by setup.sh):
#
#   LAN A:   192.168.1.0/24
#     host-a eth1: 192.168.1.10   default route -> 192.168.1.1
#     gw-a   eth1: 192.168.1.1
#
#   WAN (simulated internet):
#     gw-a   eth2: 203.0.113.1/30
#     internet eth1: 203.0.113.2/30
#     internet eth2: 203.0.113.5/30
#     gw-b   eth1: 203.0.113.6/30
#
#   LAN B:   192.168.2.0/24
#     gw-b   eth2: 192.168.2.1
#     host-b eth1: 192.168.2.10   default route -> 192.168.2.1
#
# What you configure:
#   - Native VyOS IKEv2 site-to-site IPsec on gw-a and gw-b
#   - PSK auth, tunnel mode, LAN-to-LAN selectors
#   - Verify `show vpn ike sa` / `show vpn ipsec sa`
#   - Test with ping from host-a (192.168.1.10) to host-b (192.168.2.10)

topology:
  nodes:
    host-a:
      kind: linux
      image: ipsec-lab:local
      binds:
        - configs/host-a/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    gw-a:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/gw-a/config.boot

    internet:
      kind: linux
      image: ipsec-lab:local
      binds:
        - configs/internet/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    gw-b:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/gw-b/config.boot

    host-b:
      kind: linux
      image: ipsec-lab:local
      binds:
        - configs/host-b/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["host-a:eth1",   "gw-a:eth1"]      # 192.168.1.0/24
    - endpoints: ["gw-a:eth2",     "internet:eth1"]   # 203.0.113.0/30
    - endpoints: ["internet:eth2", "gw-b:eth1"]       # 203.0.113.4/30
    - endpoints: ["gw-b:eth2",     "host-b:eth1"]     # 192.168.2.0/24
