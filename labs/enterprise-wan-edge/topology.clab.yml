name: enterprise-wan-edge

# Enterprise Dual-Homed WAN Edge Lab — Arista cEOS + Linux
#
# Models a real enterprise edge: dual ISP uplinks with BGP policy for
# outbound path selection (local-preference) and inbound traffic engineering
# (AS-path prepend). OSPF redistributes the internet default into the core.
#
#                      [isp1]                 [isp2]
#                      AS65100                AS65200
#                   203.0.113.0/30         203.0.114.0/30
#                   LP-HIGH in (200)       LP-LOW in (100)
#                        |                      |
#                        +--------[edge]---------+
#                                AS65300
#                             198.51.100.0/24
#                           OSPF default-info out
#                           /              \
#              10.255.1.0/30              10.255.2.0/30
#                    |                          |
#                [core1]--------10.255.3.0/30--[core2]
#                    |
#              10.100.0.0/30
#                    |
#                 [server]
#                Linux host
#
# Loopbacks:
#   isp1  = 1.1.1.1/32
#   isp2  = 2.2.2.2/32
#   edge  = 10.0.0.1/32
#   core1 = 10.0.0.2/32
#   core2 = 10.0.0.3/32

topology:
  nodes:
    isp1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp1/startup-config

    isp2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp2/startup-config

    edge:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/edge/startup-config

    core1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/core1/startup-config

    core2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/core2/startup-config

    server:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/server/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["isp1:eth1",  "edge:eth1"]    # 203.0.113.0/30  WAN primary
    - endpoints: ["isp2:eth1",  "edge:eth2"]    # 203.0.114.0/30  WAN backup
    - endpoints: ["edge:eth3",  "core1:eth1"]   # 10.255.1.0/30   core uplink 1
    - endpoints: ["edge:eth4",  "core2:eth1"]   # 10.255.2.0/30   core uplink 2
    - endpoints: ["core1:eth2", "core2:eth2"]   # 10.255.3.0/30   core interconnect
    - endpoints: ["core1:eth3", "server:eth1"]  # 10.100.0.0/30   server subnet
