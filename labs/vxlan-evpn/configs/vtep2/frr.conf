frr version 8.5
frr defaults traditional
hostname vtep2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

interface lo
 ip address 10.0.0.2/32

interface eth1
 ! Underlay link to spine — 10.1.2.0/30 (vtep2=.1  spine=.2)
 ip address 10.1.2.1/30
 ip ospf area 0

! eth2 is bridged to br100 by setup.sh — no IP configured here

router ospf
 ospf router-id 10.0.0.2
 passive-interface lo

! BGP EVPN: iBGP to spine RR, advertise all local VNIs
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 neighbor 10.0.0.100 remote-as 65000
 neighbor 10.0.0.100 update-source lo
 !
 address-family l2vpn evpn
  neighbor 10.0.0.100 activate
  advertise-all-vni
 exit-address-family
