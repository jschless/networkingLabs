name: mpls-ldp

# LDP-based MPLS practice lab
#
# Four FRR routers in a line. IP addressing is pre-configured; you build
# the OSPF underlay and then label the core with LDP — the protocol that
# still runs most brownfield MPLS networks. Contrast lab: mpls-sr-blank
# distributes labels via IS-IS Segment Routing instead.
#
#   [r1]──────[r2]──────[r3]──────[r4]
#   LER        LSR        LSR        LER
#   10.0.0.1   10.0.0.2   10.0.0.3   10.0.0.4
#
# Suggested order:
#   1. OSPF underlay   -> every loopback reachable
#   2. MPLS + LDP      -> sessions OPERATIONAL, labels bound
#   3. Read the tables -> bindings vs installed labels, PHP
#   4. Break it        -> kill a session without touching LDP config

topology:
  defaults:
    kind: linux
    image: frr-lab:local
    binds:
      # All nodes share the same daemons and vtysh.conf
      - configs/daemons:/etc/frr/daemons
      - configs/vtysh.conf:/etc/frr/vtysh.conf
    sysctls:
      net.mpls.platform_labels: "1048575"
      net.ipv4.ip_forward: "1"
    exec:
      # Re-apply config after containerlab creates all veth pairs
      - vtysh -b

  nodes:
    r1:
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf

    r2:
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf

    r3:
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf

    r4:
      binds:
        - configs/r4/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30
