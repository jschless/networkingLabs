frr version 8.4
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r3  (LSR — transit label switching router)
! Role:  OSPF underlay + LDP — configured by you
!
! Loopback:          10.0.0.3/32
! LDP router-id:     10.0.0.3
! Transport address: 10.0.0.3  (the loopback)
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 description to r2
 ip address 10.1.23.2/30
!
interface eth2
 description to r4
 ip address 10.1.34.1/30
!
end
