frr version 8.4
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r1  (LER — ingress/egress label edge router)
! Role:  OSPF underlay + LDP — configured by you
!
! Loopback:          10.0.0.1/32
! LDP router-id:     10.0.0.1
! Transport address: 10.0.0.1  (the loopback)
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to r2
 ip address 10.1.12.1/30
!
end
