frr version 8.4
frr defaults traditional
hostname r4
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! -------------------------------------------------------
! Node: r4  (LER — ingress/egress label edge router)
! Role:  OSPF underlay + LDP — configured by you
!
! Loopback:          10.0.0.4/32
! LDP router-id:     10.0.0.4
! Transport address: 10.0.0.4  (the loopback)
! -------------------------------------------------------
!
interface lo
 ip address 10.0.0.4/32
!
interface eth1
 description to r3
 ip address 10.1.34.2/30
!
end
