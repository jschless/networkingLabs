frr version 8.5
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! r2 — AS65001 ASBR (AS Boundary Router)
! eth1 = iBGP-LU link to r1:eth1 (10.1.12.0/30) — AS65001
! eth2 = eBGP-LU link to r3:eth1 (10.1.23.0/30) — inter-AS boundary
! IGP: OSPF within AS65001 (r1 <-> r2)

interface lo
 ip address 10.0.0.2/32

interface eth1
 ! iBGP-LU link to r1 (AS65001)
 ip address 10.1.12.2/30
 mpls enable
 ip ospf area 0

interface eth2
 ! eBGP-LU link to r3 (AS65002)
 ip address 10.1.23.1/30
 mpls enable

router ospf
 ospf router-id 10.0.0.2
 passive-interface lo

! TODO: Configure BGP-LU sessions:
! 1. iBGP-LU with r1 (10.1.12.1, same AS65001)
! 2. eBGP-LU with r3 (10.1.23.2, AS65002) — inter-AS label exchange
!
! router bgp 65001
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.2
!  neighbor 10.1.12.1 remote-as 65001
!  neighbor 10.1.23.2 remote-as 65002
!  !
!  address-family ipv4 labeled-unicast
!   neighbor 10.1.12.1 activate
!   neighbor 10.1.23.2 activate
!   network 10.0.0.2/32
