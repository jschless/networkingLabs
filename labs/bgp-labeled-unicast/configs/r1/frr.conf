frr version 8.5
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! r1 — AS65001 edge (PE-like role)
! eth1 = iBGP-LU link to r2:eth1 (10.1.12.0/30)
! r1 advertises its loopback 10.0.0.1/32 with an MPLS label via BGP-LU
! IGP: OSPF within AS65001 (r1 <-> r2)

interface lo
 ip address 10.0.0.1/32

interface eth1
 ! iBGP-LU link to r2 (AS65001)
 ip address 10.1.12.1/30
 ! MPLS must be enabled on this interface for labeled packets
 mpls enable
 ! IGP for loopback reachability within AS
 ip ospf area 0

router ospf
 ospf router-id 10.0.0.1
 passive-interface lo

! TODO: Configure BGP-LU (BGP Labeled Unicast) session with r2
! Use address-family ipv4 labeled-unicast to exchange labels
!
! router bgp 65001
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.1
!  neighbor 10.1.12.2 remote-as 65001
!  !
!  address-family ipv4 labeled-unicast
!   neighbor 10.1.12.2 activate
!   network 10.0.0.1/32
