frr version 8.5
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! r3 — AS65002 ASBR (AS Boundary Router)
! eth1 = eBGP-LU link to r2:eth2 (10.1.23.0/30) — inter-AS boundary
! eth2 = iBGP-LU link to r4:eth1 (10.1.34.0/30) — AS65002
! IGP: OSPF within AS65002 (r3 <-> r4)

interface lo
 ip address 10.0.0.3/32

interface eth1
 ! eBGP-LU link to r2 (AS65001)
 ip address 10.1.23.2/30
 mpls enable

interface eth2
 ! iBGP-LU link to r4 (AS65002)
 ip address 10.1.34.1/30
 mpls enable
 ip ospf area 0

router ospf
 ospf router-id 10.0.0.3
 passive-interface lo

! TODO: Configure BGP-LU sessions:
! 1. eBGP-LU with r2 (10.1.23.1, AS65001) — inter-AS label exchange
! 2. iBGP-LU with r4 (10.1.34.2, same AS65002)
!
! router bgp 65002
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.3
!  neighbor 10.1.23.1 remote-as 65001
!  neighbor 10.1.34.2 remote-as 65002
!  !
!  address-family ipv4 labeled-unicast
!   neighbor 10.1.23.1 activate
!   neighbor 10.1.34.2 activate
!   network 10.0.0.3/32
