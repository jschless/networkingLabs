frr version 8.5
frr defaults traditional
hostname r4
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! r4 — AS65002 edge (PE-like role)
! eth1 = iBGP-LU link to r3:eth2 (10.1.34.0/30)
! IGP: OSPF within AS65002 (r3 <-> r4)

interface lo
 ip address 10.0.0.4/32

interface eth1
 ! iBGP-LU link to r3 (AS65002)
 ip address 10.1.34.2/30
 mpls enable
 ip ospf area 0

router ospf
 ospf router-id 10.0.0.4
 passive-interface lo

! TODO: Configure BGP-LU session with r3
