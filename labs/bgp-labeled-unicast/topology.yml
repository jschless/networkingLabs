name: bgp-labeled-unicast

topology:
  nodes:
    r1:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r1/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - bash -c 'sysctl -w net.mpls.conf.eth1.input=1 || true'
        - vtysh -b

    r2:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r2/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - bash -c 'sysctl -w net.mpls.conf.eth1.input=1 net.mpls.conf.eth2.input=1 || true'
        - vtysh -b

    r3:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r3/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - bash -c 'sysctl -w net.mpls.conf.eth1.input=1 net.mpls.conf.eth2.input=1 || true'
        - vtysh -b

    r4:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/r4/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - bash -c 'sysctl -w net.mpls.conf.eth1.input=1 || true'
        - vtysh -b

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r4:eth1"]
