name: bgp-labeled-unicast

# BGP Labeled Unicast (RFC 3107) practice lab
#
# Demonstrates inter-AS MPLS label distribution using BGP-LU,
# enabling MPLS LSPs that span AS boundaries without LDP.
#
# Topology:
#   [r1]─iBGP-LU─[r2]─eBGP-LU─[r3]─iBGP-LU─[r4]
#    AS65001       AS65001│AS65002       AS65002
#          OSPF       inter-AS      OSPF
#
# Pre-configured: IP addressing, OSPF (IGP within each AS), MPLS on interfaces.
# Task: configure BGP-LU (address-family ipv4 labeled-unicast) on all nodes.

topology:
  defaults:
    kind: ceos
    image: ceos:4.35.2F

  nodes:
    r1:
      startup-config: configs/r1/startup-config
    r2:
      startup-config: configs/r2/startup-config
    r3:
      startup-config: configs/r3/startup-config
    r4:
      startup-config: configs/r4/startup-config

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30  AS65001 internal
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.1.23.0/30  inter-AS ASBR link
    - endpoints: ["r3:eth2", "r4:eth1"]   # 10.1.34.0/30  AS65002 internal
