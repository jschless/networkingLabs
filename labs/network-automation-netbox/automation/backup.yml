- name: Backup running config
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: /workspace/backups
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Collect running config
      arista.eos.eos_command:
        commands:
          - show running-config
      register: running

    - name: Save backup
      ansible.builtin.copy:
        dest: "/workspace/backups/{{ inventory_hostname }}.cfg"
        content: "{{ running.stdout[0] }}"
      delegate_to: localhost
