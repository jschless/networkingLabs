site:
  name: lab
  slug: lab

tenant:
  name: internal-lab
  slug: internal-lab

manufacturer:
  name: Arista
  slug: arista

platform:
  name: arista-eos
  slug: arista-eos

device_type:
  model: cEOS-Lab
  slug: ceos-lab
  u_height: 1
  is_full_depth: false

racks:
  - name: rack-a
    site: lab
  - name: rack-b
    site: lab

roles:
  - name: spine
    slug: spine
    color: "2196f3"
  - name: leaf
    slug: leaf
    color: "4caf50"

tags:
  - automation
  - lab
  - fabric
  - managed

config_template:
  name: eos-fabric-base
  description: Native NetBox config template for the lab fabric
  file: eos_device_config.j2

config_contexts:
  - name: lab-automation-defaults
    description: Global automation defaults rendered into EOS configs
    weight: 1000
    scopes:
      sites:
        - lab
    data:
      automation:
        admin_username: admin
        admin_secret: admin
        name_servers:
          - 1.1.1.1
        ntp_servers:
          - time.google.com
      bgp:
        maximum_paths: 2

vrfs:
  - name: BLUE
    rd: "65111:10"
  - name: GREEN
    rd: "65112:20"

vlan_group:
  name: campus
  slug: campus

vlans:
  - vid: 10
    name: USERS
  - vid: 20
    name: SERVERS

prefixes:
  - prefix: 172.31.40.0/24
    description: management subnet
  - prefix: 10.255.0.0/24
    description: loopback pool
  - prefix: 10.0.0.0/31
    description: spine1-leaf1
  - prefix: 10.0.0.2/31
    description: spine1-leaf2
  - prefix: 10.0.0.4/31
    description: spine2-leaf1
  - prefix: 10.0.0.6/31
    description: spine2-leaf2
  - prefix: 10.10.10.0/24
    description: BLUE users
    vrf: BLUE
  - prefix: 10.20.20.0/24
    description: GREEN servers
    vrf: GREEN

devices:
  - name: spine1
    role: spine
    rack: rack-a
    position: 1
    asn: 65100
    mgmt_ip: 172.31.40.11/24
    loopback: 10.255.0.11/32
    interfaces:
      - name: Ethernet1
        address: 10.0.0.0/31
      - name: Ethernet2
        address: 10.0.0.2/31
  - name: spine2
    role: spine
    rack: rack-a
    position: 2
    asn: 65101
    mgmt_ip: 172.31.40.12/24
    loopback: 10.255.0.12/32
    interfaces:
      - name: Ethernet1
        address: 10.0.0.4/31
      - name: Ethernet2
        address: 10.0.0.6/31
  - name: leaf1
    role: leaf
    rack: rack-b
    position: 1
    asn: 65111
    mgmt_ip: 172.31.40.13/24
    loopback: 10.255.0.13/32
    interfaces:
      - name: Ethernet1
        address: 10.0.0.1/31
      - name: Ethernet2
        address: 10.0.0.5/31
      - name: Ethernet3
        mode: access
        vlan: 10
      - name: Ethernet4
        mode: access
        vlan: 20
      - name: Vlan10
        address: 10.10.10.1/24
        vrf: BLUE
      - name: Vlan20
        address: 10.20.20.1/24
        vrf: GREEN
  - name: leaf2
    role: leaf
    rack: rack-b
    position: 2
    asn: 65112
    mgmt_ip: 172.31.40.14/24
    loopback: 10.255.0.14/32
    interfaces:
      - name: Ethernet1
        address: 10.0.0.3/31
      - name: Ethernet2
        address: 10.0.0.7/31
      - name: Ethernet3
        mode: access
        vlan: 10
      - name: Ethernet4
        mode: access
        vlan: 20
      - name: Vlan10
        address: 10.10.10.2/24
        vrf: BLUE
      - name: Vlan20
        address: 10.20.20.2/24
        vrf: GREEN

cables:
  - a_device: spine1
    a_interface: Ethernet1
    b_device: leaf1
    b_interface: Ethernet1
  - a_device: spine1
    a_interface: Ethernet2
    b_device: leaf2
    b_interface: Ethernet1
  - a_device: spine2
    a_interface: Ethernet1
    b_device: leaf1
    b_interface: Ethernet2
  - a_device: spine2
    a_interface: Ethernet2
    b_device: leaf2
    b_interface: Ethernet2
