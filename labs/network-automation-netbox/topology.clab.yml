name: network-automation-netbox

mgmt:
  network: netbox-lab-mgmt
  ipv4-subnet: 172.31.40.0/24

topology:
  nodes:
    spine1:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.40.11
      startup-config: configs/spine1/startup-config

    spine2:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.40.12
      startup-config: configs/spine2/startup-config

    leaf1:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.40.13
      startup-config: configs/leaf1/startup-config

    leaf2:
      kind: ceos
      image: ceos:4.35.2F
      mgmt-ipv4: 172.31.40.14
      startup-config: configs/leaf2/startup-config

    postgres:
      kind: linux
      image: postgres:15@sha256:f30e3de0ac9cc938dac627ef2231099867c694b5f949fadb924c8c977428c399
      mgmt-ipv4: 172.31.40.21
      env:
        POSTGRES_DB: netbox
        POSTGRES_USER: netbox
        POSTGRES_PASSWORD: netbox

    redis:
      kind: linux
      image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
      mgmt-ipv4: 172.31.40.22

    netbox:
      kind: linux
      image: netboxcommunity/netbox:v4.1.11@sha256:d1260201d775b3f1d0b19e425bd19facc1e907e7153a8247d04d996037969e53
      mgmt-ipv4: 172.31.40.23
      ports:
        - 127.0.0.1:8001:8080
      env:
        DB_HOST: 172.31.40.21
        DB_NAME: netbox
        DB_USER: netbox
        DB_PASSWORD: netbox
        REDIS_HOST: 172.31.40.22
        REDIS_CACHE_HOST: 172.31.40.22
        SECRET_KEY: netboxsecretkey1234567890abcdefghijklmnopqrstuvwxyzAB
        SUPERUSER_NAME: admin
        SUPERUSER_EMAIL: admin@example.com
        SUPERUSER_PASSWORD: admin

    automation:
      kind: linux
      image: netbox-automation:local
      mgmt-ipv4: 172.31.40.24
      binds:
        - automation:/workspace
      cmd: sleep infinity

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
