name: debug-ospf-bgp-redist

topology:
  nodes:
    asbr:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/asbr/startup-config

    bgp1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/bgp1/startup-config

    bgp2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/bgp2/startup-config

    r1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/r1/startup-config

  links:
    - endpoints: ["r1:eth1",   "asbr:eth1"]   # 10.0.12.0/30  OSPF area 0
    - endpoints: ["asbr:eth2", "bgp1:eth1"]   # 10.0.23.0/30  eBGP
    - endpoints: ["bgp1:eth2", "bgp2:eth1"]   # 10.0.34.0/30  iBGP
