frr version 8.4_git
frr defaults traditional
hostname spoke2
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.12/32
!
interface eth1
 description WAN NBMA network
 ip address 10.0.0.12/24
!
interface tun0
 description GRE tunnel to hub — YOUR TASK: add NHRP and OSPF below
!
! ── Step 1: Configure NHRP on tun0 ─────────────────────────────────────────
!  ip nhrp network-id 1
!  ip nhrp holdtime 300
!  ip nhrp nhs 172.16.0.1 nbma 10.0.0.1 multicast
!  ip nhrp registration no-unique
!
! ── Step 2: Enable OSPF on tun0 ─────────────────────────────────────────────
!  ip ospf network point-to-multipoint
!  ip ospf area 0.0.0.0
!
! ── Step 3: Configure the OSPF process ──────────────────────────────────────
! router ospf
!  ospf router-id 10.0.0.12
!  passive-interface lo
!  passive-interface eth1
!  network 192.168.2.0/24 area 0
!
