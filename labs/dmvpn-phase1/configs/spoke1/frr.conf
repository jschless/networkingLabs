frr version 8.4_git
frr defaults traditional
hostname spoke1
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.11/32
!
interface eth1
 description WAN NBMA network
 ip address 10.0.0.11/24
!
interface tun0
 description GRE tunnel to hub — YOUR TASK: add NHRP and OSPF below
!
! ── Step 1: Configure NHRP on tun0 ─────────────────────────────────────────
!
!  ip nhrp network-id 1
!    Must match hub's network-id (both are domain 1).
!
!  ip nhrp holdtime 300
!    How long hub keeps this spoke's NHRP entry (seconds).
!
!  ip nhrp nhs 172.16.0.1 nbma 10.0.0.1 multicast
!    Register with hub: NHS tunnel IP = 172.16.0.1, hub NBMA (WAN) IP = 10.0.0.1.
!    "multicast" forwards OSPF multicast hellos to hub's NBMA address.
!
!  ip nhrp registration no-unique
!    Allow re-registration from the same NBMA address (needed in labs).
!
! ── Step 2: Enable OSPF on tun0 ─────────────────────────────────────────────
!
!  ip ospf network point-to-multipoint
!    Must match hub. p2mp = hub is NH for all spokes; no DR/BDR election.
!
!  ip ospf area 0.0.0.0
!
! ── Step 3: Configure the OSPF process ──────────────────────────────────────
!
! router ospf
!  ospf router-id 10.0.0.11
!  passive-interface lo
!  passive-interface eth1
!  network 192.168.1.0/24 area 0
!    Advertise the simulated LAN into OSPF.
!
! ── Verification ─────────────────────────────────────────────────────────────
!
!  show ip nhrp              ← should show hub mapping after registration
!  show ip ospf neighbor     ← hub should appear as Full
!  ping 172.16.0.1           ← hub tunnel IP
!  ping 192.168.2.1          ← spoke2 LAN (after spoke2 is configured)
!
