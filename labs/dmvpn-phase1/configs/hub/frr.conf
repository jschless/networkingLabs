frr version 8.5
frr defaults traditional
hostname hub
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
!
! eth1 WAN IP is set by setup.sh (ip addr add 10.0.0.1/24 dev eth1)
interface eth1
 description WAN — NBMA network (10.0.0.0/24)
!
! dmvpn0 is created by setup.sh as a multipoint GRE tunnel
! IP 172.16.0.1/24 is also set by setup.sh
interface dmvpn0
 description DMVPN mGRE tunnel interface
 ! --- Configure NHRP here ---
 ! nhrp network-id 1
 ! nhrp holdtime 300
 ! nhrp redirect
 !
 ! --- Configure OSPF here ---
 ! ip ospf network point-to-multipoint
 ! ip ospf area 0
!
! --- Configure OSPF here ---
! router ospf
!  ospf router-id 10.0.0.1
!  passive-interface lo
!  network 172.16.0.0/24 area 0
!  network 10.0.0.1/32 area 0
!
end
