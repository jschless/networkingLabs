frr version 8.5
frr defaults traditional
hostname spoke3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.13/32
 ip address 192.168.3.1/24
!
! eth1 WAN IP is set by setup.sh (ip addr add 10.0.0.13/24 dev eth1)
interface eth1
 description WAN — NBMA network (10.0.0.0/24)
!
! dmvpn0 is created by setup.sh as a GRE tunnel to hub (remote 10.0.0.1)
! IP 172.16.0.13/24 is also set by setup.sh
interface dmvpn0
 description DMVPN GRE tunnel to hub
 ! --- Configure NHRP here ---
 ! ip nhrp network-id 1
 ! ip nhrp holdtime 300
 ! ip nhrp nhs 172.16.0.1 nbma 10.0.0.1 multicast
 ! ip nhrp map 172.16.0.1 10.0.0.1
 ! ip nhrp registration no-unique
 !
 ! --- Configure OSPF here ---
 ! ip ospf network point-to-point
 ! ip ospf area 0
!
! --- Configure OSPF here ---
! router ospf
!  ospf router-id 10.0.0.13
!  passive-interface lo
!  network 172.16.0.0/24 area 0
!  network 10.0.0.13/32 area 0
!  network 192.168.3.0/24 area 0
!
end
