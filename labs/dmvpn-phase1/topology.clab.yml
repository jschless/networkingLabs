name: dmvpn-phase1

# DMVPN Phase 1 — Hub-and-Spoke VPN using mGRE + NHRP  (Linux/FRR)
#
# Topology:
#
#   [spoke1] (10.0.0.11) --\
#   [spoke2] (10.0.0.12) ---[hub] (10.0.0.1)    WAN: 10.0.0.0/24 (br-wan bridge)
#   [spoke3] (10.0.0.13) --/
#
# WAN IPs (on eth1):
#   hub:    10.0.0.1/24      tun0 IP: 172.16.0.1/24   (mGRE, no fixed remote)
#   spoke1: 10.0.0.11/24     tun0 IP: 172.16.0.11/24  (GRE, remote=hub)
#   spoke2: 10.0.0.12/24     tun0 IP: 172.16.0.12/24
#   spoke3: 10.0.0.13/24     tun0 IP: 172.16.0.13/24
#
# Simulated LANs (on lo):
#   spoke1: 192.168.1.1/24
#   spoke2: 192.168.2.1/24
#   spoke3: 192.168.3.1/24
#
# Pre-configured:
#   hub: tun0 (mGRE), NHRP server (nhrpd), OSPF point-to-multipoint
# Your task:
#   1. Configure NHRP on each spoke (ip nhrp nhs, ip nhrp registration)
#   2. Configure OSPF on each spoke (point-to-multipoint on tun0, router ospf)
#   3. Verify: show ip nhrp, show ip ospf neighbor, ping across tunnel
#
# Access:
#   ./scripts/lab.sh cli dmvpn-phase1 hub       # vtysh
#   ./scripts/lab.sh cli dmvpn-phase1 spoke1    # vtysh

topology:
  defaults:
    kind: linux
    image: frr-lab:local

  nodes:
    br-wan:
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0

    hub:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/hub/frr.conf:/etc/frr/frr.conf
        - configs/hub/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    spoke1:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke1/frr.conf:/etc/frr/frr.conf
        - configs/spoke1/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    spoke2:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke2/frr.conf:/etc/frr/frr.conf
        - configs/spoke2/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

    spoke3:
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke3/frr.conf:/etc/frr/frr.conf
        - configs/spoke3/setup.sh:/setup.sh
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
