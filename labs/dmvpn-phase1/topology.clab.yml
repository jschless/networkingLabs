name: dmvpn-phase1

# DMVPN Phase 1 — Hub-and-Spoke VPN using mGRE + NHRP  (VyOS)
#
# Topology:
#
#   [spoke1] (10.0.0.11) --\
#   [spoke2] (10.0.0.12) ---[br-wan]--- [hub] (10.0.0.1)   WAN: 10.0.0.0/24
#   [spoke3] (10.0.0.13) --/
#
# WAN IPs (eth1):    hub: 10.0.0.1     spokes: 10.0.0.11-13
# Tunnel IPs (tun0): hub: 172.16.0.1   spokes: 172.16.0.11-13/24
# Simulated LANs (lo): spoke1: 192.168.1.1/24  spoke2: 192.168.2.1/24  spoke3: 192.168.3.1/24
#
# Pre-configured:  hub (mGRE tunnel, NHRP NHS, OSPF p2mp)
# Your task:       configure NHRP + OSPF on each spoke in VyOS configure mode
#
# Access:
#   ./scripts/lab.sh cli dmvpn-phase1 hub
#   ./scripts/lab.sh cli dmvpn-phase1 spoke1

topology:
  nodes:
    br-wan:
      kind: linux
      image: quay.io/frrouting/frr:8.4.2
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0

    hub:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/hub/config.boot

    spoke1:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke1/config.boot

    spoke2:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke2/config.boot

    spoke3:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke3/config.boot

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
