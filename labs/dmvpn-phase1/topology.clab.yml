name: dmvpn-phase1

# Native VyOS DMVPN Phase 1 Build lab. The hub control plane and every mGRE
# interface are scaffolded; learners build NHRP and OSPF on all three spokes.

topology:
  nodes:
    br-wan:
      kind: linux
      image: ops-lab:local
      binds:
        - configs/br-wan/setup.sh:/setup.sh:ro
      exec:
        - bash /setup.sh

    hub:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/hub/config.boot

    spoke1:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke1/config.boot
      binds:
        - configs/spoke1/apply-solution.sh:/opt/dmvpn-phase1/apply-solution.sh:ro
        - configs/spoke1/inject-fault.sh:/opt/dmvpn-phase1/inject-fault.sh:ro
        - configs/spoke1/restore-multicast.sh:/opt/dmvpn-phase1/restore-multicast.sh:ro

    spoke2:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke2/config.boot
      binds:
        - configs/spoke2/apply-solution.sh:/opt/dmvpn-phase1/apply-solution.sh:ro

    spoke3:
      kind: vyosnetworks_vyos
      image: vyos:local
      startup-config: configs/spoke3/config.boot
      binds:
        - configs/spoke3/apply-solution.sh:/opt/dmvpn-phase1/apply-solution.sh:ro

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth1"]
    - endpoints: ["spoke1:eth1", "br-wan:eth2"]
    - endpoints: ["spoke2:eth1", "br-wan:eth3"]
    - endpoints: ["spoke3:eth1", "br-wan:eth4"]
