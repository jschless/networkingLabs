name: dmvpn-phase1

# DMVPN Phase 1 — Hub-and-Spoke VPN using mGRE + NHRP
#
# Topology:
#
#   [spoke1] (10.0.0.11) --\
#   [spoke2] (10.0.0.12) ---[hub] (10.0.0.1)    WAN: 10.0.0.0/24 (br-wan bridge)
#   [spoke3] (10.0.0.13) --/
#
# WAN IPs (on eth1, set by setup.sh):
#   hub:    10.0.0.1/24
#   spoke1: 10.0.0.11/24
#   spoke2: 10.0.0.12/24
#   spoke3: 10.0.0.13/24
#
# DMVPN tunnel (dmvpn0, created by setup.sh):
#   hub:    172.16.0.1/24   (mGRE, no remote — multipoint)
#   spoke1: 172.16.0.11/24  (GRE, remote 10.0.0.1)
#   spoke2: 172.16.0.12/24  (GRE, remote 10.0.0.1)
#   spoke3: 172.16.0.13/24  (GRE, remote 10.0.0.1)
#
# Loopbacks (simulated LAN behind each spoke):
#   spoke1: 192.168.1.1/24
#   spoke2: 192.168.2.1/24
#   spoke3: 192.168.3.1/24
#
# What you configure:
#   1. NHRP on hub and spokes (interface dmvpn0 in vtysh)
#   2. OSPF over DMVPN (point-to-multipoint on hub, point-to-point on spokes)
#   3. Verify: show ip nhrp, show ip ospf neighbor, ping across tunnel

topology:
  nodes:
    br-wan:
      kind: bridge

    hub:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/hub/frr.conf:/etc/frr/frr.conf
        - configs/hub/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    spoke1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke1/frr.conf:/etc/frr/frr.conf
        - configs/spoke1/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    spoke2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke2/frr.conf:/etc/frr/frr.conf
        - configs/spoke2/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

    spoke3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spoke3/frr.conf:/etc/frr/frr.conf
        - configs/spoke3/setup.sh:/setup.sh
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - bash /setup.sh

  links:
    - endpoints: ["hub:eth1",    "br-wan:eth0"]
    - endpoints: ["spoke1:eth1", "br-wan:eth1"]
    - endpoints: ["spoke2:eth1", "br-wan:eth2"]
    - endpoints: ["spoke3:eth1", "br-wan:eth3"]
