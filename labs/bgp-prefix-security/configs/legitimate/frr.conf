frr version 8.5
frr defaults traditional
hostname legitimate
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! legitimate (AS65001)
! Owns the prefix 192.0.2.0/24 — this is the "customer prefix" to be hijacked
! eth1 = eBGP link to isp:eth1

interface lo
 ! Router loopback
 ip address 10.0.0.1/32
 ! Owned customer prefix (second loopback address — will be advertised via BGP)
 ip address 192.0.2.1/24

interface eth1
 ! eBGP link to isp (AS65100)
 ip address 10.1.11.1/30

! TODO: Configure eBGP session with isp (10.1.11.2, AS65100)
! Advertise loopback 10.0.0.1/32 and customer prefix 192.0.2.0/24
!
! router bgp 65001
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.1
!  neighbor 10.1.11.2 remote-as 65100
!  address-family ipv4 unicast
!   neighbor 10.1.11.2 activate
!   network 10.0.0.1/32
!   network 192.0.2.0/24
