frr version 8.5
frr defaults traditional
hostname isp
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! isp (AS65100) — transit provider, hub node
! eth1 = eBGP link to legitimate:eth1  (10.1.11.0/30)
! eth2 = eBGP link to hijacker:eth1    (10.1.12.0/30)
! eth3 = eBGP link to victim:eth1      (10.1.13.0/30)

interface lo
 ip address 10.0.0.2/32

interface eth1
 ! Link to legitimate (AS65001)
 ip address 10.1.11.2/30

interface eth2
 ! Link to hijacker (AS65002)
 ip address 10.1.12.1/30

interface eth3
 ! Link to victim (AS65003)
 ip address 10.1.13.1/30

! TODO: Configure eBGP sessions with all three peers
! After establishing sessions, observe the hijack in Task 2, then apply fixes.
!
! router bgp 65100
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.2
!  neighbor 10.1.11.1 remote-as 65001
!  neighbor 10.1.12.2 remote-as 65002
!  neighbor 10.1.13.2 remote-as 65003
!  address-family ipv4 unicast
!   neighbor 10.1.11.1 activate
!   neighbor 10.1.12.2 activate
!   neighbor 10.1.13.2 activate
!   network 10.0.0.2/32
!
! --- Fix 1: max-prefix limit on hijacker session ---
!   neighbor 10.1.12.2 maximum-prefix 5
!
! --- Fix 2: prefix-list to block hijacked prefix from hijacker ---
!   ip prefix-list HIJACKER-IN seq 5 deny 192.0.2.0/24 le 32
!   ip prefix-list HIJACKER-IN seq 10 permit 0.0.0.0/0 le 32
!   neighbor 10.1.12.2 prefix-list HIJACKER-IN in
