frr version 8.5
frr defaults traditional
hostname hijacker
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! hijacker (AS65002)
! Will fraudulently advertise 192.0.2.0/24 (owned by AS65001)
! or a more-specific 192.0.2.0/25 to steal traffic
! eth1 = eBGP link to isp:eth2

interface lo
 ip address 10.0.0.3/32
 ! Fraudulent prefix — not legitimately owned by this AS
 ! (added for the hijack exercise — user will advertise this via BGP)
 ip address 192.0.2.128/25

interface eth1
 ! eBGP link to isp (AS65100)
 ip address 10.1.12.2/30

! TODO: Configure eBGP session with isp (10.1.12.1, AS65100)
! TASK 2: Advertise 192.0.2.0/24 to simulate a hijack
! TASK 2b: Advertise more-specific 192.0.2.128/25 to demonstrate longest-match wins
!
! router bgp 65002
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.3
!  neighbor 10.1.12.1 remote-as 65100
!  address-family ipv4 unicast
!   neighbor 10.1.12.1 activate
!   network 10.0.0.3/32
!   network 192.0.2.0/24         ! hijack — same prefix as legitimate
!   network 192.0.2.128/25       ! more-specific hijack — always wins
