frr version 8.5
frr defaults traditional
hostname victim
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config

! victim (AS65003)
! Receives routes from isp — will observe the hijacked prefix
! eth1 = eBGP link to isp:eth3

interface lo
 ip address 10.0.0.4/32

interface eth1
 ! eBGP link to isp (AS65100)
 ip address 10.1.13.2/30

! TODO: Configure eBGP session with isp (10.1.13.1, AS65100)
! After setup, use "show bgp ipv4 unicast 192.0.2.0/24" to see which path
! the victim is using — legitimate's or hijacker's.
!
! router bgp 65003
!  no bgp ebgp-requires-policy
!  bgp router-id 10.0.0.4
!  neighbor 10.1.13.1 remote-as 65100
!  address-family ipv4 unicast
!   neighbor 10.1.13.1 activate
!   network 10.0.0.4/32
