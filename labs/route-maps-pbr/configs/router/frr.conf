frr version 8.5
frr defaults traditional
hostname router
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 ! Link to host-a: 192.168.1.0/30, router=.2
 ! PBR will be applied inbound here: host-a traffic -> isp1
 ip address 192.168.1.2/30
!
interface eth2
 ! Link to host-b: 192.168.2.0/30, router=.2
 ! PBR will be applied inbound here: host-b traffic -> isp2
 ip address 192.168.2.2/30
!
interface eth3
 ! Link to isp1: 10.0.1.0/30, router=.1
 ip address 10.0.1.1/30
!
interface eth4
 ! Link to isp2: 10.0.2.0/30, router=.1
 ip address 10.0.2.1/30
!
! TODO: Step 1 - Default static route via isp1 (normal routing baseline)
!   ip route 0.0.0.0/0 10.0.1.2
!
! TODO: Step 2 - PBR configuration
!
!   ip access-list extended HOST-A
!    permit ip 192.168.1.0/30 any
!   ip access-list extended HOST-B
!    permit ip 192.168.2.0/30 any
!
!   route-map PBR-ISP1 permit 10
!    match ip address HOST-A
!    set ip next-hop 10.0.1.2
!
!   route-map PBR-ISP2 permit 10
!    match ip address HOST-B
!    set ip next-hop 10.0.2.2
!
!   interface eth1
!    ip policy route-map PBR-ISP1
!
!   interface eth2
!    ip policy route-map PBR-ISP2
!
! NOTE: PBR is applied INBOUND on the interface where traffic arrives.
!       The routing table is unchanged — PBR overrides next-hop selection only.
!       Traffic not matched by PBR falls through to normal routing table.
!
end
