frr version 8.5
frr defaults traditional
hostname isp2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ! Internet simulation target
 ip address 10.99.2.1/32
!
interface eth1
 ! Link to router: 10.0.2.0/30, isp2=.2
 ip address 10.0.2.2/30
!
! Static routes back to LAN subnets (needed for return traffic)
ip route 192.168.1.0/30 10.0.2.1
ip route 192.168.2.0/30 10.0.2.1
!
end
