frr version 8.5
frr defaults traditional
hostname isp1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ! Internet simulation target - both ISPs share reachability to 10.99.0.0/16
 ip address 10.99.1.1/32
!
interface eth1
 ! Link to router: 10.0.1.0/30, isp1=.2
 ip address 10.0.1.2/30
!
! Static routes back to LAN subnets (needed for return traffic)
ip route 192.168.1.0/30 10.0.1.1
ip route 192.168.2.0/30 10.0.1.1
!
end
