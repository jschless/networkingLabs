name: route-maps-pbr

# Policy-Based Routing (PBR) Lab
#
# Topology:
#
#   [host-a]   [host-b]
#       \         /
#       [router]
#       /         \
#    [isp1]     [isp2]
#
# host-a traffic -> router -> isp1  (PBR based on source IP)
# host-b traffic -> router -> isp2  (PBR based on source IP)
#
# IP addressing:
#   host-a:eth1  <-> router:eth1  = 192.168.1.0/30  (host-a=.1, router=.2)
#   host-b:eth1  <-> router:eth2  = 192.168.2.0/30  (host-b=.1, router=.2)
#   router:eth3  <-> isp1:eth1    = 10.0.1.0/30     (router=.1, isp1=.2)
#   router:eth4  <-> isp2:eth1    = 10.0.2.0/30     (router=.1, isp2=.2)
#
# Loopbacks:
#   isp1 = 10.99.1.1/32
#   isp2 = 10.99.2.1/32
#
# What you configure:
#   1. Static default route via isp1 (normal forwarding baseline)
#   2. PBR on router: host-a -> isp1, host-b -> isp2
#   3. Verify with traceroute from each host

topology:
  nodes:
    host-a:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/host-a/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - vtysh -b

    host-b:
      kind: linux
      image: frr-lab:local
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/host-b/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - vtysh -b

    router:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/router/startup-config

    isp1:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp1/startup-config

    isp2:
      kind: ceos
      image: ceos:4.35.2F
      startup-config: configs/isp2/startup-config

  links:
    - endpoints: ["host-a:eth1", "router:eth1"]   # 192.168.1.0/30
    - endpoints: ["host-b:eth1", "router:eth2"]   # 192.168.2.0/30
    - endpoints: ["router:eth3", "isp1:eth1"]     # 10.0.1.0/30
    - endpoints: ["router:eth4", "isp2:eth1"]     # 10.0.2.0/30
