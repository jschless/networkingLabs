# OpenLDAP client config for the LAM container.
# TLS_REQCERT never — LAM uses a simple bind over StartTLS, which requires
# the libldap client to trust the DC's cert. In Lab 01 there is no CA yet
# (that's Lab 03), so we skip cert verification. Lab 03 replaces this with
# a proper trust anchor.
TLS_REQCERT never
