networks:
  lab-corp:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/16

services:
  dc1:
    build:
      context: ../../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    # No host port publishing: every lab interaction with the DC happens either
    # over the lab-corp network (from admin-ws) or via `docker exec`. Publishing
    # 53/tcp+udp to the host collides with the host DNS resolver (mDNSResponder,
    # systemd-resolved) and blocks `up` on most machines. Only LAM exposes a host
    # port (8080) because you reach its web UI from a browser.
    volumes:
      - dc1-data:/var/lib/samba
      - ./configs/provision.sh:/provision.sh:ro
      - ./configs/smb.conf:/etc/samba/smb.conf.reference:ro
    privileged: true
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  lam:
    image: ghcr.io/ldapaccountmanager/lam:stable
    container_name: lam
    hostname: lam
    networks:
      lab-corp:
        ipv4_address: 10.100.1.11
    ports:
      - "8080:80"
    environment:
      - LDAP_DOMAIN=lab.corp
      - LDAP_BASE_DN=DC=lab,DC=corp
      - LDAP_SERVER=ldap://dc1.lab.corp
      - LDAP_TLS=yes
      - LAM_LANG=en_US
      - LAM_PASSWORD=lam
    volumes:
      # LAM's PHP LDAP extension (libldap) must skip cert verification until Lab 03
      # provisions a CA and issues a trusted DC certificate. Without this, StartTLS
      # fails because the DC presents a self-signed cert with no trusted issuer.
      - ./configs/lam-ldap.conf:/etc/ldap/ldap.conf:ro
    depends_on:
      - dc1

volumes:
  dc1-data:
  admin-ws-home:
