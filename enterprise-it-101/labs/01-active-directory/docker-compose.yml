networks:
  lab-corp:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/16

services:
  dc1:
    build:
      context: ../../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "88:88/tcp"
      - "88:88/udp"
      - "389:389/tcp"
      - "636:636/tcp"
      - "445:445/tcp"
    volumes:
      - dc1-data:/var/lib/samba
      - ./configs/provision.sh:/provision.sh:ro
      - ./configs/smb.conf:/etc/samba/smb.conf.reference:ro
    privileged: true
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  lam:
    image: ghcr.io/ldapaccountmanager/lam:stable
    container_name: lam
    hostname: lam
    networks:
      lab-corp:
        ipv4_address: 10.100.1.11
    ports:
      - "8080:80"
    environment:
      - LDAP_DOMAIN=lab.corp
      - LDAP_BASE_DN=DC=lab,DC=corp
      - LDAP_SERVER=ldap://dc1.lab.corp
      - LAM_LANG=en_US
      - LAM_PASSWORD=lam
    depends_on:
      - dc1

volumes:
  dc1-data:
  admin-ws-home:
