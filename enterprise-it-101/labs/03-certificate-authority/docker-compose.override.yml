# Lab 03 — Certificate Authority & PKI
#
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/03-certificate-authority/docker-compose.override.yml up -d
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so relative paths below are written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation. It also points its own
# resolver at the Samba DNS (itself) so it can resolve ca1.lab.corp once you
# add that record — the standard config for an AD DC.

name: eit101-lab03

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
      - ../labs/03-certificate-authority/configs/smb-tls.conf:/root/smb-tls.conf:ro
    privileged: true
    tty: true
    stdin_open: true

  ca1:
    image: smallstep/step-ca:latest
    container_name: ca1
    hostname: ca1
    networks:
      lab-corp:
        ipv4_address: 10.100.1.30
    environment:
      # One-time auto-init of the internal CA (see Task 1). In production you'd
      # run `step ca init` by hand; here the entrypoint does it on first boot so
      # the CA is reliably healthy. The provisioner is a JWK named "admin"
      # protected by this password (also the CA key password).
      DOCKER_STEPCA_INIT_NAME: "Lab Corp CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "ca1.lab.corp,ca1,localhost,127.0.0.1"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: "admin"
      DOCKER_STEPCA_INIT_PASSWORD: "P@ssw0rd1"
      DOCKER_STEPCA_INIT_ADDRESS: ":9000"
    volumes:
      - ca1-data:/home/step
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
    depends_on:
      - dc1
      - ca1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
  admin-ws-home:
  ca1-data:
