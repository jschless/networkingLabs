# Reference snippet for Task 4 — add these four lines inside the [global]
# section of /etc/samba/smb.conf on dc1, then `supervisorctl restart samba`.
#
# Paths point at the cert/key you issue from the CA and the root you bootstrap.
# (This file is mounted read-only at /root/smb-tls.conf so you can copy from it.)

	tls enabled  = yes
	tls keyfile  = /var/lib/samba/private/tls/dc1.key
	tls certfile = /var/lib/samba/private/tls/dc1.crt
	tls cafile   = /var/lib/samba/private/tls/ca.crt
