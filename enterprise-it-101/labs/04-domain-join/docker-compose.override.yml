# Lab 04 — Domain Join & Identity
#
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/04-domain-join/docker-compose.override.yml up -d
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so relative paths below are written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation. ws1 and ws2 start UNJOINED
# — joining them is the lab.

name: eit101-lab04

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
    privileged: true
    tty: true
    stdin_open: true

  ws1:
    image: workstation:local
    container_name: ws1
    hostname: ws1
    networks:
      lab-corp:
        ipv4_address: 10.100.10.11
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - ../labs/04-domain-join/configs/sssd.conf:/etc/sssd/sssd.conf.lab:ro
      - ../labs/04-domain-join/configs/wire-up-sssd.sh:/usr/local/bin/wire-up-sssd.sh:ro
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  ws2:
    image: workstation:local
    container_name: ws2
    hostname: ws2
    networks:
      lab-corp:
        ipv4_address: 10.100.10.12
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - ../labs/04-domain-join/configs/sssd.conf:/etc/sssd/sssd.conf.lab:ro
      - ../labs/04-domain-join/configs/wire-up-sssd.sh:/usr/local/bin/wire-up-sssd.sh:ro
    depends_on:
      - dc1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
