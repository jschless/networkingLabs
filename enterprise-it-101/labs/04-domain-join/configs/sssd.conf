# sssd configuration for a lab.corp domain member.
#
# This is the file `realm join` would generate for you on a systemd host.
# Read it — each directive maps to a decision about how this Linux box trusts
# and talks to Active Directory:
#
#   id_provider = ad      -> identities (users/groups) come from AD over LDAP
#   auth_provider = ad    -> passwords are checked by AD via Kerberos
#   access_provider = ad  -> AD decides who may log in
#   ldap_id_mapping = True-> SIDs are algorithmically mapped to POSIX UIDs/GIDs
#                            (no rfc2307 uidNumber needed in the directory)
#   cache_credentials     -> a successful login is cached for offline use
#   krb5_store_password_if_offline -> keep the credential usable while AD is down
#   use_fully_qualified_names -> log in as alice@lab.corp (Task 5 flips this)
#   fallback_homedir      -> where pam_mkhomedir creates home directories

[sssd]
domains = lab.corp
config_file_version = 2
services = nss, pam

[domain/lab.corp]
id_provider = ad
auth_provider = ad
access_provider = ad
ad_domain = lab.corp
krb5_realm = LAB.CORP
cache_credentials = True
krb5_store_password_if_offline = True
default_shell = /bin/bash
ldap_id_mapping = True
use_fully_qualified_names = True
fallback_homedir = /home/%u@%d
ad_gpo_access_control = permissive
