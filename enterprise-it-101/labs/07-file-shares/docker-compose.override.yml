# Lab 07 — File Shares & ACLs
#
# Layered on top of the foundation network in base/docker-compose.yml.
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/07-file-shares/docker-compose.override.yml up -d
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so every relative path below is written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation. fs1 reuses the samba-ad
# image but, instead of the DC entrypoint, runs fs1-setup.sh which joins the
# domain as a MEMBER server and starts smbd + winbindd. Configuring the shares
# and ACLs is the lab.

name: eit101-lab07

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
    privileged: true
    tty: true
    stdin_open: true

  fs1:
    image: samba-ad:local
    container_name: fs1
    hostname: fs1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.2.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    # Override the DC entrypoint: join as a member server and run smbd+winbindd.
    command: ["bash", "/usr/local/bin/fs1-setup.sh"]
    volumes:
      - ../labs/07-file-shares/configs/fs1-setup.sh:/usr/local/bin/fs1-setup.sh:ro
    privileged: true
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
    depends_on:
      - dc1
      - fs1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
  admin-ws-home:
