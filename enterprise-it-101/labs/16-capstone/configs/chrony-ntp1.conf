# ============================================================
# ntp1 — the lab's NTP server for lab.corp (CAPSTONE: working config).
#
# Lab 02 shipped this file deliberately broken (its only source was an
# unreachable TEST-NET address) so the student had to fix it. In the
# capstone the enterprise is already running, so ntp1 is authoritative:
# it uses its own system clock as a stratum-10 reference and serves the
# whole lab network. dc1 and the workstations sync from it.
# ============================================================

# No internet upstream in the lab, so ntp1 is its own reference clock.
local stratum 10

# Serve time to the whole lab network.
allow 10.100.0.0/16

driftfile /var/lib/chrony/chrony.drift
