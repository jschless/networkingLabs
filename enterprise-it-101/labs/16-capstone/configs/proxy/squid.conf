# Squid proxy for lab.corp (CAPSTONE: the completed Lab 11 config).
#
# Kerberos Negotiate authentication against AD + per-group access policy:
#   * engineering  -> unrestricted
#   * everyone else (e.g. finance) -> allowed EXCEPT webserver2.lab.corp
# The join script (squid-join.sh) has already joined the domain and minted
# /etc/squid/PROXY.keytab (HTTP/proxy1.lab.corp + the machine key the LDAP
# group helper binds with).
# ===========================================================================

http_port 3128

# --- Kerberos Negotiate authentication -------------------------------------
auth_param negotiate program /usr/lib/squid/negotiate_kerberos_auth -k /etc/squid/PROXY.keytab -s HTTP/proxy1.lab.corp@LAB.CORP
auth_param negotiate children 10
auth_param negotiate keep_alive on

# --- AD group-based access -------------------------------------------------
external_acl_type ad_engineering ttl=300 %LOGIN /usr/lib/squid/ext_kerberos_ldap_group_acl -g engineering
acl authenticated proxy_auth REQUIRED
acl in_engineering external ad_engineering
acl site_blocked dstdomain webserver2.lab.corp

# Order matters — first match wins.
http_access deny !authenticated
http_access allow in_engineering
http_access deny site_blocked
http_access allow authenticated
http_access deny all

# --- Given scaffolding -----------------------------------------------------
cache deny all
coredump_dir /var/spool/squid
access_log /var/log/squid/access.log
visible_hostname proxy1.lab.corp
