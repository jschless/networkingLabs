# RADIUS clients (NAS devices). The server answers a request ONLY from a client
# listed here, using the matching shared secret — Task 2.
#
# The shared secret is symmetric: identical on the NAS and here, or the server
# silently drops the request (you'll exploit that in Task 6).

client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
}

# nas1 — the switch/AP simulator, authorised as a RADIUS client (CAPSTONE).
client nas1 {
    ipaddr = 10.100.20.11
    secret = testing123
}
