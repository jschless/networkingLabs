# eapol_test config — PEAP with MSCHAPv2 inner (validated against AD).
# Run: eapol_test -c /eapol/peap-mschapv2.conf -a 10.100.20.10 -s testing123
# NOTE: eapol_test's -a takes the RADIUS server's IP, not a hostname (a hostname
# trips an assert in wpa_init_conf and aborts). radius1 is 10.100.20.10.
ctrl_interface=/tmp/wpa
ap_scan=0
network={
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="bob"
    password="P@ssw0rd1"
    phase2="auth=MSCHAPV2"
}
