# eapol_test config — EAP-TLS (certificate auth, no password).
# Uses the FreeRADIUS test client cert distributed to /eap-certs.
# Run: eapol_test -c /eapol/eap-tls.conf -a 10.100.20.10 -s testing123
# NOTE: eapol_test's -a takes the RADIUS server's IP, not a hostname.
ctrl_interface=/tmp/wpa
ap_scan=0
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="user@example.org"
    ca_cert="/eap-certs/ca.pem"
    client_cert="/eap-certs/client.pem"
    private_key="/eap-certs/client.key"
    private_key_passwd="whatever"
}
