// dns1 — Lab 06 resolver (GIVEN, you don't edit this).
//
// This is the Lab 05 resolver (recursion for internal clients + conditional
// forward of lab.corp to the AD DC) PLUS one new thing for this lab: an
// authoritative, dynamically-updatable zone `dhcp.lab.corp` that Kea writes
// to over TSIG. The shared TSIG key below must match the one Kea presents
// (see configs/kea-ddns.key — same secret).

include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

// Shared secret that authenticates Kea's dynamic updates. Same value as
// configs/kea-ddns.key — that's the whole point of TSIG.
key "kea-ddns" {
    algorithm hmac-sha256;
    secret "n9hKeZwVvOhCuSdgw9wVWbOnLTZ/hdQbk+8+P+B3rbs=";
};

acl internal-clients {
    10.100.1.0/24;
    10.100.2.0/24;
    10.100.3.0/24;
    10.100.10.0/24;
    localhost;
};

options {
    directory "/var/cache/bind";
    listen-on    { any; };
    listen-on-v6 { none; };

    recursion yes;
    allow-recursion { internal-clients; };
    forwarders { 8.8.8.8; 1.1.1.1; };

    dnssec-validation auto;
    validate-except { "lab.corp"; };
};

// Conditional forward to the AD DNS (Lab 05).
zone "lab.corp" {
    type forward;
    forward only;
    forwarders { 10.100.1.10; };
};

// The DHCP dynamic zone. `allow-update { key ... }` is what lets Kea write
// records here — and only with the right TSIG key.
zone "dhcp.lab.corp" {
    type master;
    file "/var/lib/bind/db.dhcp.lab.corp";
    allow-update { key "kea-ddns"; };
};
