# Lab 06 — DHCP & Dynamic DNS
#
# Layered on top of the foundation network in base/docker-compose.yml.
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/06-dhcp-dynamic-dns/docker-compose.override.yml up -d
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so every relative path below is written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation. dns1 is GIVEN scaffolding
# (the Lab 05 resolver + an authoritative, TSIG-updatable dhcp.lab.corp zone).
# dhcp1 (Kea) starts UNCONFIGURED — writing the DHCP + DDNS config is the lab.
# client1/client2 are DHCP clients (they need NET_ADMIN to apply a lease).

name: eit101-lab06

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
    privileged: true
    tty: true
    stdin_open: true

  dns1:
    build:
      context: ../images/bind9
    image: bind9:local
    container_name: dns1
    hostname: dns1
    networks:
      lab-corp:
        ipv4_address: 10.100.1.40
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    # Copy the given config + seed the (writable) dynamic zone into place, then
    # run named. The zone file must be writable by `bind` for dynamic updates,
    # so it can't be a read-only bind-mount.
    command:
      - bash
      - -c
      - |
        cp /lab/named.conf /etc/bind/named.conf
        mkdir -p /var/lib/bind
        cp /lab/db.dhcp.lab.corp /var/lib/bind/db.dhcp.lab.corp
        chown -R bind:bind /var/lib/bind
        named-checkconf || true
        exec /usr/sbin/named -g -c /etc/bind/named.conf -u bind
    volumes:
      - ../labs/06-dhcp-dynamic-dns/configs/dns1:/lab:ro
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  dhcp1:
    build:
      context: ../images/kea
    image: kea:local
    container_name: dhcp1
    hostname: dhcp1
    networks:
      lab-corp:
        ipv4_address: 10.100.1.50
    dns:
      - 10.100.1.40
    dns_search:
      - lab.corp
    # The TSIG key (read-only) is handed to you the way a DNS team would hand it
    # to whoever runs the DHCP server. You reference its secret in your Kea DDNS
    # config. Kea itself starts unconfigured — /etc/kea is empty.
    volumes:
      - ../labs/06-dhcp-dynamic-dns/configs/kea-ddns.key:/etc/kea/ddns.key:ro
    depends_on:
      - dns1
    tty: true
    stdin_open: true

  client1:
    image: workstation:local
    container_name: client1
    hostname: client1
    networks:
      lab-corp:
        ipv4_address: 10.100.10.51
    dns:
      - 10.100.1.40
    dns_search:
      - lab.corp
    # dhclient must be able to add the leased address to eth0; Docker's default
    # capability set omits NET_ADMIN, so a lease would be offered but never
    # applied (RTNETLINK: Operation not permitted).
    cap_add:
      - NET_ADMIN
    depends_on:
      - dhcp1
    tty: true
    stdin_open: true

  client2:
    image: workstation:local
    container_name: client2
    hostname: client2
    networks:
      lab-corp:
        ipv4_address: 10.100.10.52
    dns:
      - 10.100.1.40
    dns_search:
      - lab.corp
    cap_add:
      - NET_ADMIN
    depends_on:
      - dhcp1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
