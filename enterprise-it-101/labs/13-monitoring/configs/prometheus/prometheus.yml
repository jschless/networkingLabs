# Prometheus configuration — Lab 13 starting point.
#
# You will grow this file over the course of the lab:
#   - scrape jobs for the node exporters       (Task 3)
#   - blackbox probe jobs                      (Task 5)
#   - the alertmanager hookup                  (Task 8)
#
# After every edit, reload without restarting (from admin-ws):
#   curl -s -X POST http://prometheus.lab.corp:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules live in their own files — you write rules/alerts.yml in Task 7.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus always monitors itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
