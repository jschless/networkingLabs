# Lab 09 — Email Gateway
#
# Layered on top of the foundation network in base/docker-compose.yml.
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/09-email-gateway/docker-compose.override.yml up -d
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so every relative path below is written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation. mail1 (docker-mailserver)
# is wired to AD via LDAP (see configs/mailserver.env). AD users have no mail
# attribute yet — giving them one (so they can receive mail) is your first task.

name: eit101-lab09

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
    privileged: true
    tty: true
    stdin_open: true

  mail1:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mail1
    hostname: mail1.lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.2.20
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    env_file:
      - ../labs/09-email-gateway/configs/mailserver.env
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-log:/var/log/mail
      - mail-config:/tmp/docker-mailserver
      # user-patches.sh runs at startup (relaxes LDAP TLS verification);
      # mounted as a file over the config volume.
      - ../labs/09-email-gateway/configs/user-patches.sh:/tmp/docker-mailserver/user-patches.sh:ro
      - ../labs/09-email-gateway/configs/ssl:/tmp/dms/custom-certs:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
    depends_on:
      - dc1
      - mail1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
  admin-ws-home:
  mail-data:
  mail-state:
  mail-log:
  mail-config:
