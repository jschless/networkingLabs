# Lab 12 — RADIUS & AD Integration
#
# Layered on top of the foundation network in base/docker-compose.yml.
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/12-radius/docker-compose.override.yml up -d --build
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so every relative path below is written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation. radius1 joins the domain
# (for ntlm_auth/MSCHAPv2) and runs FreeRADIUS — you write its modules, clients,
# and VLAN policy. nas1 plays the role of a network access server / test client
# (it has radtest + eapol_test).

name: eit101-lab12

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
    privileged: true
    tty: true
    stdin_open: true

  radius1:
    build:
      context: ../images/freeradius-ad
    image: freeradius-ad:local
    container_name: radius1
    hostname: radius1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.20.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      RADIUS_DEBUG: "${RADIUS_DEBUG:-0}"
    volumes:
      - ../labs/12-radius/configs/radius-join.sh:/usr/local/bin/radius-join.sh:ro
      - ../labs/12-radius/configs/clients.conf:/etc/freeradius/3.0/clients.conf
      - ../labs/12-radius/configs/mods-available/ldap:/etc/freeradius/3.0/mods-available/ldap
      - ../labs/12-radius/configs/mods-available/eap:/etc/freeradius/3.0/mods-available/eap
      - ../labs/12-radius/configs/mods-available/mschap:/etc/freeradius/3.0/mods-available/mschap
      - ../labs/12-radius/configs/sites-available/default:/etc/freeradius/3.0/sites-available/default
      - ../labs/12-radius/configs/sites-available/inner-tunnel:/etc/freeradius/3.0/sites-available/inner-tunnel
      - radius-certs:/shared-certs
    command: ["bash", "/usr/local/bin/radius-join.sh"]
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  nas1:
    image: freeradius-ad:local
    container_name: nas1
    hostname: nas1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.20.11
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    extra_hosts:
      - "radius1.lab.corp:10.100.20.10"
    volumes:
      - radius-certs:/eap-certs:ro
      - ../labs/12-radius/configs/eapol:/eapol:ro
    command: ["sleep", "infinity"]
    depends_on:
      - radius1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
  radius-certs:
