# Lab 02 — NTP & Time Services
#
# Layered on top of the foundation network in base/docker-compose.yml.
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/02-ntp-time-services/docker-compose.override.yml up -d
#
# Compose uses the FIRST -f file's directory (base/) as the project
# directory, so every relative path below is written relative to base/.
#
# dc1 auto-provisions and seeds the Lab 01 foundation (OUs, alice/bob/
# charlie, groups) via the image entrypoint — no manual provisioning.

name: eit101-lab02

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
      - ../labs/02-ntp-time-services/configs/chrony-client.conf:/etc/chrony/chrony.conf:ro
    privileged: true
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
      - ../labs/02-ntp-time-services/configs/chrony-client.conf:/etc/chrony/chrony.conf:ro
    depends_on:
      - dc1
    tty: true
    stdin_open: true

  ntp1:
    image: workstation:local
    container_name: ntp1
    hostname: ntp1
    networks:
      lab-corp:
        ipv4_address: 10.100.1.20
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    # Copy the (deliberately broken) lab config into place so you can edit
    # it in-container without changing the repo file, then idle. You start
    # chronyd by hand in Task 2.
    command: ["bash", "-c", "cp /etc/chrony/lab-ntp1.conf /etc/chrony/chrony.conf && exec sleep infinity"]
    volumes:
      - ../labs/02-ntp-time-services/configs/chrony-ntp1.conf:/etc/chrony/lab-ntp1.conf:ro
    depends_on:
      - dc1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
  admin-ws-home:
