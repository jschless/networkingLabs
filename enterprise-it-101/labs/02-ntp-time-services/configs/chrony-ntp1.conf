# ============================================================
# ntp1 — the lab's NTP server for lab.corp.
#
# This config is DELIBERATELY BROKEN: the only time source it knows
# about is unreachable, so chrony never reaches a synchronised state
# and therefore refuses to serve time to clients. Your job in Task 2
# is to diagnose that from `chronyc` output and make ntp1 a valid
# source for the lab network.
# ============================================================

# The only upstream source — but 192.0.2.10 is a TEST-NET-1 address
# (RFC 5737), a documentation black hole that never answers. chrony will
# mark it unreachable and stay unsynchronised.
server 192.0.2.10 iburst

# Serve time to the whole lab network.
allow 10.100.0.0/16

driftfile /var/lib/chrony/chrony.drift

# --- The fix lives here (commented out on purpose) ---------------------
# The lab has no internet upstream, so make ntp1 authoritative using its
# own system clock as a fallback reference. `local stratum 10` tells
# chrony "even with no external source, consider yourself a usable clock
# at stratum 10 so you can serve clients." Uncomment to fix:
#
# local stratum 10
