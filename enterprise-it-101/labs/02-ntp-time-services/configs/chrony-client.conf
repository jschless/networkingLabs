# ============================================================
# NTP client config for dc1 and admin-ws.
#
# Both point at the lab NTP server ntp1 (10.100.1.20). This is the
# "correct" client config — you don't need to edit it; you'll just
# start chrony and verify the source with `chronyc sources`.
# ============================================================

# Use the lab NTP server. iburst sends a fast initial burst so the
# first sync happens in seconds instead of minutes.
server 10.100.1.20 iburst

driftfile /var/lib/chrony/chrony.drift

# NOTE: in this lab chrony runs with `-x` (no clock control). Every
# container shares the host kernel clock, so chrony cannot independently
# step a container's time — it reports sync state and offset, which is
# what we observe here. The actual clock-skew lesson (Task 4-5) is shown
# with `faketime`, which fakes time for a single process.
