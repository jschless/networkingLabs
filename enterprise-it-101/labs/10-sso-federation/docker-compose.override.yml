# Lab 10 — SSO & Federation
#
# Layered on top of the foundation network in base/docker-compose.yml.
# Run from the enterprise-it-101/ directory:
#
#   docker compose -f base/docker-compose.yml \
#                  -f labs/10-sso-federation/docker-compose.override.yml up -d --build
#
# Compose uses the FIRST -f file's directory (base/) as the project directory,
# so every relative path below is written relative to base/.
#
# dc1 auto-provisions + seeds the Lab 01 foundation (alice/bob/charlie, the
# engineering/finance groups). keycloak is the IdP; you federate it to AD and
# wire the sample-app to it via OIDC. postgres-kc is Keycloak's database.
#
# certfetch is throwaway scaffolding: it grabs dc1's auto-generated LDAPS
# certificate into a shared volume so Keycloak trusts ldaps://dc1.lab.corp when
# you point User Federation at it. It exits as soon as the cert is captured.

name: eit101-lab10

services:
  dc1:
    build:
      context: ../images/samba-ad
    image: samba-ad:local
    container_name: dc1
    hostname: dc1
    domainname: lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.1.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      AUTO_PROVISION: "true"
      SAMBA_AUTOSTART: "true"
    volumes:
      - dc1-data:/var/lib/samba
    privileged: true
    tty: true
    stdin_open: true

  certfetch:
    build:
      context: ../images/workstation
    image: workstation:local
    container_name: certfetch
    networks:
      lab-corp:
        ipv4_address: 10.100.2.33
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    depends_on:
      - dc1
    volumes:
      - kc-trust:/trust
    command:
      - bash
      - -c
      - |
        echo "==> [certfetch] waiting for dc1 LDAPS (636) and capturing its cert..."
        until echo | openssl s_client -connect dc1.lab.corp:636 2>/dev/null \
                   | openssl x509 -out /trust/dc1.pem 2>/dev/null && [ -s /trust/dc1.pem ]; do
          sleep 3
        done
        echo "==> [certfetch] captured dc1 LDAPS cert into the keycloak truststore."

  postgres-kc:
    image: postgres:15
    container_name: postgres-kc
    networks:
      lab-corp:
        ipv4_address: 10.100.2.32
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc-db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    hostname: keycloak.lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.2.30
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    depends_on:
      postgres-kc:
        condition: service_started
      certfetch:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-kc:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One canonical name + port for BOTH the browser redirect and the app's
      # server-side token call (see README host-setup step). The published port
      # equals the container port so http://keycloak.lab.corp:8088 resolves the
      # same way from your host browser and from inside the lab network.
      KC_HTTP_PORT: "8088"
      KC_HOSTNAME: http://keycloak.lab.corp:8088
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Trust dc1's self-signed LDAPS cert (captured by certfetch).
      KC_TRUSTSTORE_PATHS: /trust
    volumes:
      - kc-trust:/trust:ro
    ports:
      - "8088:8088"
    command: ["start-dev"]
    tty: true
    stdin_open: true

  sample-app:
    build:
      context: ../labs/10-sso-federation/configs/sample-app
    image: sample-app:local
    container_name: sample-app
    hostname: sample-app.lab.corp
    networks:
      lab-corp:
        ipv4_address: 10.100.2.31
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    environment:
      OIDC_DISCOVERY_URL: http://keycloak.lab.corp:8088/realms/lab-corp/.well-known/openid-configuration
      OIDC_CLIENT_ID: sample-app
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-changeme}"
      FLASK_SECRET: lab-corp-dev-secret
      APP_PORT: "8089"
    depends_on:
      - keycloak
    ports:
      - "8089:8089"
    tty: true
    stdin_open: true

  admin-ws:
    build:
      context: ../images/workstation
    image: workstation:local
    container_name: admin-ws
    hostname: admin-ws
    networks:
      lab-corp:
        ipv4_address: 10.100.10.10
    dns:
      - 10.100.1.10
    dns_search:
      - lab.corp
    volumes:
      - admin-ws-home:/home
    depends_on:
      - dc1
    tty: true
    stdin_open: true

volumes:
  dc1-data:
  admin-ws-home:
  kc-db:
  kc-trust:
