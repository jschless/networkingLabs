// Top-level BIND configuration.
//
// NOTE: the default Ubuntu install also includes named.conf.default-zones
// (root hints, localhost forward/reverse) here. We deliberately leave that
// out: once you introduce `view` statements (Task 3) BIND requires that
// *every* zone live inside a view, and the bundled default-zones would
// conflict. Starting clean keeps the lab focused on the zones you build.

include "/etc/bind/rndc.key";

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
