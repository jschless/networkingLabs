# System-wide OpenLDAP client defaults for the lab workstation.
#
# SASL_NOCANON disables the reverse-DNS host canonicalisation that cyrus-sasl
# performs before a GSSAPI (Kerberos) bind. The lab DC has no PTR record, so
# canonicalisation would rewrite the target host to its IP and request a
# non-existent SPN (ldap/10.100.1.10), failing with "Server not found in
# Kerberos database". With NOCANON on, ldapsearch uses the name you pass on the
# command line (dc1.lab.corp), whose SPN (ldap/dc1.lab.corp) exists.
SASL_NOCANON on

# Trust anchor for LDAPS / StartTLS (used from Lab 03 onward). OpenLDAP does
# NOT consult the OS trust store unless told to, so point it at the system CA
# bundle. Lab 03 installs the internal CA's root into that bundle
# (`step ca bootstrap --install` + update-ca-certificates); until then, an
# ldaps:// bind fails because the DC's certificate chains to an untrusted root.
# This only affects TLS connections — the Lab 01 GSSAPI-over-ldap:// flow is
# unaffected.
TLS_CACERT /etc/ssl/certs/ca-certificates.crt
