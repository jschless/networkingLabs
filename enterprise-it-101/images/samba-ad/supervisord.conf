[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:samba]
command=/usr/sbin/samba --foreground --no-process-group
; Lab 01 leaves this false (the Dockerfile default) so the student
; provisions the domain, then runs `supervisorctl start samba`.
; Labs 02+ set SAMBA_AUTOSTART=true so the auto-provisioned DC comes up
; already running, with no manual step.
autostart=%(ENV_SAMBA_AUTOSTART)s
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/samba-stdout.log
stderr_logfile=/var/log/supervisor/samba-stderr.log

[program:chrony]
; Used by Lab 02 (NTP). Off by default so it has no effect on Lab 01.
; Lab 02 starts it with `supervisorctl start chrony` after writing
; /etc/chrony/chrony.conf.
; -x = do not try to discipline the clock. All containers share the host
; kernel clock, so chrony here is for the NTP hierarchy + `chronyc` tooling,
; not for actually stepping time (see Lab 02 README).
command=/usr/sbin/chronyd -d -x -f /etc/chrony/chrony.conf
autostart=%(ENV_CHRONY_AUTOSTART)s
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/chrony-stdout.log
stderr_logfile=/var/log/supervisor/chrony-stderr.log
